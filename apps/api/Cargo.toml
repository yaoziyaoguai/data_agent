[package]
name = "data-agent-api"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
data-agent = { path = "../../crates/data-agent" }
axum = "=0.8.9"
tokio = { version = "=1.53.1", features = ["macros", "rt-multi-thread", "net", "signal"] }
serde_json = "=1.0.151"
sqlx = { version = "=0.9.0", default-features = false, features = ["mysql", "runtime-tokio", "tls-rustls-ring"] }

reqwest = { version = "=0.13.5", default-features = false, features = ["json", "rustls"] }
