  function methodChoices(items,publish=false){return items.map(item=>`<div class="method-choice"><span class="asset-icon">${icon('spark')}</span><div><h3>${item.name}</h3><p>${item.description}</p></div><button class="button" data-action="${publish?'publish-skill':'choose-skill'}" data-id="${item.id}">${publish?'发布':'选用'}</button></div>`).join('');}

  function openAssetDetail(id){const item=currentAssets().find(item=>item.id===id);if(!item)return;const isMemory=state.assetTab==='memories',isPublic=state.assetTab==='public';modal(item.name,isMemory?'个人记忆 · 仅你可用':isPublic?'空间公共 Skill':'我的 Skill · 个人分析方法',`<div class="evidence-meta"><span class="status-label ${item.enabled?'':'neutral'}">${item.enabled?'已启用':'已停用'}</span><span>${item.updated}更新</span></div><div class="asset-detail-label">${isMemory?'记住的内容':'分析步骤'}</div><div class="method-content">${esc(item.content)}</div><div class="asset-detail-label">适用范围</div><p class="asset-detail-title">${esc(item.scope)}</p><details class="metadata-details"><summary>来源与维护信息</summary><p>${isMemory?'来自你明确保存的偏好与纠错，仅用于你的对话。':`负责人：${esc(item.owner||'Alice')}。${isPublic?'空间成员可以选用，修改由负责人或超级维护者完成。':'发布到公共空间前仅自己可用。'}`}</p></details>`,`<button class="text-button" data-action="toggle-asset" data-id="${id}">${item.enabled?'停用':'启用'}</button><span style="flex:1"></span>${!isMemory?`<button class="button" data-action="choose-skill" data-id="${id}">用于对话</button>`:''}<button class="button primary" data-action="edit-asset" data-id="${id}">${icon('edit')}编辑</button>`);}
  function documentText(id){if(state.documentDrafts[id])return state.documentDrafts[id];const doc=docs[id]||docs['revenue-doc'];return `${doc.intro}\n\n${doc.sections.map(([title,text])=>`## ${title}\n\n${text}`).join('\n\n')}`;}
  function startEditor(kind,item=null){const fresh=!item||item.fresh;const isSkill=kind==='skill',isDoc=kind==='document',isField=kind==='field',isObject=kind==='object';const title=isSkill?(fresh?'新建分析方法':'编辑分析方法'):isDoc?(fresh?'新建业务文档':'编辑业务文档'):kind==='metric'?'新建指标口径':isField?`编辑字段含义`:(isObject?'编辑表说明':fresh?'新增个人记忆':'编辑个人记忆');const name=item?.name||'',content=isDoc?(fresh?'':documentText(item.id)):item?.content||item?.meaning||item?.description||'',scope=item?.scope||'';
    modal(title,isField?esc(name):isSkill?'保存为你的个人 Skill，可在对话中选用':isDoc?'整篇维护，保存后更新正文':'保存后更新当前内容',`${isSkill&&fresh?`<div id="template-region"><div class="template-label">从模板开始</div><div class="templates">${templates.map((template,index)=>`<button class="template-button" data-action="apply-template" data-index="${index}">${icon(template.icon)}<strong>${template.name}</strong><small>${template.description}</small></button>`).join('')}</div></div>`:''}<form id="editor-form"><label class="form-field" ${isField?'hidden':''}><span>名称<small>必填</small></span><input name="name" id="editor-name" value="${esc(name)}" placeholder="给它一个容易找到的名字" ${isField?'':'required'}></label>${isDoc?'<div class="document-mode segmented"><button type="button" data-action="document-mode" data-value="edit" aria-selected="true">编辑</button><button type="button" data-action="document-mode" data-value="preview" aria-selected="false">阅读预览</button></div>':''}<label class="form-field" id="editor-content-field"><span>${isField?'业务含义':isSkill?'分析步骤与注意事项':isDoc?'文档正文':kind==='metric'?'定义与计算口径':isObject?'这张表记录什么':'记住的内容'}<small>必填</small></span><textarea id="editor-body" name="content" class="${isDoc?'document-editor':''}" required>${esc(content)}</textarea>${isField?'<small>说明字段代表什么，以及使用时需要注意的单位、取值或时间含义。</small>':''}</label><div id="document-preview" class="document-content" hidden></div>${isSkill||kind==='memory'?`<label class="form-field"><span>适用范围<small>必填</small></span><input id="editor-scope" name="scope" value="${esc(scope)}" placeholder="例如：月度收入分析" required></label>`:''}${isSkill?'<label class="check-label"><input type="checkbox" name="verified">我已核对内容 <span style="color:var(--muted)">（可选）</span></label>':''}<p class="error-message" id="editor-error" hidden></p></form>`,`<span class="modal-footer-note" id="editor-state">${isField||isObject||isDoc?'人工修改会单独保留':'仅自己可用，可随时编辑'}</span><button class="button" data-action="close-modal">取消</button><button class="button primary" data-action="save-editor">保存${isSkill?' Skill':'修改'}</button>`);
    dialog.classList.toggle('skill-editor',isSkill);state.editing={kind,item,dirty:false,fresh};
  }
  function markDirty(){if(!state.editing)return;state.editing.dirty=true;$('#editor-state').textContent='有未保存的修改';$('#editor-state').classList.add('unsaved-indicator');}
  function saveEditor(){const edit=state.editing;if(!edit)return;const form=$('#editor-form');if(!form.reportValidity())return;const values=Object.fromEntries(new FormData(form));if(!values.content.trim()||(!values.name.trim()&&edit.kind!=='field')){$('#editor-error').hidden=false;$('#editor-error').textContent='名称和正文需要填写实际内容。';return;}
    if(edit.kind==='field')edit.item.meaning=values.content.trim();else if(edit.kind==='document'){if(edit.fresh){edit.item={id:'doc-'+Date.now(),kind:'document',physical:'业务文档',name:values.name.trim(),description:values.content.split('\n')[0]};objects.push(edit.item);}else edit.item.name=values.name.trim();state.documentDrafts[edit.item.id]=values.content;}else if(edit.kind==='metric'){objects.push({id:'metric-'+Date.now(),kind:'metric',physical:'自定义指标',name:values.name.trim(),description:values.content});}else if(edit.kind==='object'){edit.item.name=values.name.trim();edit.item.description=values.content.trim();}else{const list=edit.kind==='memory'?memoryItems:skillItems;if(edit.item)Object.assign(edit.item,{name:values.name.trim(),content:values.content,scope:values.scope,updated:'刚刚'});else list.unshift({id:`${edit.kind}-${Date.now()}`,name:values.name.trim(),description:values.content.split('\n')[0].replace(/^\d+\.\s*/,''),content:values.content,scope:values.scope,updated:'刚刚',enabled:true});}
    closeModal();if(state.view==='knowledge')renderKnowledge();if(state.view==='assets')renderAssets();toast('修改已保存');
  }
  function showHistory(){modal('全部对话','查找之前的问题，接着聊',`<label class="search-box history-search">${icon('search')}<input id="history-search" aria-label="搜索全部对话" placeholder="搜索标题或关键词"></label><div id="history-results">${historyRows(conversationHistory)}</div>`,`<button class="button" data-action="close-modal">返回对话</button>`);}
  function historyRows(items){return items.map(item=>`<div class="history-modal-row"><button class="history-open" data-action="open-history" data-id="${item.id}"><strong>${item.name}</strong><small>${item.time} · 零售分析空间</small></button><button class="icon-button" data-action="remove-history" data-id="${item.id}" aria-label="移除对话 ${item.name}">${icon('trash')}</button></div>`).join('')||'<div class="empty-state"><p>没有找到相关对话</p></div>';}
  function download(){const csv='\uFEFF付款日期,净收入（元）,支付订单数\n'+rows.map(row=>`${row.date},${(row.cents/100).toFixed(2)},${row.orders}`).join('\n');const url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8;'}));const anchor=document.createElement('a');anchor.href=url;anchor.download='1月App每日净收入.csv';anchor.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('已下载 31 行数据');}
  async function copySql(){try{await navigator.clipboard.writeText(sql);toast('SQL 已复制');}catch{const area=document.createElement('textarea');area.value=sql;document.body.append(area);area.select();const copied=document.execCommand('copy');area.remove();toast(copied?'SQL 已复制':'可在 SQL 区域选中并复制');}}
  function navigate(hash){location.hash=hash;}
  function route(){const parts=location.hash.slice(1).split('/');state.view=['knowledge','assets'].includes(parts[0])?parts[0]:'workbench';state.object=objects.some(item=>item.id===parts[1])?parts[1]:'orders';state.tab=parts[2]||'overview';if(state.view==='assets')state.assetTab=['memories','skills','public'].includes(parts[1])?parts[1]:'memories';if(state.view==='workbench'&&parts[1]){state.conversation=parts[1]==='new'?'new':parts[1];state.newConversation=parts[1]==='new';}lastRoute=location.hash;
    document.querySelectorAll('[data-nav]').forEach(node=>{if(node.dataset.nav===state.view)node.setAttribute('aria-current','page');else node.removeAttribute('aria-current');});$('#workspace-view').hidden=state.view!=='workbench';$('#knowledge-view').hidden=state.view!=='knowledge';$('#assets-view').hidden=state.view!=='assets';$('#breadcrumb-section').textContent={workbench:'工作台',knowledge:'语义管理',assets:'我的积累'}[state.view];$('#breadcrumb-title').textContent=state.view==='workbench'?(state.newConversation?'新对话':conversationHistory.find(item=>item.id===state.conversation)?.name||'1 月 App 收入分析'):'零售分析空间';$('#topbar-actions').innerHTML=state.view==='workbench'?`<button class="text-button" data-action="history">${icon('clock')}<span>会话记录</span></button>`:'<span class="topbar-note">共享知识，个人积累</span>';$('#sidebar').classList.remove('is-open');syncSidebarState();if(state.view==='knowledge')renderKnowledge();else if(state.view==='assets')renderAssets();else renderConversation();}
  function syncSidebarState(){const sidebar=$('#sidebar');sidebar.inert=window.innerWidth<=600&&!sidebar.classList.contains('is-open');$('.mobile-menu').setAttribute('aria-expanded',String(sidebar.classList.contains('is-open')));}
  document.addEventListener('click',event=>{
    if(event.target.closest('.skip-link')){event.preventDefault();$('#main').focus();return;}
    const target=event.target.closest('[data-action]');if(!target)return;const {action,id,value,index}=target.dataset;
    if(['doc-section','asset-detail'].includes(action))event.preventDefault();
    switch(action){
      case 'menu':$('#sidebar').classList.toggle('is-open');syncSidebarState();break;
      case 'new-chat':state.messages=[];state.newConversation=true;state.conversation='new';navigate('workbench/new');if(location.hash==='#workbench/new')route();$('#message-input').focus();break;
      case 'conversation':state.messages=[];state.newConversation=false;state.conversation=id;document.querySelectorAll('.history-item').forEach(node=>node.classList.toggle('selected',node.dataset.id===id));navigate(`workbench/${id}`);break;
      case 'starter':$('#message-input').value=target.dataset.text;resizeComposer();$('#message-input').focus();break;
      case 'copy-sql':copySql();break;
      case 'show-sql':modal('最终执行的 SQL','1 月 App 每日净收入',sqlBlock(),'<button class="button primary" data-action="close-modal">返回结果</button>');break;
      case 'download':download();break;
      case 'result-view':state.resultView=value;preserveConversationScroll(renderConversation);break;
      case 'evidence':showEvidence();break;
      case 'close-modal':requestClose();break;
      case 'maintain-evidence':requestClose(()=>navigate('knowledge/revenue/overview'));break;
      case 'history':showHistory();break;
      case 'open-history':closeModal();state.messages=[];state.conversation=id;state.newConversation=false;navigate(`workbench/${id}`);break;
      case 'remove-history':{const entry=conversationHistory.find(item=>item.id===id);modal('移除这条对话？',esc(entry?.name),'<p class="definition">移除后，这条对话会从当前列表中消失。</p>',`<button class="button" data-action="history">返回列表</button><button class="button danger" data-action="confirm-remove-history" data-id="${id}">移除对话</button>`,true);break;}
      case 'confirm-remove-history':conversationHistory.splice(conversationHistory.findIndex(item=>item.id===id),1);document.querySelector(`.history-item[data-id="${id}"]`)?.remove();showHistory();toast('已从列表移除');break;
      case 'select-skill':showMethods();break;
      case 'method-scope':{const publish=$('#method-choices').dataset.publishing==='true';$('#method-choices').innerHTML=methodChoices(value==='public'?publicItems:skillItems,publish);target.parentElement.querySelectorAll('[role=tab]').forEach(node=>node.setAttribute('aria-selected',String(node===target)));break;}
      case 'choose-skill':state.selectedSkill=id;closeModal();renderSelectedSkill();if(state.view!=='workbench')navigate(`workbench/${state.conversation}`);$('#message-input').focus();toast('分析方法已用于当前对话');break;
      case 'remove-skill':state.selectedSkill=null;renderSelectedSkill();break;
      case 'publish-skill':{const item=skillItems.find(item=>item.id===id);if(!item)break;modal('发布到空间公共 Skill',esc(item.name),`<p class="definition">本空间成员将可以选用这个分析方法。发布会创建一个独立副本，个人版本仍保留。你将成为公共副本的负责人。</p>`,`<button class="button" data-action="new-asset">返回选择</button><button class="button primary" data-action="confirm-publish" data-id="${id}">发布公共副本</button>`,true);break;}
      case 'confirm-publish':{const item=skillItems.find(item=>item.id===id);publicItems.unshift({...item,id:`public-${Date.now()}`,owner:'Alice',updated:'刚刚'});closeModal();renderAssets();toast('公共副本已发布');break;}
      case 'model-info':modal('模型与思考强度','从下一条消息开始使用','<p class="definition">Flash 适合日常查询，Pro 可用于需要更深入推理的问题。较高的思考强度通常需要更多等待时间和用量。</p><p class="definition" style="margin-top:15px">已经开始的回复和查询会沿用原来的设置。</p>','<button class="button primary" data-action="close-modal">知道了</button>',true);break;
      case 'stop-query':{const query=state.queries.find(item=>item.id===id);if(query){clearTimeout(query.timer);query.status='stopped';preserveConversationScroll(renderConversation);toast('这条查询已停止');}break;}
      case 'query-result':modal('1 月 App 每日净收入','查询完成 · 31 行',resultTable()+sqlBlock(),'<button class="button" data-action="download">下载全部数据</button><button class="button primary" data-action="close-modal">返回对话</button>');break;
      case 'directory':$('.knowledge-layout').classList.toggle('directory-visible');break;
      case 'knowledge-tab':navigate(`knowledge/${state.object}/${id}`);break;
      case 'edit-field':startEditor('field',objectById().fields.find(item=>item.name===target.dataset.name));break;
      case 'edit-object':{const obj=objectById();startEditor(obj.kind==='document'?'document':'object',obj);break;}
      case 'doc-section':$(`#doc-section-${index}`)?.scrollIntoView({behavior:'smooth',block:'start'});break;
      case 'asset-tab':state.assetSearch='';navigate(`assets/${id}`);break;
      case 'asset-detail':openAssetDetail(id);break;
      case 'edit-asset':startEditor(state.assetTab==='memories'?'memory':'skill',currentAssets().find(item=>item.id===id));break;
      case 'toggle-asset':{const item=currentAssets().find(item=>item.id===id);item.enabled=!item.enabled;renderAssets();openAssetDetail(id);toast(item.enabled?'已启用':'已停用');break;}
      case 'new-asset':state.assetTab==='public'?showMethods(true):startEditor(state.assetTab==='memories'?'memory':'skill');break;
      case 'clear-search':state.assetSearch='';$('#asset-search').value='';renderAssetList();break;
      case 'save-editor':saveEditor();break;
      case 'apply-template':{const template=templates[Number(index)];$('#editor-name').value=template.name;$('#editor-body').value=template.content;$('#editor-scope').value=template.scope;$('#template-region').innerHTML=`<div class="template-applied">${icon('check')}已采用「${template.name}」<button class="link-button" data-action="change-template">更换模板</button></div>`;markDirty();break;}
      case 'change-template':$('#template-region').innerHTML=`<div class="templates">${templates.map((template,i)=>`<button class="template-button" data-action="apply-template" data-index="${i}">${icon(template.icon)}<strong>${template.name}</strong><small>${template.description}</small></button>`).join('')}</div>`;break;
      case 'document-mode':$('#editor-content-field').hidden=value==='preview';$('#document-preview').hidden=value!=='preview';$('#document-preview').innerHTML=renderDocumentText($('#editor-body').value);target.parentElement.querySelectorAll('button').forEach(node=>node.setAttribute('aria-selected',String(node===target)));break;
      case 'maintenance':modal('语义维护','零售分析空间',`<div class="method-choice">${icon('layers')}<div><h3>来源同步</h3><p>元数据、血缘与节点 SQL 汇总到同一个表对象。</p></div><button class="button" data-action="source-detail">查看来源</button></div><div class="method-choice">${icon('check')}<div><h3>人工维护受保护</h3><p>重新预填不会覆盖已保存的人工修改。</p></div></div>`,'<button class="button" data-action="close-modal">关闭</button>',true);break;
      case 'source-detail':modal('订单收入明细的来源','mart.order_revenue','<ul class="plain-list"><li>Datasight：表结构、维护人和字段类型。</li><li>节点 SQL：加工逻辑、金额分摊和过滤条件。</li><li>人工说明：付款归属、退款处理与适用场景。</li></ul>','<button class="button" data-action="close-modal">关闭</button>',true);break;
      case 'new-knowledge':modal('新建语义内容','独立内容由首次录入的人负责',`<a class="related-row" href="#" data-action="new-document">${icon('document')}<div><strong>业务文档</strong><p>整篇记录一张表或多张表的业务说明</p></div>${icon('chevron')}</a><a class="related-row" href="#" data-action="new-metric">${icon('metric')}<div><strong>指标口径</strong><p>记录定义、条件与计算方式</p></div>${icon('chevron')}</a>`,'<button class="button" data-action="close-modal">取消</button>',true);break;
      case 'new-document':event.preventDefault();startEditor('document',{fresh:true,name:'',id:'new-document'});break;
      case 'new-metric':event.preventDefault();startEditor('metric');break;
      case 'account':modal('Alice','零售分析空间 · 超级维护者','<div class="account-role-description">当前最高角色：<strong>超级维护者</strong><ul><li>可以维护本空间的全部共享语义。</li><li>可以调整指标、文档和公共 Skill 的负责人。</li><li>Datasight 的取数和 SQL 执行权限独立校验。</li></ul></div>','<button class="button primary" data-action="close-modal">关闭</button>',true);break;
    }
  });
  document.addEventListener('input',event=>{const input=event.target;if(input.id==='knowledge-search'){state.directorySearch=input.value;renderDirectory();}if(input.id==='field-search')$('#field-rows').innerHTML=fieldRows(objectById().fields.filter(item=>`${item.name} ${item.meaning}`.toLowerCase().includes(input.value.toLowerCase())));if(input.id==='asset-search'){state.assetSearch=input.value;renderAssetList();}if(input.id==='history-search')$('#history-results').innerHTML=historyRows(conversationHistory.filter(item=>item.name.includes(input.value)));if(input.closest('#editor-form'))markDirty();if(input.id==='message-input')resizeComposer();});
  document.addEventListener('change',event=>{if(event.target.id==='directory-filter'){state.directoryFilter=event.target.value;renderDirectory();}if(event.target.id==='model-select'){state.model=event.target.value;const options=state.model==='flash'?[['off','关闭'],['low','轻度'],['high','深度'],['max','最高']]:[['off','关闭'],['high','深度'],['max','最高']];if(!options.some(([value])=>value===state.thinking))state.thinking='high';$('#thinking-select').innerHTML=options.map(([value,label])=>`<option value="${value}">${label}</option>`).join('');$('#thinking-select').value=state.thinking;toast('模型设置将从下一条消息生效');}if(event.target.id==='thinking-select'){state.thinking=event.target.value;toast('思考强度将从下一条消息生效');}});
  document.addEventListener('keydown',event=>{if(event.target.matches('.asset-row')&&(event.key==='Enter'||event.key===' ')){event.preventDefault();event.target.click();}const tab=event.target.closest('[role=tab]');if(tab&&['ArrowRight','ArrowLeft','Home','End'].includes(event.key)){event.preventDefault();const siblings=[...tab.parentElement.querySelectorAll('[role=tab]')],current=siblings.indexOf(tab),next=event.key==='Home'?0:event.key==='End'?siblings.length-1:(current+(event.key==='ArrowRight'?1:-1)+siblings.length)%siblings.length;const action=siblings[next].dataset.action,id=siblings[next].dataset.id,value=siblings[next].dataset.value;siblings[next].click();requestAnimationFrame(()=>document.querySelector(`[data-action="${action}"][data-${id?'id':'value'}="${id||value}"]`)?.focus());}if(event.target.id==='message-input'&&event.key==='Enter'&&!event.shiftKey&&!event.isComposing){event.preventDefault();sendMessage();}});
  $('#composer-form').addEventListener('submit',event=>{event.preventDefault();sendMessage();});
  dialog.addEventListener('cancel',event=>{event.preventDefault();requestClose();});dialog.addEventListener('click',event=>{if(event.target===dialog){const rect=dialog.getBoundingClientRect();if(event.clientX<rect.left||event.clientX>rect.right||event.clientY<rect.top||event.clientY>rect.bottom)requestClose();}});
  $('#keep-editing').addEventListener('click',()=>{discardDialog.close();discardAction=null;$('#editor-body')?.focus();});$('#discard-editing').addEventListener('click',()=>{discardDialog.close();const action=discardAction;discardAction=null;action?.();});
  window.addEventListener('beforeunload',event=>{if(state.editing?.dirty){event.preventDefault();event.returnValue='';}});
  window.addEventListener('hashchange',()=>{if(state.editing?.dirty){const destination=location.hash;window.history.replaceState(null,'',lastRoute);requestClose(()=>navigate(destination));}else route();});
  // 复用预览技能的文本测量，只调整输入框高度，不改写用户输入。
  function resizeComposer(){const input=$('#message-input');if(window.Pretext&&document.fonts.status==='loaded'){const style=getComputedStyle(input),width=Math.max(160,input.clientWidth-8),font=`${style.fontSize} ${style.fontFamily}`;const prepared=window.Pretext.prepare(input.value||'继续提问',font);const result=window.Pretext.layout(prepared,width,parseFloat(style.lineHeight));input.style.height=`${Math.max(44,Math.min(145,result.height+7))}px`;}else{input.style.height='44px';input.style.height=`${Math.min(145,Math.max(44,input.scrollHeight))}px`;}}
  window.addEventListener('resize',syncSidebarState);hydrateIcons();route();renderSelectedSkill();document.fonts.ready.then(resizeComposer);new ResizeObserver(resizeComposer).observe($('.composer'));$('#conversation').classList.add('initial-view');$('#conversation').addEventListener('animationend',()=>$('#conversation').classList.remove('initial-view'),{once:true});
})();

</script>
