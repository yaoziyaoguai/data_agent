    <text x="35" y="82" font-size="34" font-weight="650" fill="#172e50" text-anchor="start" >个人记忆的提取与采用</text>
    <text x="35" y="112" font-size="19" font-weight="400" fill="#607086" text-anchor="start" >Mem0 先提取候选；Rust 校验并正式保存后，Worker 提交可检索版本。</text>
    <text x="1885" y="38" font-size="15" font-weight="500" fill="#607086" text-anchor="end" >2026-10-06 · 当前实现 / 合成平台</text>
