    <g class="edge-label" data-edge="run"><text x="580" y="430" font-size="17" font-weight="500" fill="#33475e" text-anchor="middle" paint-order="stroke" stroke="white" stroke-width="8" stroke-linejoin="round">本轮有效记忆快照</text><text x="580" y="452" font-size="15" font-weight="400" fill="#607086" text-anchor="middle" paint-order="stroke" stroke="white" stroke-width="8" stroke-linejoin="round">Rust 核对归属 / 状态 / 版本</text></g><g class="edge-label" data-edge="tools"><text x="245" y="493" font-size="17" font-weight="500" fill="#33475e" text-anchor="middle" paint-order="stroke" stroke="white" stroke-width="8" stroke-linejoin="round">受控修订 / 停用 / 原话补读</text><text x="245" y="515" font-size="15" font-weight="400" fill="#607086" text-anchor="middle" paint-order="stroke" stroke="white" stroke-width="8" stroke-linejoin="round">read_knowledge · source_text</text></g><g class="edge-label" data-edge="generate"><text x="1180" y="219" font-size="17" font-weight="500" fill="#33475e" text-anchor="middle" paint-order="stroke" stroke="white" stroke-width="8" stroke-linejoin="round">普通调用：一份临时 context 参考</text><text x="1180" y="241" font-size="15" font-weight="400" fill="#607086" text-anchor="middle" paint-order="stroke" stroke="white" stroke-width="8" stroke-linejoin="round">custom → role=user · 明确标为资料</text></g><g class="edge-label" data-edge="remember"><text x="580" y="678" font-size="17" font-weight="500" fill="#33475e" text-anchor="middle" paint-order="stroke" stroke="white" stroke-width="8" stroke-linejoin="round">原始消息提取 / 记忆检索</text><text x="580" y="700" font-size="15" font-weight="400" fill="#607086" text-anchor="middle" paint-order="stroke" stroke="white" stroke-width="8" stroke-linejoin="round">内部 HTTP</text></g><g class="edge-label" data-edge="memory-budget"><text x="580" y="778" font-size="17" font-weight="500" fill="#33475e" text-anchor="middle" paint-order="stroke" stroke="white" stroke-width="8" stroke-linejoin="round">每次模型调用的许可与结算</text><text x="580" y="800" font-size="15" font-weight="400" fill="#607086" text-anchor="middle" paint-order="stroke" stroke="white" stroke-width="8" stroke-linejoin="round">M08 原请求预算</text></g><g class="edge-label" data-edge="memory-model"><text x="1290" y="698" font-size="17" font-weight="500" fill="#33475e" text-anchor="middle" paint-order="stroke" stroke="white" stroke-width="8" stroke-linejoin="round">提取 / 向量化</text><text x="1290" y="720" font-size="15" font-weight="400" fill="#607086" text-anchor="middle" paint-order="stroke" stroke="white" stroke-width="8" stroke-linejoin="round">取得逐调用预算许可后发送</text></g><g class="edge-label" data-edge="memory-index"><text x="1350" y="918" font-size="17" font-weight="500" fill="#33475e" text-anchor="middle" paint-order="stroke" stroke="white" stroke-width="8" stroke-linejoin="round">个人记忆索引写入 / 候选读取</text><text x="1350" y="940" font-size="15" font-weight="400" fill="#607086" text-anchor="middle" paint-order="stroke" stroke="white" stroke-width="8" stroke-linejoin="round">Milvus SDK</text></g><g class="edge-label" data-edge="commit-memory"><text x="688" y="912" font-size="17" font-weight="500" fill="#33475e" text-anchor="middle" paint-order="stroke" stroke="white" stroke-width="8" stroke-linejoin="round">正式资产提交后的索引待办</text><text x="688" y="934" font-size="15" font-weight="400" fill="#607086" text-anchor="middle" paint-order="stroke" stroke="white" stroke-width="8" stroke-linejoin="round">内部 HTTP</text></g><g class="edge-label" data-edge="records"><text x="816" y="998" font-size="17" font-weight="500" fill="#33475e" text-anchor="middle" paint-order="stroke" stroke="white" stroke-width="8" stroke-linejoin="round">正式记录 / 登记任务</text><text x="816" y="1020" font-size="15" font-weight="400" fill="#607086" text-anchor="middle" paint-order="stroke" stroke="white" stroke-width="8" stroke-linejoin="round">SQL / TCP</text></g><g class="edge-label" data-edge="claim"><text x="580" y="1153" font-size="17" font-weight="500" fill="#33475e" text-anchor="middle" paint-order="stroke" stroke="white" stroke-width="8" stroke-linejoin="round">领取任务 / 保存状态</text><text x="580" y="1175" font-size="15" font-weight="400" fill="#607086" text-anchor="middle" paint-order="stroke" stroke="white" stroke-width="8" stroke-linejoin="round">SQL / TCP</text></g>
    <text x="750" y="340" font-size="17" font-weight="400" fill="#33475e" text-anchor="start" >既有 ResourceLoader 安装 Pi 原生 context handler；有效 memories 从 system 分离。</text><text x="750" y="376" font-size="17" font-weight="400" fill="#33475e" text-anchor="start" >成功 update_memory / disable_memory 撤下启动候选对应 ID；新内容由成功工具结果提供。</text><text x="750" y="412" font-size="17" font-weight="400" fill="#33475e" text-anchor="start" >拒绝 / 未知回执保持候选；投影不修改 authority。</text><text x="750" y="448" font-size="17" font-weight="400" fill="#33475e" text-anchor="start" >投影不写 Pi JSONL，不直接进入原生 compaction；压缩后下次普通调用重新注入。</text><text x="750" y="484" font-size="17" font-weight="400" fill="#33475e" text-anchor="start" >历史工具结果与助手摘要仍保留；Rust reserve/send 继续 fail-closed，context 吞异常不作门禁。</text><text x="750" y="520" font-size="17" font-weight="400" fill="#33475e" text-anchor="start" >原话按版本 / 归属 / 状态分页补读；缺省只给 source_page，不附完整原话。</text><text x="750" y="556" font-size="17" font-weight="400" fill="#33475e" text-anchor="start" >正文 600 字 / 目录 20 条 / 全局 16KB 及补查机制不变。</text>
    <line x1="35" y1="1342" x2="1885" y2="1342" stroke="#dde5ee"/>
    <text x="35" y="1371" font-size="17" font-weight="400" fill="#607086" text-anchor="start" >Rust / MySQL 保存正式正文、范围、原话、版本与权限；Mem0 保持 infer=True 与 pending → ready。个人纠错不自动变为公共口径。</text>
  </g></g></svg>
