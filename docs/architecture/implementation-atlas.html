)\" style=\"\" class=\"label\">\u003crect>\u003c/rect>\u003ctext style=\"\">\u003ctspan class=\"row\" x=\"0\" dy=\"1em\" xml:space=\"preserve\">范围与候选续取\u003c/tspan>\u003ctspan class=\"row\" x=\"0\" dy=\"1em\" xml:space=\"preserve\">融合 去重与配额补足\u003c/tspan>\u003c/text>\u003c/g>\u003c/g>\u003cg transform=\"translate(580.171875, 41.5)\" data-id=\"VectorPort\" data-node=\"true\" id=\"flowchart-VectorPort-507\" class=\"node default default flowchart-label\">\u003crect height=\"63\" width=\"148.5\" y=\"-31.5\" x=\"-74.25\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\">\u003c/rect>\u003cg transform=\"translate(0, -20.5)\" style=\"\" class=\"label\">\u003crect>\u003c/rect>\u003ctext style=\"\">\u003ctspan class=\"row\" x=\"0\" dy=\"1em\" xml:space=\"preserve\">VectorIndexPort\u003c/tspan>\u003ctspan class=\"row\" x=\"0\" dy=\"1em\" xml:space=\"preserve\">搜索 写入与删除\u003c/tspan>\u003c/text>\u003c/g>\u003c/g>\u003cg transform=\"translate(96, 211.3125057220459)\" data-id=\"Build\" data-node=\"true\" id=\"flowchart-Build-508\" class=\"node default default flowchart-label\">\u003crect height=\"46\" width=\"192\" y=\"-23\" x=\"-96\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\">\u003c/rect>\u003cg transform=\"translate(0, -12)\" style=\"\" class=\"label\">\u003crect>\u003c/rect>\u003ctext style=\"\">\u003ctspan class=\"row\" x=\"0\" dy=\"1em\" xml:space=\"preserve\">检索文本与片段键构建\u003c/tspan>\u003c/text>\u003c/g>\u003c/g>\u003cg transform=\"translate(342.3359375, 151.37500381469727)\" data-id=\"Apply\" data-node=\"true\" id=\"flowchart-Apply-509\" class=\"node default default flowchart-label\">\u003crect height=\"46\" width=\"141\" y=\"-23\" x=\"-70.5\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\">\u003c/rect>\u003cg transform=\"translate(0, -12)\" style=\"\" class=\"label\">\u003crect>\u003c/rect>\u003ctext style=\"\">\u003ctspan class=\"row\" x=\"0\" dy=\"1em\" xml:space=\"preserve\">版本化索引写入\u003c/tspan>\u003c/text>\u003c/g>\u003c/g>\u003cg transform=\"translate(342.3359375, 281.25000762939453)\" data-id=\"Embed\" data-node=\"true\" id=\"flowchart-Embed-511\" class=\"node default default flowchart-label\">\u003crect height=\"46\" width=\"107\" y=\"-23\" x=\"-53.5\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\">\u003c/rect>\u003cg transform=\"translate(0, -12)\" style=\"\" class=\"label\">\u003crect>\u003c/rect>\u003ctext style=\"\">\u003ctspan class=\"row\" x=\"0\" dy=\"1em\" xml:space=\"preserve\">文本向量化\u003c/tspan>\u003c/text>\u003c/g>\u003c/g>\u003cg transform=\"translate(580.171875, 281.25000762939453)\" data-id=\"EmbeddingPort\" data-node=\"true\" id=\"flowchart-EmbeddingPort-513\" class=\"node default default flowchart-label\">\u003crect height=\"63\" width=\"158\" y=\"-31.5\" x=\"-79\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\">\u003c/rect>\u003cg transform=\"translate(0, -20.5)\" style=\"\" class=\"label\">\u003crect>\u003c/rect>\u003ctext style=\"\">\u003ctspan class=\"row\" x=\"0\" dy=\"1em\" xml:space=\"preserve\">EmbeddingPort\u003c/tspan>\u003ctspan class=\"row\" x=\"0\" dy=\"1em\" xml:space=\"preserve\">受许可的外部调用\u003c/tspan>\u003c/text>\u003c/g>\u003c/g>\u003cg transform=\"translate(580.171875, 161.37500381469727)\" data-id=\"Store\" data-node=\"true\" id=\"flowchart-Store-517\" class=\"node default default flowchart-label\">\u003cpath transform=\"translate(-87.5,-53.37500000000001)\" d=\"M 0,14.583333333333334 a 87.5,14.583333333333334 0,0,0 175 0 a 87.5,14.583333333333334 0,0,0 -175 0 l 0,77.58333333333334 a 87.5,14.583333333333334 0,0,0 175 0 l 0,-77.58333333333334\" style=\"\">\u003c/path>\u003cg transform=\"translate(0, -20.5)\" style=\"\" class=\"label\">\u003crect>\u003c/rect>\u003ctext style=\"\">\u003ctspan class=\"row\" x=\"0\" dy=\"1em\" xml:space=\"preserve\">私有 store.rs\u003c/tspan>\u003ctspan class=\"row\" x=\"0\" dy=\"1em\" xml:space=\"preserve\">索引版本与应用状态\u003c/tspan>\u003c/text>\u003c/g>\u003c/g>\u003c/g>\u003c/g>\u003c/g>\u003c/svg>"},{"id":"S05","module":"M05","name":"M05 conversations：消息、归属与会话串行","heading":"S05 模块内部结构","filename":"runtime-modules.md","source":"flowchart LR\n  C05_UC[\"use_cases\u003cbr/>消息 / 历史 / 运行交付\"]\n  subgraph C05_MODULE[\"modules/conversations\"]\n    C05_API[\"mod.rs\u003cbr/>显式导出公开操作\"]\n    C05_LIFE[\"lifecycle.rs\u003cbr/>创建 / 列表 / 删除\"]\n    C05_MSG[\"messages.rs\u003cbr/>消息去重 / 撤回\"]\n    C05_ROUTE[\"routing.rs\u003cbr/>任务关联 / 确认阻塞\"]\n    C05_EVENT[\"events.rs\u003cbr/>序号 / 消费 / 快照\"]\n    C05_TURN[\"turns.rs\u003cbr/>领取 / 续租 / 代次\"]\n    C05_STORE[\"store.rs · 私有\u003cbr/>会话 / 消息 / 事件 / 租约\"]\n    C05_API --> C05_LIFE & C05_MSG & C05_ROUTE & C05_EVENT & C05_TURN\n    C05_LIFE & C05_MSG & C05_ROUTE & C05_EVENT & C05_TURN --> C05_STORE\n  end\n  C05_UC --> C05_API\n  C05_STORE --> C05_DB[(MySQL · AppTx)]","context":"\u003cp>\u003cstrong>负责：\u003c/strong>会话归属、消息去重、持久事件序号、消息与任务关联、确认阻塞范围、Pi 会话的领取代次和消费进度。\u003c/p>\n\u003cp>\u003cstrong>边界：\u003c/strong>不解析自然语言、不修改条件/SQL/预算、不把 SSE 连接当作运行生命周期。会话租约区别于 M10 后台任务租约；领取一个 job 不等于取得 Pi 会话写权。\u003c/p>\n\u003cp>\u003cstrong>私有数据：\u003c/strong>\u003ccode>conversations\u003c/code>、\u003ccode>conversation_events\u003c/code>，以及消息正文/指纹、归属记录、阻塞项、事件消费记录。保留消息/事件 ID、展示 \u003ccode>event_seq\u003c/code>、仅 Agent 输入的 \u003ccode>input_seq\u003c/code>、\u003ccode>schema_version\u003c/code>、归属、对象引用和原预算；两个序列与游标分别保存。\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>字段\u003c/th>\u003cth>初始状态设计\u003c/th>\u003cth>规则\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ccode>routing_state\u003c/code>\u003c/td>\u003ctd>\u003ccode>pending / new_task / task_update / task_question / needs_target / withdrawn\u003c/code>\u003c/td>\u003ctd>归属由结构化操作保存；已应用消息不可撤回删除历史\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>processing_state\u003c/code>\u003c/td>\u003ctd>\u003ccode>unprocessed / processing / applied / retryable_failed\u003c/code>\u003c/td>\u003ctd>失败不解除阻塞；错误与恢复原因单独记录\u003c/td>\u003c/tr>\u003ctr>\u003ctd>输入 \u003ccode>disposition\u003c/code>\u003c/td>\u003ctd>\u003ccode>pending / consumed / withdrawn / suppressed\u003c/code>\u003c/td>\u003ctd>后三者为持久终态；\u003ccode>consumed\u003c/code> 由运行提交，撤回/取消/删除等宿主动作可处分对应输入，不能替模型消费其他输入\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>confirmation_block\u003c/code>\u003c/td>\u003ctd>\u003ccode>none / conversation / task_set\u003c/code>\u003c/td>\u003ctd>按全部未解决消息/澄清求并集；不能用一个“忙碌”布尔值覆盖\u003c/td>\u003c/tr>\u003ctr>\u003ctd>会话运行权\u003c/td>\u003ctd>\u003ccode>lease_owner / lease_until / lease_epoch\u003c/code>\u003c/td>\u003ctd>接管递增代次；超时和代次校验均由数据库时间决定\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>对外操作\u003c/th>\u003cth>输入 → 输出\u003c/th>\u003cth>关键校验、副作用与幂等\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ccode>create_conversation_in_tx\u003c/code>\u003c/td>\u003ctd>\u003ccode>AccessContext, client_creation_id\u003c/code> → 会话 ID\u003c/td>\u003ctd>用户首次发送时创建；创建 ID 幂等，纯空白页不创建持久记录\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>list_conversations_in_tx\u003c/code>\u003c/td>\u003ctd>\u003ccode>AccessContext, cursor, limit\u003c/code> → 有权读取的摘要页\u003c/td>\u003ctd>返回会话、最新事件和未完成关联引用；不跨模块读任务/查询私表\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>read_snapshot_in_tx\u003c/code>\u003c/td>\u003ctd>\u003ccode>AccessContext, conversation_id\u003c/code> → 消息/事件游标/任务引用快照\u003c/td>\u003ctd>组合层另读 M06/M07 汇总；SSE 游标失效后以快照重建再续读\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>delete_conversation_in_tx\u003c/code>\u003c/td>\u003ctd>用户动作、会话 ID、期望修订 → 删除回执与收尾引用\u003c/td>\u003ctd>幂等保存删除标记、终止新的加载/运行权；组合层停止任务并安排查询查证/取消，不删除独立个人资产\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>lock_conversation_in_tx\u003c/code>\u003c/td>\u003ctd>\u003ccode>AccessContext, conversation_id\u003c/code> → 锁定的会话快照\u003c/td>\u003ctd>校验归属/未删除，取得所有组合写入的首把行锁；可信收尾路径只允许已删除会话的必要查证\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>lock_inputs_in_tx\u003c/code>\u003c/td>\u003ctd>锁定会话、输入 ID/待处理范围 → 按 \u003ccode>input_seq\u003c/code> 锁定的输入与处分\u003c/td>\u003ctd>只读本模块记录，校验输入归属；领取、撤回和推进输入游标使用同一会话锁\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>accept_message_in_tx\u003c/code>\u003c/td>\u003ctd>\u003ccode>client_message_id, text, explicit_task?, clarification_id?, budget_scope_id\u003c/code> → \u003ccode>message_id, event_id, routing_state\u003c/code>\u003c/td>\u003ctd>同用户客户端 ID 唯一；不同会话、正文或目标冲突；保存 \u003ccode>pending\u003c/code> 和会话阻塞，明确目标另返回需冻结的任务 ID\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>apply_routing_in_tx\u003c/code>\u003c/td>\u003ctd>\u003ccode>message_id, decision, task_refs, clarification_ref?, block_scope\u003c/code> → 新归属与剩余阻塞\u003c/td>\u003ctd>\u003ccode>decision\u003c/code> 限定上述归属枚举；组合层提供同事务已校验的任务/澄清引用；不能解除其他消息的阻塞\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>withdraw_message_in_tx\u003c/code>\u003c/td>\u003ctd>用户动作、锁定消息、期望修订 → 撤回事件与剩余阻塞\u003c/td>\u003ctd>仅尚未应用消息可撤回；同事务将对应输入置 \u003ccode>withdrawn\u003c/code> 并推进可推进的输入游标；已应用返回 \u003ccode>already_applied\u003c/code>，不改写旧条件\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>claim_turn_in_tx / assert_turn_in_tx / renew_turn_in_tx / release_turn_in_tx / revoke_turn_in_tx\u003c/code>\u003c/td>\u003ctd>领取者或 \u003ccode>run_id, lease_epoch\u003c/code>，撤销另带用户动作 → 当前运行权\u003c/td>\u003ctd>领取/接管/撤销增加代次，续租只限未过期当前持有者；工具/输出/提交前检查运行权；等待用户/查询后释放\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>append_events_in_tx\u003c/code>\u003c/td>\u003ctd>带稳定 \u003ccode>event_id\u003c/code> 的事件批次 → 已分配序号\u003c/td>\u003ctd>同事件 ID 同载荷返回原序号；分配持久递增序号，事务提交后方可投递 SSE\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>commit_consumption_in_tx\u003c/code>\u003c/td>\u003ctd>运行权、锁定输入、期望输入游标 → 消费回执\u003c/td>\u003ctd>只将该运行已领取且仍为 \u003ccode>pending\u003c/code> 的输入置 \u003ccode>consumed\u003c/code>；沿连续终态推进 \u003ccode>input_seq\u003c/code>，遇 \u003ccode>pending\u003c/code> 即停止；重复提交返回原结果\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>dispose_inputs_in_tx\u003c/code>\u003c/td>\u003ctd>宿主动作及同事务受影响范围、锁定输入、\u003ccode>withdrawn/suppressed\u003c/code> 与原因 → 处分/游标回执\u003c/td>\u003ctd>宿主短事务仅处分明确撤回消息或已取消任务/已删除会话的对应输入；幂等、不改已消费输入，不以模型失败为由跳过其他消息\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>read_events_in_tx\u003c/code>\u003c/td>\u003ctd>\u003ccode>AccessContext, conversation_id, after_seq, limit\u003c/code> → 事件页/新游标\u003c/td>\u003ctd>当前权限回源；游标超出保留范围返回 \u003ccode>snapshot_required\u003c/code>，不静默漏事件\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>输入游标只扫描 Agent 输入，并跨过已经 \u003ccode>consumed/withdrawn/suppressed\u003c/code> 的连续前缀；展示事件无输入序号，不形成缺口。运行提交与宿主处分复用该规则；处分不会调用模型，也不能将仍待判断的其他消息冒充已消费。\u003c/p>","svg":"\u003csvg aria-roledescription=\"flowchart-v2\" role=\"graphics-document document\" viewBox=\"-8 -9 1216.25 527\" height=\"527\" xmlns=\"http://www.w3.org/2000/svg\" width=\"1216.25\" id=\"diagramS05\">\u003cstyle>#diagramS05{font-family:PingFang SC,Microsoft YaHei,Arial,sans-serif;font-size:17px;fill:#172c40;}#diagramS05 .error-icon{fill:#ffffff;}#diagramS05 .error-text{fill:#000000;stroke:#000000;}#diagramS05 .edge-thickness-normal{stroke-width:2px;}#diagramS05 .edge-thickness-thick{stroke-width:3.5px;}#diagramS05 .edge-pattern-solid{stroke-dasharray:0;}#diagramS05 .edge-pattern-dashed{stroke-dasharray:3;}#diagramS05 .edge-pattern-dotted{stroke-dasharray:2;}#diagramS05 .marker{fill:#617387;stroke:#617387;}#diagramS05 .marker.cross{stroke:#617387;}#diagramS05 svg{font-family:PingFang SC,Microsoft YaHei,Arial,sans-serif;font-size:17px;}#diagramS05 .label{font-family:PingFang SC,Microsoft YaHei,Arial,sans-serif;color:#172c40;}#diagramS05 .cluster-label text{fill:#000000;}#diagramS05 .cluster-label span,#diagramS05 p{color:#000000;}#diagramS05 .label text,#diagramS05 span,#diagramS05 p{fill:#172c40;color:#172c40;}#diagramS05 .node rect,#diagramS05 .node circle,#diagramS05 .node ellipse,#diagramS05 .node polygon,#diagramS05 .node path{fill:#eef4fb;stroke:#607c99;stroke-width:1px;}#diagramS05 .flowchart-label text{text-anchor:middle;}#diagramS05 .node .katex path{fill:#000;stroke:#000;stroke-width:1px;}#diagramS0 row\" x=\"0\" dy=\"1em\" xml:space=\"preserve\">MySQL · AppTx\u003c/tspan>\u003c/text>\u003c/g>\u003c/g>\u003c/g>\u003c/g>\u003c/g>\u003c/svg>"},{"id":"S06","module":"M06","name":"M06 analysis：分析目标、条件与澄清","heading":"S06 模块内部结构","filename":"runtime-modules.md","source":"flowchart LR\n  C06_UC[\"use_cases\u003cbr/>任务工具 / 修订 / 取消\"]\n  subgraph C06_MODULE[\"modules/analysis\"]\n    C06_API[\"mod.rs\u003cbr/>显式导出公开操作\"]\n    C06_TASK[\"tasks.rs\u003cbr/>任务身份 / 目标 / 生命周期\"]\n    C06_COND[\"conditions.rs\u003cbr/>条件补丁 / 版本 / 依据\"]\n    C06_CLAR[\"clarifications.rs\u003cbr/>问题 / 候选 / 回答校验\"]\n    C06_PHASE[\"phases.rs\u003cbr/>交互阶段 / 历史版本保护\"]\n    C06_STORE[\"store.rs · 私有\u003cbr/>任务 / 条件修订 / 澄清\"]\n    C06_API --> C06_TASK & C06_COND & C06_CLAR & C06_PHASE\n    C06_CLAR -->|复用条件修订规则| C06_COND\n    C06_TASK & C06_COND & C06_CLAR & C06_PHASE --> C06_STORE\n  end\n  C06_UC --> C06_API\n  C06_STORE --> C06_DB[(MySQL · AppTx)]","context":"\u003cp>\u003cstrong>负责：\u003c/strong>任务身份、不可变条件修订、条件来源、缺口、可恢复澄清和任务交互阶段。\u003ccode>update_analysis_task\u003c/code> 的不同动作由组合层分别调用本模块和 M05/M07，不在模块内调用兄弟模块。\u003c/p>\n\u003cp>\u003cstrong>边界：\u003c/strong>不判断消息的自然语言含义、不生成 SQL、不保存用户执行确认、不把模型叙述转为平台成功。SQL 草稿和查询状态由 M07 提供事实快照。\u003c/p>\n\u003cp>\u003cstrong>私有数据：\u003c/strong>\u003ccode>analysis_tasks\u003c/code>、\u003ccode>condition_revisions\u003c/code>、\u003ccode>clarifications\u003c/code>、\u003ccode>task_lifecycle_operations\u003c/code>；条件包含目标、对象、时间/时区、过滤、维度、粒度、依据与来源、未解决问题。澄清含问题、候选任务、可选答案、创建事件、回答消息和解决版本；无明确任务时可暂挂会话。取消命令按用户和操作身份保存载荷指纹与回执；相同载荷重传直接取回执，换目标或版本拒绝冲突，已取消终态不再次中断剩余目标。\u003c/p>\n\u003cp>Pi工具的\u003ccode>AnalysisUpdate\u003c/code>沿用同源JSON Schema：新建任务须带完整\u003ccode>conditions\u003c/code>，新建可省略尚未分配的\u003ccode>task_id/expected_version\u003c/code>（保留接受JSON null），已有任务必须给真实ID与当前版本；未指定标量保留null、列表保留空数组。已有任务版本使用工具回执中的数字字符串。没有需要用户补充的歧义时省略\u003ccode>question\u003c/code>并传\u003ccode>options=[]\u003c/code>（仍接受JSON null）。\u003ccode>knowledge_refs\u003c/code>引用知识对象的\u003ccode>id/version/path\u003c/code>，来源读取的\u003ccode>source_id\u003c/code>不能充当知识对象ID。校验失败仍作为Pi工具错误交模型修正，不由宿主猜测任务条件。\u003c/p>\n\u003cp>已有任务的\u003ccode>revise/clarify\u003c/code>须带\u003ccode>condition_patch\u003c/code>及当前版本；空白问题和字符串\u003ccode>null/undefined\u003c/code>不能生成澄清。正式输出取Pi最后一条助手消息，通过\u003ccode>FinishRun.final_start_chunk_seq\u003c/code>绑定其已保存片段；省略该字段的旧请求从片段1核对。Rust始终核对全部片段连续、起点范围和正式文本相等，调查过程仍作为事件保留。\u003c/p>\n\u003cp>\u003ccode>route\u003c/code>只登记消息归属，禁止附带\u003ccode>conditions/condition_patch\u003c/code>或澄清问题。修改渠道、时间、指标等条件使用\u003ccode>revise\u003c/code>，获得新的条件版本并失效旧待确认草稿；只有条件保持不变而改写SQL时，\u003ccode>route\u003c/code>可带\u003ccode>replaces_query_id\u003c/code>声明修订。错误动作与参数组合在共享契约边界拒绝，不能成功返回后静默丢掉修改。\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>状态维度\u003c/th>\u003cth>初始状态设计\u003c/th>\u003cth>规则\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>任务生命周期\u003c/td>\u003ctd>\u003ccode>active / cancelled\u003c/code>\u003c/td>\u003ctd>取消停止后续推进；相关查询的真实终态单独保存\u003c/td>\u003c/tr>\u003ctr>\u003ctd>当前交互阶段\u003c/td>\u003ctd>\u003ccode>investigating / waiting_clarification / waiting_confirmation / waiting_query / answered / failed\u003c/code>\u003c/td>\u003ctd>带条件版本和阶段修订号；历史查询运行不阻止新条件进入调查\u003c/td>\u003c/tr>\u003ctr>\u003ctd>澄清状态\u003c/td>\u003ctd>\u003ccode>open / resolved / withdrawn\u003c/code>\u003c/td>\u003ctd>目标澄清可保持会话级；业务口径澄清在归属明确后仅影响对应任务\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>对外操作\u003c/th>\u003cth>输入 → 输出\u003c/th>\u003cth>关键校验、副作用与幂等\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ccode>lock_tasks_in_tx\u003c/code>\u003c/td>\u003ctd>锁定会话、任务 ID 集合、关联澄清范围 → \u003ccode>LockedTask\u003c/code> / 澄清快照\u003c/td>\u003ctd>任务 ID 排序后锁相关澄清；校验同会话归属，返回当前生命周期与版本；取消、修订和查询确认均用此快照\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>create_task_in_tx\u003c/code>\u003c/td>\u003ctd>消息引用、目标、已知条件、依据/缺口 → 任务与首个条件版本\u003c/td>\u003ctd>创建归属固定的任务；重复工具操作返回原任务；不自行关联消息\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>revise_conditions_in_tx\u003c/code>\u003c/td>\u003ctd>\u003ccode>task_id, base_revision, patch, evidence\u003c/code> → 新版本与受影响字段\u003c/td>\u003ctd>校验起点版本；补丁只允许 \u003ccode>set/unset\u003c/code> 和允许路径；未提及字段与来源保留\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>open_clarification_in_tx\u003c/code>\u003c/td>\u003ctd>消息、目标/候选、字段、问题、选项、可选条件补丁 → 澄清 ID/条件版本\u003c/td>\u003ctd>候选均属同会话；修订须带起点版本；问题和附带修订同事务保存\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>resolve_clarification_in_tx\u003c/code>\u003c/td>\u003ctd>澄清 ID、回答消息、确定任务、起点版本/补丁 → 条件版本与解决回执\u003c/td>\u003ctd>校验尚未解决、回答属于同会话；旧版回答返回冲突，不生成或确认 SQL\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>read_task_context_in_tx\u003c/code>\u003c/td>\u003ctd>\u003ccode>task_id, condition_revision?\u003c/code> → 当前或历史条件/澄清快照\u003c/td>\u003ctd>不用当前条件替换查询绑定的历史条件；当前归属和权限由组合层核对\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>set_interaction_phase_in_tx\u003c/code>\u003c/td>\u003ctd>期望任务/条件修订、受控事实摘要 → 新阶段\u003c/td>\u003ctd>组合层汇集未解决澄清、当前待确认请求、相关查询和提交输出；拒绝模型任意状态字符串\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>cancel_task_in_tx\u003c/code>\u003c/td>\u003ctd>用户动作、锁定任务、期望修订 → 停止回执、关闭澄清与待收尾关联范围\u003c/td>\u003ctd>只取消指定任务并关闭其业务澄清；多候选目标澄清移除该任务，仍有其他候选则保留；组合层拒绝该任务原待确认并安排查询取消，不宣称平台已取消\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>阶段更新由保存的业务事实决定：开放澄清优先等待澄清；可执行当前草稿等待确认；当前条件的已确认查询未结束则等待查询；允许交付且输出已提交才可标为已回答。已取消任务拒绝新条件、澄清回答和查询推进；旧条件结果只写历史事件，不能推进当前条件阶段。缺口与失败原因保留。\u003c/p>","svg":"\u003csvg aria-roledescription=\"flowchart-v2\" role=\"graphics-document document\" viewBox=\"-8 -9 1643.921875 367\" height=\"367\" xmlns=\"http://www.w3.org/2000/svg\" width=\"1643.921875\" id=\"diagramS06\">\u003cstyle>#diagramS06{font-family:PingFang SC,Microsoft YaHei,Arial,sans-serif;font-size:17px;fill:#172c40;}#diagramS06 .error-icon{fill:#ffffff;}#diagramS06 .error-text{fill:#000000;stroke:#000000;}#diagramS06 .edge-thickness-normal{stroke-width:2px;}#diagramS06 .edge-thickness-thick{stroke-width:3.5px;}#diagramS06 .e ramS06_flowchart-pointEnd)\" style=\"fill:none;\" class=\"edge-thickness-normal edge-pattern-solid flowchart-link LS-C06_TASK LE-C06_STORE\" id=\"L-C06_TASK-C06_STORE-0\" d=\"M1130.969,59L1160.969,59L1254.202,151.272\">\u003c/path>\u003cpath marker-end=\"url(#diagramS06_flowchart-pointEnd)\" style=\"fill:none;\" class=\"edge-thickness-normal edge-pattern-solid flowchart-link LS-C06_COND LE-C06_STORE\" id=\"L-C06_COND-C06_STORE-0\" d=\"M1113.969,157L1160.969,157L1185.802,162.687\">\u003c/path>\u003cpath marker-end=\"url(#diagramS06_flowchart-pointEnd)\" style=\"fill:none;\" class=\"edge-thickness-normal edge-pattern-solid flowchart-link LS-C06_CLAR LE-C06_STORE\" id=\"L-C06_CLAR-C06_STORE-0\" d=\"M703.313,224.034L801.313,232L1015.141,232L1160.969,232L1195.611,219.765\">\u003c/path>\u003cpath marker-end=\"url(#diagramS06_flowchart-pointEnd)\" style=\"fill:none;\" class=\"edge-thickness-normal edge-pattern-solid flowchart-link LS-C06_PHASE LE-C06_STORE\" id=\"L-C06_PHASE-C06_STORE-0\" d=\"M1121.055,291L1160.969,291L1246.847,221.339\">\u003c/path>\u003cpath marker-end=\"url(#diagramS06_flowchart-pointEnd)\" style=\"fill:none;\" class=\"edge-thickness-normal edge-pattern-solid flowchart-link LS-C06_UC LE-C06_API\" id=\"L-C06_UC-C06_API-0\" d=\"M197.656,186.5L227.656,186.5L257.656,186.5L282.356,186.5\">\u003c/path>\u003cpath marker-end=\"url(#diagramS06_flowchart-pointEnd)\" style=\"fill:none;\" class=\"edge-thickness-normal edge-pattern-solid flowchart-link LS-C06_STORE LE-C06_DB\" id=\"L-C06_STORE-C06_DB-0\" d=\"M1388.625,186.5L1418.625,186.5L1448.625,186.5L1473.325,186.5\">\u003c/path>\u003c/g>\u003cg class=\"edgeLabels\">\u003cg class=\"edgeLabel\">\u003cg transform=\"translate(0, 0)\" class=\"label\">\u003crect height=\"0\" width=\"0\" ry=\"0\" rx=\"0\">\u003c/rect>\u003ctext style=\"\">\u003ctspan class=\"row\" x=\"0\" dy=\"1em\" xml:space=\"preserve\">\u003c/tspan>\u003c/text>\u003c/g>\u003c/g>\u003cg class=\"edgeLabel\">\u003cg transform=\"translate(0, 0)\" class= pan>\u003c/text>\u003c/g>\u003c/g>\u003cg transform=\"translate(1289.796875, 186.5)\" data-id=\"C06_STORE\" data-node=\"true\" id=\"flowchart-C06_STORE-549\" class=\"node default default flowchart-label\">\u003crect height=\"63\" width=\"197.65625\" y=\"-31.5\" x=\"-98.828125\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\">\u003c/rect>\u003cg transform=\"translate(0, -20.5)\" style=\"\" class=\"label\">\u003crect>\u003c/rect>\u003ctext style=\"\">\u003ctspan class=\"row\" x=\"0\" dy=\"1em\" xml:space=\"preserve\">store.rs · 私有\u003c/tspan>\u003ctspan class=\"row\" x=\"0\" dy=\"1em\" xml:space=\"preserve\">任务 / 条件修订 / 澄清\u003c/tspan>\u003c/text>\u003c/g>\u003c/g>\u003cg transform=\"translate(98.828125, 186.5)\" data-id=\"C06_UC\" data-node=\"true\" id=\"flowchart-C06_UC-543\" class=\"node default default flowchart-label\">\u003crect height=\"63\" width=\"197.65625\" y=\"-31.5\" x=\"-98.828125\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\">\u003c/rect>\u003cg transform=\"translate(0, -20.5)\" style=\"\" class=\"label\">\u003crect>\u003c/rect>\u003ctext style=\"\">\u003ctspan class=\"row\" x=\"0\" dy=\"1em\" xml:space=\"preserve\">use_cases\u003c/tspan>\u003ctspan class=\"row\" x=\"0\" dy=\"1em\" xml:space=\"preserve\">任务工具 / 修订 / 取消\u003c/tspan>\u003c/text>\u003c/g>\u003c/g>\u003cg transform=\"translate(1553.2734375, 186.5)\" data-id=\"C06_DB\" data-node=\"true\" id=\"flowchart-C06_DB-565\" class=\"node default default flowchart-label\">\u003cpath transform=\"translate(-74.6484375,-43.41085160922814)\" d=\"M 0,13.607234406152093 a 74.6484375,13.607234406152093 0,0,0 149.296875 0 a 74.6484375,13.607234406152093 0,0,0 -149.296875 0 l 0,59.607234406152095 a 74.6484375,13.607234406152093 0,0,0 149.296875 0 l 0,-59.607234406152095\" style=\"\">\u003c/path>\u003cg transform=\"translate(0, -12)\" style=\"\" class=\"label\">\u003crect>\u003c/rect>\u003ctext style=\"\">\u003ctspan class=\"row\" x=\"0\" dy=\"1em\" xml:space=\"preserve\">MySQL · AppTx\u003c/tspan>\u003c/text>\u003c/g>\u003c/g>\u003c/g>\u003c/g>\u003c/g>\u003c/svg>"},{"id":"S07","module":"M07","name":"M07 queries：SQL 版本、用户确认与平台执行","heading":"S07 模块内部结构","filename":"runtime-modules.md","source":"flowchart LR\n  C07_UC[\"use_cases\u003cbr/>草稿 / 确认 / 平台跟踪\"]\n  subgraph C07_MODULE[\"modules/queries\"]\n    C07_API[\"mod.rs\u003cbr/>显式导出公开操作\"]\n    C07_DRAFT[\"drafts.rs\u003cbr/>SQL版本 / 条件与目标绑定\"]\n    C07_VALID[\"validation.rs\u003cbr/>完整AST / 只读能力校验\"]\n    C07_CONFIRM[\"confirmation.rs\u003cbr/>用户确认 / 幂等 / 失效\"]\n    C07_EXEC[\"execution.rs\u003cbr/>提交意图 / 观察 / 取消状态\"]\n    C07_RESULT[\"results.rs\u003cbr/>结果引用 / 分页 / CSV范围\"]\n    C07_STORE[\"store.rs · 私有\u003cbr/>草稿 / 请求 / 确认 / 回执\"]\n    C07_API --> C07_DRAFT & C07_VALID & C07_CONFIRM & C07_EXEC & C07_RESULT\n    C07_DRAFT -->|核对报告与指纹| C07_VALID\n    C07_DRAFT & C07_CONFIRM & C07_EXEC & C07_RESULT --> C07_STORE\n  end\n  C07_PORT[\"QueryPlatformPort · M07定义\u003cbr/>提交 / 查证 / 状态 / 读取 / 取消\"]\n  C07_ADAPTER[\"adapters/platform\u003cbr/>mock 或真实平台适配\"]\n  C07_UC --> C07_API\n  C07_UC -->|事务外调用| C07_PORT\n  C07_RESULT -->|事务外读取| C07_PORT\n  C07_ADAPTER -.->|实现| C07_PORT\n  C07_STORE --> C07_DB[(MySQL · AppTx)]","context":"\u003cp>\u003cstrong>负责：\u003c/strong>SQL 草稿/参数/依据/条件/执行目标绑定、完整语法与只读能力检查、待确认请求、真实用户确认、平台提交与查证、结果引用和取消记录。\u003c/p>\n\u003cp>\u003cstrong>边界：\u003c/strong>\u003ccode>request_query\u003c/code> 只检查和保存草稿，成功返回 \u003ccode>awaiting_confirmation\u003c/code>；它没有用户确认能力。该工具通过组合层调用下表操作。模块不整理条件、不解释结果、不把本地超时推断成平台失败或取消成功。\u003c/p>\n\u003cp>\u003cstrong>私有数据：\u003c/strong>\u003ccode>sql_drafts\u003c/code> 及不可变版本、\u003ccode>query_requests\u003c/code>、确认记录、平台提交/观察/取消回执；每个请求固定 \u003ccode>task_id, condition_revision, draft_version, target_id, target_version, budget_scope_id\u003c/code>。主键在预览时创建；主动重跑创建新待确认请求，SQL 相同仍需用户确认。\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>状态维度\u003c/th>\u003cth>初始状态设计\u003c/th>\u003cth>规则\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>草稿检查\u003c/td>\u003ctd>\u003ccode>passed / rejected / unsupported\u003c/code>\u003c/td>\u003ctd>整条语句可解析且目标能力允许才通过；失败也保留草稿与理由\u003c/td>\u003c/tr>\u003ctr>\u003ctd>确认\u003c/td>\u003ctd>\u003ccode>awaiting_confirmation / modifying / superseded / confirmed\u003c/code>\u003c/td>\u003ctd>只影响未确认请求；\u003ccode>confirmed\u003c/code> 保留真实用户、时间、绑定版本，不被新消息改写\u003c/td>\u003c/tr>\u003ctr>\u003ctd>执行\u003c/td>\u003ctd>\u003ccode>not_submitted / queued / submitting / submission_unknown / running / succeeded / failed / cancelled\u003c/code>\u003c/td>\u003ctd>\u003ccode>submitting\u003c/code> 崩溃按可能已发出处理；\u003ccode>submission_unknown\u003c/code> 先查证；状态查询超时保留最近已知状态并标 \u003ccode>observation_unknown\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>取消\u003c/td>\u003ctd>\u003ccode>none / requested / acknowledged / unsupported / unknown / rejected / completed\u003c/code>\u003c/td>\u003ctd>\u003ccode>acknowledged\u003c/code> 只表示平台收到请求；未生成提交意图可凭本地事务进入取消终态，可能发出后须平台证据\u003c/td>\u003c/tr>\u003ctr>\u003ctd>结果\u003c/td>\u003ctd>\u003ccode>unavailable / available / expired / access_denied\u003c/code>\u003c/td>\u003ctd>空行可以是成功；分页完整性、截断、上游到齐状态分别记录\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>对外操作\u003c/th>\u003cth>输入 → 输出\u003c/th>\u003cth>关键校验、副作用与幂等\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ccode>lock_requests_in_tx\u003c/code>\u003c/td>\u003ctd>锁定会话/任务、查询请求 ID 集合 → \u003ccode>LockedQueryRequest\u003c/code> 集合\u003c/td>\u003ctd>按 ID 锁定请求及其确认/取消状态；只读状态接口不能替代此锁；提交与取消竞争使用同一组锁\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>check_sql\u003c/code>（纯操作）\u003c/td>\u003ctd>SQL、参数、目标能力快照 → 检查报告/指纹\u003c/td>\u003ctd>检查完整 AST、单条只读、函数和外部访问；未知能力/语法返回 \u003ccode>unsupported\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>begin_revision_in_tx / save_draft_in_tx\u003c/code>\u003c/td>\u003ctd>条件快照、SQL、依据、目标版本、报告、预算范围、可选 \u003ccode>replaces_query_id\u003c/code> → 草稿版本/待确认请求\u003c/td>\u003ctd>SQL修订声明与消息归属同事务，声明后即失效目标旧稿，再进行外部检查。route声明须带task_id/expected_version/replaces_query_id；request_query可直接完成声明。引用限同用户/会话/任务/目标，检查失败也不恢复旧稿。独立新查询传null；已确认原查询独立收尾；已有后继的祖先不能再次修订\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>hold_pending_in_tx / supersede_pending_in_tx\u003c/code>\u003c/td>\u003ctd>任务范围、消息/条件修订引用 → 受影响请求 ID\u003c/td>\u003ctd>明确补充先置 \u003ccode>modifying\u003c/code>；新修订置 \u003ccode>superseded\u003c/code>；不改变已确认或执行中的请求\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>release_pending_in_tx\u003c/code>\u003c/td>\u003ctd>需释放的消息阻塞及同事务剩余阻塞快照 → 可恢复请求\u003c/td>\u003ctd>仅撤回或确定不影响时恢复未失效请求；不得复活已替代的草稿\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>confirm_request_in_tx\u003c/code>\u003c/td>\u003ctd>可信用户动作、锁定请求/会话/任务、展示草稿版本、确认 ID → 同一查询 ID\u003c/td>\u003ctd>已确认重传只返回现状，不重新排队；首次仅从 \u003ccode>awaiting_confirmation + not_submitted + active task + cancel=none\u003c/code> 进入 \u003ccode>queued\u003c/code>，并核对阻塞/版本/目标/权限；取消或替代请求拒绝\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>begin_submission_in_tx\u003c/code>\u003c/td>\u003ctd>锁定请求/任务、当前 Worker 代次、最新权限/能力检查结果 → 提交包或已有状态\u003c/td>\u003ctd>仅 \u003ccode>confirmed + queued + active task + cancel=none\u003c/code> 可原子登记提交意图并置 \u003ccode>submitting\u003c/code>；与本地取消按同锁事务提交顺序竞争；网络在提交后调用\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>record_submission_in_tx\u003c/code>\u003c/td>\u003ctd>请求 ID、代次、提交回执/未知原因 → 平台 ID/执行状态\u003c/td>\u003ctd>同次提交回执幂等；明确拒绝进入 failed，未知置 \u003ccode>submission_unknown\u003c/code> 后先查证；仅平台确认未接收才可重排，最多三次提交；旧代次拒绝。保存平台错误类别与至多1000字符诊断，查询工具和页面可读取\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>record_observation_in_tx\u003c/code>\u003c/td>\u003ctd>请求 ID、代次、稳定观察 ID、平台状态/结果引用 → 状态变化及交付载荷\u003c/td>\u003ctd>校验平台身份与版本；不从终态回退；同观察去重，终态交付 ID 按查询固定；与交付事件登记共事务\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>request_cancel_in_tx / record_cancel_in_tx\u003c/code>\u003c/td>\u003ctd>可信取消动作或平台回执、锁定请求 → 已知取消/执行状态\u003c/td>\u003ctd>\u003ccode>not_submitted/queued\u003c/code> 且无提交意图可本地置 \u003ccode>execution=cancelled, cancel=completed\u003c/code>；未确认置 \u003ccode>superseded\u003c/code>，已确认保留 \u003ccode>confirmed\u003c/code> 历史；\u003ccode>submitting\u003c/code> 以后先查证/发取消，终态竞争保留平台证据\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>read_query_in_tx / resolve_result_ref_in_tx\u003c/code>\u003c/td>\u003ctd>查询 ID、当前授权 → 查询快照/结果引用\u003c/td>\u003ctd>回看重新核对权限和有效期；过期不自动重跑；历史条件版本保持不变\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>fetch_result_page\u003c/code>（事务外）\u003c/td>\u003ctd>已授权结果引用、游标、范围 → 标准结果页\u003c/td>\u003ctd>经平台适配器读取；明确字段类型、精确数值编码、完整性/截断/来源；CSV 仅导出同一已授权范围，不提交 SQL\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>平台接口为 \u003ccode>submit_query / lookup_submission / get_status / read_results / cancel_query\u003c/code>。组合层在数据库事务之间调用适配器；提交前重新核对权限和目标能力。网络检查返回的版本/有效期在落库前核对，实际平台仍负责最终权限与只读约束。\u003c/p>\n\u003cp>本地取消先提交，Worker 随后不得发出查询；提交意图先提交，即使网络尚未发送也按可能已发出处理，后续取消走查证路径，不谎报本地取消成功。所有取消终态都不能被旧确认或重传恢复为 \u003ccode>queued\u003c/code>；主动重跑须新请求、新确认。\u003c/p>\n\u003cp>晚到结果属于已保存的原任务和条件。旧 Worker 的回执只能触发当前持有者重新查证，不能越过代次直接写状态；真实 \u003ccode>succeeded\u003c/code> 不被晚到取消确认覆盖，冲突或不明回执保留证据并查证。\u003c/p>","svg":"\u003csvg aria-roledescription=\"flowchart-v2\" role=\"graphics-document document\" viewBox=\"-8 -9 1527.90625 613\" height=\"613\" xmlns=\"http://www.w3.org/2000/svg\" width=\"1527.90625\" id=\"diagramS07\">\u003cstyle>#diagramS07{font-family:PingFang SC,Microsoft YaHei,Arial,sans-serif;font-size:17px;fill:#172c40;}#diagramS07 .error-icon{fill:#ffffff;}#diagramS07 .error-text{fill:#000000;stroke:#000000;}#diagramS07 .edge-thickness-normal{stroke-width:2px;}#diagramS07 .edge-thickness-thick{stroke-width:3.5px;}#diagramS07 .edge-pattern-solid{stroke-dasharray:0;}#diagramS07 .edge-pattern-dashed{stroke-dasharray:3;}#diagramS07 .edge-pattern-dotted{stroke-dasharray:2;}#diagramS07 .marker{fill:#617387;stroke:#617387;}#diagramS07 .marker.cross{stroke:#617387;}#diagramS07 svg{font-family:PingFang SC,Microsoft YaHei,Arial,sans-serif;font-size:17px;}#diagramS07 .label{font-family:PingFang SC, row\" x=\"0\" dy=\"1em\" xml:space=\"preserve\">MySQL · AppTx\u003c/tspan>\u003c/text>\u003c/g>\u003c/g>\u003c/g>\u003c/g>\u003c/g>\u003c/svg>"},{"id":"S08","module":"M08","name":"M08 runtime：运行、检查点、工具、输出与预算","heading":"S08 模块内部结构","filename":"runtime-modules.md","source":"flowchart LR\n  C08_UC[\"use_cases\u003cbr/>运行 / 工具 / 输出 / 调用许可\"]\n  subgraph C08_MODULE[\"modules/runtime\"]\n    C08_API[\"mod.rs\u003cbr/>显式导出公开操作\"]\n    C08_RUN[\"runs.rs\u003cbr/>运行绑定 / 生命周期 / 提交校验\"]\n    C08_CHECK[\"checkpoints.rs\u003cbr/>session / leaf / authority 小引用\u003cbr/>旧 inline 不可变交付副本\"]\n    C08_TOOL[\"tool_ledger.rs\u003cbr/>调用登记 / 指纹 / 回执接回\"]\n    C08_OUT[\"outputs.rs\u003cbr/>逻辑回答 / 尝试 / 片段 / 替换\"]\n    C08_BUDGET[\"budgets.rs\u003cbr/>范围 / 预留 / 发送许可 / 结算\"]\n    C08_STORE[\"store.rs · 私有\u003cbr/>运行 / 检查点 / 输出 / 工具 / 账本\"]\n    C08_API --> C08_RUN & C08_CHECK & C08_TOOL & C08_OUT & C08_BUDGET\n    C08_RUN -->|核对提交材料| C08_CHECK & C08_OUT\n    C08_RUN & C08_CHECK & C08_TOOL & C08_OUT & C08_BUDGET --> C08_STORE\n  end\n  C08_UC --> C08_API\n  C08_STORE --> C08_DB[(MySQL · AppTx)]","context":"\u003cp>\u003cstrong>负责：\u003c/strong>运行绑定与恢复记录、工具调用账本、输出尝试及片段、模型调用许可与原范围预算。Node/M11 负责唯一 SDK 循环，M08 只执行约束与持久化，不另设规划器。\u003c/p>\n\u003cp>\u003cstrong>边界：\u003c/strong>不根据文本承诺修改任务/查询，不重放已成功业务副作用，不自行给新运行补额度。Pi 检查点不是条件、确认或长期记忆的替代品。\u003c/p>\n\u003cp>\u003cstrong>私有数据：\u003c/strong>\u003ccode>agent_runs\u003c/code>、\u003ccode>pi_checkpoints\u003c/code>、\u003ccode>tool_calls\u003c/code>、\u003ccode>assistant_outputs\u003c/code>/尝试/片段、\u003ccode>budget_scopes\u003c/code>、\u003ccode>model_call_attempts\u003c/code>。当前检查点含 SDK 格式版本、原 session、私有 JSONL 文件名、精确 leaf 和 authority；完整原生树由 M11 保存。旧 inline 在交付事务绑定不可变副本及指纹，受当前运行权校验后只读迁移；凭据不在其中。\u003c/p>\n\u003cp>\u003ccode>recovery_chain_id\u003c/code> 绑定一次逻辑交付、原输入/预算和 \u003ccode>output_id\u003c/code>，重启或替换执行创建新 \u003ccode>run_id\u003c/code> 时继承；新用户操作/新结果交付另建恢复链。工具业务唯一键为 \u003ccode>(conversation_id, operation_id)\u003c/code>；恢复映射另以 \u003ccode>(conversation_id, recovery_chain_id, sdk_tool_call_id)\u003c/code> 唯一，指向同一稳定操作，保存工具名/参数指纹、\u003ccode>origin_run_id\u003c/code> 与接回记录。去重不按 SQL/参数永久生效；相同参数的新操作可以正常执行，已提交调用恢复不能换链或操作身份。\u003c/p>\n\u003cp>恢复包的依据清单覆盖原资料及其派生回答、工具结果和压缩摘要。发送前发现引用失效，保守剔除所有依赖该引用的派生条目；无法证明依赖清单完整时，只从当前允许的用户消息与业务事实重建，不能仅删引用标签而保留正文。当前沿用Pi原生SessionManager和压缩接口，运行清单使用\u003ccode>dependency_schema=1\u003c/code>记录真正交付的知识/来源/记忆/Skill版本。启动材料裁剪后登记，工具回传后同事务累积，跨新输入和压缩保留并集；实际引用回源失效才重建。旧清单缺失或格式不完整时保守重建，新输入可重新调查，同输入恢复不得换SDK操作身份。额外近期材料仅含用户消息，助手历史从核对过的Pi检查点恢复。具体验证范围以CURRENT为准。\u003c/p>\n\u003cp>\u003cstrong>内部文件：\u003c/strong>\u003ccode>runs.rs\u003c/code>、\u003ccode>checkpoints.rs\u003c/code>、\u003ccode>outputs.rs\u003c/code>、\u003ccode>tool_ledger.rs\u003c/code>、\u003ccode>budgets.rs\u003c/code> 分担本模块规则，\u003ccode>store.rs\u003c/code> 保存存储细节；这些是内部职责边界，不导出一个同时处理全部动作的 Agent 类。\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>对象\u003c/th>\u003cth>初始状态设计\u003c/th>\u003cth>不变量\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>运行\u003c/td>\u003ctd>\u003ccode>queued / running / finished / interrupted / failed / cancelled / budget_exhausted\u003c/code>\u003c/td>\u003ctd>运行结束原因和任务等待原因分开；一个运行固定一个原预算范围\u003c/td>\u003c/tr>\u003ctr>\u003ctd>工具调用\u003c/td>\u003ctd>\u003ccode>registered / processing / succeeded / failed / unknown\u003c/code>\u003c/td>\u003ctd>同调用 ID/参数接回回执；副作用未知先查证，不能换 ID 重做\u003c/td>\u003c/tr>\u003ctr>\u003ctd>输出尝试\u003c/td>\u003ctd>\u003ccode>streaming / committed / interrupted / superseded\u003c/code>\u003c/td>\u003ctd>同一逻辑 \u003ccode>output_id\u003c/code> 最多一个有效提交；不同尝试不拼接\u003c/td>\u003c/tr>\u003ctr>\u003ctd>模型调用\u003c/td>\u003ctd>\u003ccode>reserved / issued / settled / unknown / released\u003c/code>\u003c/td>\u003ctd>\u003ccode>issued\u003c/code> 只授权首次发送；未知保留预留，证实未发出才可释放\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>对外操作\u003c/th>\u003cth>输入 → 输出\u003c/th>\u003cth>关键校验、副作用与幂等\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ccode>lock_run_in_tx\u003c/code>\u003c/td>\u003ctd>锁定会话、运行 ID → 锁定运行/恢复链\u003c/td>\u003ctd>校验运行与会话/链的归属，提供实际关联任务和原预算；历史回执读取不要求原运行仍持有租约，新写入须当前运行权\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>lock_tool_call_in_tx / lock_model_attempt_in_tx\u003c/code>\u003c/td>\u003ctd>锁定运行/链或维护上下文、调用键/尝试 ID → 锁定账本记录\u003c/td>\u003ctd>工具按会话/链/SDK 调用键读取；模型按尝试 ID 读取，两者不混用；同类多记录按 ID 排序，新记录由唯一键保护\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>lock_budget_scope_in_tx / lock_trial_budget_in_tx\u003c/code>\u003c/td>\u003ctd>固定范围/试验 ID → 锁定额度快照\u003c/td>\u003ctd>先范围后试验总额；预留/结算在短事务用当前额度，不接受事务外余额；维护调用同样适用\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>open_budget_scope_in_tx\u003c/code>\u003c/td>\u003ctd>主动用户消息、配置限额版本、试验总额度引用 → 范围 ID\u003c/td>\u003ctd>与接收消息同事务；同消息唯一；确认、Worker 和结果事件不新建额度\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>resolve_maintenance_budget_in_tx\u003c/code>\u003c/td>\u003ctd>空间、维护配置版本、作业类别/批次 → 已配置范围 ID\u003c/td>\u003ctd>仅采用运维配置限定的维护额度；无配置返回 \u003ccode>budget_unavailable\u003c/code>，作业/重试不能自建额度\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>start_run_in_tx\u003c/code>\u003c/td>\u003ctd>会话运行权、锁定输入、恢复链或新交付、目标/条件、原预算 → 运行/链/输出/尝试 ID\u003c/td>\u003ctd>输入须未被宿主终态处分；校验归属与预算，不同范围串行；恢复继承原链/逻辑输出并映射新运行，模型不得新建链绕过去重\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>stop_run_in_tx\u003c/code>\u003c/td>\u003ctd>锁定运行、停止原因/目标范围、期望版本 → 终止回执/中断尝试引用\u003c/td>\u003ctd>仅中断匹配范围的运行；停止新增调用，保留已提交工具；只有它是当前租约持有者时才同事务撤销运行权，不撤销同会话其他任务的运行\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>read_recovery_bundle_in_tx\u003c/code>\u003c/td>\u003ctd>运行/链/检查点版本、可见性判定 → 恢复包或重建要求\u003c/td>\u003ctd>沿恢复链接回原调用及 \u003ccode>operation_id\u003c/code>，只包含已提交输出和已查证工具结果；权限、资产变化经组合层校验后重建\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>register_tool_call_in_tx\u003c/code>\u003c/td>\u003ctd>当前运行权、恢复链、SDK 调用 ID、参数指纹、SDK 条目 → 稳定操作 ID/历史回执\u003c/td>\u003ctd>先保存调用与恢复条目再执行；同链同调用跨运行接回原记录，异参冲突；不接受新链/新 ID 代替已提交调用恢复\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>read_tool_call_in_tx\u003c/code>\u003c/td>\u003ctd>当前运行权、锁定调用、稳定操作 ID/指纹 → 状态/历史回执\u003c/td>\u003ctd>校验当前运行可接回该恢复链；成功返回原结果，未知先查证，不因 \u003ccode>run_id\u003c/code> 改变执行新副作用\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>record_tool_receipt_in_tx\u003c/code>\u003c/td>\u003ctd>锁定调用、稳定操作 ID、业务回执/错误/未知 → 持久回执\u003c/td>\u003ctd>应用内业务写入和成功回执同事务；保留原运行出处，外部 I/O 分段登记；仅明确失败标 \u003ccode>failed\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>append_output_in_tx\u003c/code>\u003c/td>\u003ctd>运行权、输出/尝试 ID、\u003ccode>chunk_seq, text\u003c/code> → 接受序号/缺口\u003c/td>\u003ctd>同序号同内容去重，异内容拒绝；推荐仅接收下一连续片段，乱序返回 \u003ccode>chunk_gap\u003c/code> 供重传\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>interrupt_output_in_tx / replace_output_in_tx\u003c/code>\u003c/td>\u003ctd>尝试 ID、原因或新尝试请求 → 中断/替换引用\u003c/td>\u003ctd>新尝试记录 \u003ccode>replaces_attempt_id\u003c/code>；组合层追加替换事件；旧片段不得作为完整历史\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>reserve_model_call_in_tx\u003c/code>\u003c/td>\u003ctd>运行权、\u003ccode>call_attempt_id\u003c/code>、参数指纹、输入/输出上界 → 许可\u003c/td>\u003ctd>原子检查范围和试验总限额；同 ID 幂等预留；真正重试另 ID，仍扣原范围；额度不足返回 \u003ccode>budget_exhausted\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>issue_model_call_in_tx\u003c/code>\u003c/td>\u003ctd>许可 ID、运行权 → 一次性发送许可或已知状态\u003c/td>\u003ctd>检查代次、参数、限额版本、到期时间；仅首次 \u003ccode>reserved→issued\u003c/code> 返回可发送，不因重传再次授权\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>settle_model_call_in_tx\u003c/code>\u003c/td>\u003ctd>尝试 ID、可靠用量/未发出证据/未知原因 → 结算状态\u003c/td>\u003ctd>用量幂等结算；超时未知不退款；会话删除/取消后允许核对归属、原运行代次与指纹后结算原尝试，不能获得新发送权\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>prepare_run_commit_in_tx\u003c/code>\u003c/td>\u003ctd>运行权、最终片段摘要、SDK 检查点、消费事件列表 → 已验证提交材料\u003c/td>\u003ctd>检查完整片段、格式版本、事件/输出归属和未决工具；不接收任意任务/查询状态；纯验证不提前提交\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>commit_run_in_tx\u003c/code>\u003c/td>\u003ctd>提交材料、稳定 \u003ccode>commit_id\u003c/code> → 最终输出引用/运行回执\u003c/td>\u003ctd>在组合层事务内保存最终正文、检查点和运行终态；同 ID/摘要返回原提交，冲突拒绝；旧代次不能新增提交\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>预算新增 \u003ccode>scope_kind=user_request|maintenance\u003c/code>。用户范围继续严格遵守第 19.8 节；资料预填和 Embedding 等后台付费调用采用已配置的有界 \u003ccode>maintenance\u003c/code> 范围，并受试验总上限约束。M03 单次结构化分析可经 \u003ccode>PrefillModelPort\u003c/code> 调模型；它不建立自主循环，也须先申请 M08 许可。\u003c/p>\n\u003cp>调用许可接受宿主绑定的 \u003ccode>RunContext\u003c/code> 或 \u003ccode>MaintenanceContext\u003c/code>；后者固定作业 ID、领取代次、配置/模型/资料范围、预算引用。维护调用校验 M10 的当前代次；工具/聊天接口不接受维护上下文，模型不能借此改换预算。若资料同步仅调用不计费平台读取，则不扣模型额度。\u003c/p>\n\u003cp>\u003ccode>append_output\u003c/code> 组合用例在一事务保存 M08 片段和 M05 流式事件，提交后才投递；事件携带输出/尝试/片段 ID。模型消费推进 \u003ccode>input_seq\u003c/code>，SSE 按 \u003ccode>event_seq\u003c/code> 读取；输出/展示事件不重新成为 Agent 输入。\u003c/p>\n\u003cp>模型选择来自持久 \u003ccode>ModelProfile\u003c/code>，Pi 从锁定 SDK 的对应目录项加载，维护预填使用同一模型 ID。允许 Flash 与 Pro 的明确价格版本配对；Pro 当前支持 off/high，原 I0 task 配置继续限 Flash。模型和价格都属于试验指纹，不能在旧试验中改换。聊天与维护按各自模型的高峰缓存未命中价保守计账，不声称等于服务商实际折扣账单。\u003c/p>\n\u003cp>调用耗时和 token/调用数跨重启累计，等待用户/查询不算模型运行时长。SDK 每次实际网络尝试均先取许可；不能拦截的隐式重试必须关闭，否则真实模型子项保持阻塞。价格或可计算输入/输出上界缺失时不承诺严格金额上限。\u003c/p>\n\u003cp>\u003ccode>issued\u003c/code> 落库与网络发送之间不能原子化，崩溃按可能已发出处理；新调用另申请尝试且旧预留保留。模型用量迟到可凭平台回执结算原账本，运行已过期不允许因此提交旧输出或再次发请求。\u003c/p>\n\u003cp>锁定Pi 1.0.0的恢复接入：从最近assistant消息中找出尚未匹配toolResult的调用，即使检查点以另一工具的结果结尾，也沿原SDK调用及operation_id逐个接回。明确拒绝的持久回执接为isError结果，成功的只写一次。工具提交响应失败后，通过内部只读\u003ccode>/internal/data/tool-rejections\u003c/code>按当前运行权、原SDK调用和参数指纹查证；仅返回已持久的rejected回执，不执行原工具、不返回成功正文，不存在或失权继续保留原错误。首次业务拒绝也在同次恢复交给Pi，不额外耗费一次Worker交付。执行前工具名/参数校验失败也接为未执行的isError结果，交Pi修正；登记与提交未知继续抛出，不能伪装成明确失败。接回后使用公开的\u003ccode>session.prompt(RECOVERY_NOTICE, { expandPromptTemplates: false })\u003c/code>继续原输入，先刷新当前资源，再经SDK会话的原生完成后处理与溢出压缩；不直接调用底层\u003ccode>session.agent.continue()\u003c/code>。恢复通知绑定原message_id/recovery_chain_id，不创建新业务输入或新预算。\u003c/p>\n\u003cp>正式回答交付若被\u003ccode>finish_run\u003c/code>明确拒绝\u003ccode>message_pending\u003c/code>，说明当前消息尚未登记归属且输出未提交。SDK明确报告\u003ccode>stopReason=length\u003c/code>时同样拒绝提交半截回答。Node仅通过Pi原生\u003ccode>sendCustomMessage\u003c/code>反馈一次相应拒绝，让模型补齐归属/澄清或重写简洁完整的回答，再提交修正后的完整文本。沿用原会话、run、message、恢复链和调用预算；宿主不替模型创建任务。取消后不起补正轮；再次拒绝、其他错误和未知回执均继续失败，不循环追加反馈或重做未知提交。验证覆盖修正成功、持续遗漏仅反馈一次、明确length不提交及最后回答替代前轮文本。\u003ccode>stopReason=stop\u003c/code>并不能证明自然语言完整或正确，仍需业务质量审查。\u003c/p>\n\u003cp>交付从Pi原生\u003ccode>message_end\u003c/code>事件取得最近完成的助手消息。SDK为整理上下文可能从\u003ccode>agent.state.messages\u003c/code>移除length消息；不能从整理后的上下文倒查输出，否则会拿前一条工具调用文字冒充最终回答。\u003ccode>message_start\u003c/code>继续绑定正式片段起点，完整片段校验仍由Rust执行。\u003c/p>","svg":"\u003csvg aria-roledescription=\"flowchart-v2\" role=\"graphics-document document\" viewBox=\"-8 -9 1866.8125 477.5\" height=\"477.5\" xmlns=\"http://www.w3.org/2000/svg\" width=\"1866.8125\" id=\"diagramS08\">\u003cstyle>#diagramS08{font-family:PingFang SC,Microsoft YaHei,Arial,sans-serif;font-size:17px;fill:#172c40;}#diagramS08 .error-icon{fill:#ffffff;}#diagramS08 .error-text{fill:#000000;stroke:#000000;}#diagramS08 .edge-thickness-normal{stroke-width:2px;}#diagramS08 .edge-thickness-thick{stroke-width:3.5px;}#diagramS08 .edge-pattern-solid{stroke-dasharray:0;}#diagramS08 .edge-pattern-dashed{stroke-dasharray:3;}#diagramS08 .edge-pattern-dotted{stroke-dasharray:2;}#diagramS08 .marker{fill:#617387;stroke:#617387;}#diagramS08 .marker.cross{stroke:#617387;}#diagramS08 svg{font-family:PingFang SC,Microsoft YaHei,Arial,sans-serif;font-size:17px;}#diagramS08 .label{font-family:PingFang SC,Microsoft YaHei,Arial,sans-serif;color:#172c40;}#diagramS08 .cluster-label text{fill:#000000;}#diagramS08 .cluster-label span,#diagramS08 p{color:#000000;}#diagramS08 .label text,#diagramS08 span,#diagramS08 p{fill:#172c40;color:#172c40;}#diagramS08 .node rect,#diagramS08 .node circle,#diagramS08 .node ellipse,#diagramS08 .node polygon,#diagramS08 .node path{fill:#eef4fb;stroke:#607c99;stroke-width:1px;}#diagramS08 .flowchart-label text{text-anchor:middle;}#diagramS08 .node .katex path{fill:#000;stroke:#000;stroke-width:1px;}#diagramS08 .node .label{text-align:center;}#diagramS08 .node   Provider --> Index[(Milvus候选与派生索引)]\n    Lifecycle --> Jobs[同事务保存索引待办]\n    Jobs --> Provider\n    Applicability[依赖与适用性核对] --> Selection[Skill 选择与加载]\n    Selection --> Adoption[实际采用与依据记录]\n    Adoption --> Store\n    Applicability --> Store","context":"\u003cp>\u003cstrong>职责：\u003c/strong>按用户与空间管理独立版本的记忆和 Skill，核对适用范围、依赖、验证和替代关系。会话删除不自动删除已独立保存资产，来源显示已删除且不可读回正文；个人聊天不直接修改公共定义。\u003c/p>\n\u003cp>\u003cstrong>私有数据：\u003c/strong>\u003ccode>personal_assets\u003c/code>、\u003ccode>personal_asset_versions\u003c/code>、\u003ccode>personal_memory_index_jobs\u003c/code>、来源/知识依赖、替代关系、资产验证、Skill 选择与采用记录。记忆保存原话与整理后修正、错误反例、范围/例外、来源任务及依据；Skill 保存名称、说明、参数、步骤、输出要求和依赖。选择前由组合层向 M05 / M06 核对会话/任务归属；选择与采用由 M09 独占保存，M05 / M06 只引用记录 ID。\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>公开操作\u003c/th>\u003cth>输入\u003c/th>\u003cth>输出\u003c/th>\u003cth>错误、副作用与幂等\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ccode>read_assets\u003c/code> / \u003ccode>list_assets\u003c/code>\u003c/td>\u003ctd>可信归属、ID/版本或类型/游标、管理/采用用途\u003c/td>\u003ctd>资产正文、范围、依赖及状态\u003c/td>\u003ctd>只读；管理页可读自己的停用项，采用读取排除停用/删除项；跨用户统一不可用\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>find_related\u003c/code>\u003c/td>\u003ctd>可信归属、对象、问题范围、最新版本条件\u003c/td>\u003ctd>明确关联的最新记忆/Skill 候选\u003c/td>\u003ctd>只读；索引滞后时补查，候选不代表已采用\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>save_memory_in_tx\u003c/code>\u003c/td>\u003ctd>明确纠错/记住请求、范围、原话、整理值、依据\u003c/td>\u003ctd>个人记忆版本、索引意图、可告知的保存范围\u003c/td>\u003ctd>\u003ccode>scope_incomplete\u003c/code> 可保存待核对线索；“仅本次”不写长期记忆；失败不告知已记住\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>save_skill_in_tx\u003c/code>\u003c/td>\u003ctd>用户保存/编辑请求、草稿、名称/参数/依赖、起点版本\u003c/td>\u003ctd>草稿或启用版本、索引意图\u003c/td>\u003ctd>用户保存/启用；已有清楚保存请求可直接保存，不强制改名或编辑；不执行任意用户脚本；稳定操作幂等\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>check_applicability\u003c/code>\u003c/td>\u003ctd>当前资产、任务条件、已回源依赖/授权结果\u003c/td>\u003ctd>可用线索、冲突、需复核或不可用\u003c/td>\u003ctd>只读；未验证记忆仅作检查线索，依赖变化不得悄悄沿用旧定义\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>select_skill_in_tx\u003c/code>\u003c/td>\u003ctd>宿主确认的用户选择、Skill ID/版本、组合层核对的会话/任务归属及条件\u003c/td>\u003ctd>选择记录 ID、固定版本、适用性结果\u003c/td>\u003ctd>\u003ccode>not_available\u003c/code> / \u003ccode>version_conflict\u003c/code> / \u003ccode>not_applicable\u003c/code> / \u003ccode>idempotency_conflict\u003c/code>；按用户与操作保存含会话的请求指纹和原回执，异参拒绝；同参重传不重新激活已改版/停用的旧选择\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>load_selected_skill\u003c/code>\u003c/td>\u003ctd>宿主保存的用户选择、当前启用版本、适用性结果\u003c/td>\u003ctd>本次方法正文及固定引用版本\u003c/td>\u003ctd>\u003ccode>selection_required\u003c/code> / \u003ccode>version_conflict\u003c/code>；推荐不构成选择，模型不能伪造用户选用\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>record_adoption_in_tx\u003c/code>\u003c/td>\u003ctd>实际采用的资产/依赖版本、运行与任务引用、范围/采用方式、Skill 选择记录（如有）\u003c/td>\u003ctd>采用记录 ID 与引用版本\u003c/td>\u003ctd>记忆线索与执行方法分别标明；Skill 无有效选择拒绝；同运行/操作重传不重复记录\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>revise_or_replace_in_tx\u003c/code>\u003c/td>\u003ctd>起点版本、修订值或替代关系、依据\u003c/td>\u003ctd>新版本、旧项替代状态、待办\u003c/td>\u003ctd>不静默合并不同范围；共享语义修正通过组合层另走 M02 维护权限\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>change_asset_status_in_tx\u003c/code>\u003c/td>\u003ctd>起点版本、启用/停用/删除\u003c/td>\u003ctd>新状态、索引及上下文失效意图\u003c/td>\u003ctd>归属与版本必查；停用/删除立即阻止后续采用，派生清理异步且可追踪\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>2026-10-06选择Mem0 OSS 2.2.1作为正式提取/检索适配器。MySQL保留正式正文与版本；Mem0/Milvus保存待提交及已提交向量，SQLite保存技术回执与SDK历史。Skill 正文兼容 \u003ccode>SKILL.md\u003c/code>，M11 使用经宿主核对的正文，不通过任意路径读取或默认资源发现加载。\u003c/p>\n\u003cp>自动保存/修订时，组合用例将Mem0最终正文同时绑定为\u003ccode>body\u003c/code>与\u003ccode>scope\u003c/code>，\u003ccode>name\u003c/code>取该正文前40个Unicode字符。范围保留整段限定，不另调模型压缩或让Pi追加别名；完整原话另存\u003ccode>source_text\u003c/code>，临时要求由提取排除。builtin模型替身的最终正文也遵守相同绑定。人工\u003ccode>POST /assets\u003c/code>继续按用户显式编辑保存名称/范围；已有版本不会被后台悄悄重写。\u003c/p>\n\u003ch3>正式Mem0接缝（同源契约）\u003c/h3>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>接口\u003c/th>\u003cth>输入与输出\u003c/th>\u003cth>约束\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ccode>POST /extract\u003c/code>\u003c/td>\u003ctd>\u003ccode>MemoryExtractionRequest → MemoryExtractionReceipt\u003c/code>：稳定operation、宿主归属、完整消息与引用、预算绑定 → 正文及replayed\u003c/td>\u003ctd>保存前调用；pending不可检索；同操作同指纹接回，未知不重新提取\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>POST /index\u003c/code>\u003c/td>\u003ctd>\u003ccode>MemoryIndexRequest → MemoryIndexReceipt\u003c/code>：正式资产快照、版本、提取operation（可空）→ ready/removed/superseded\u003c/td>\u003ctd>有提取回执时提交现成向量；人工正文直接embedding；旧版本不覆盖新版本\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>POST /search\u003c/code>\u003c/td>\u003ctd>\u003ccode>MemorySearchRequest → MemorySearchReceipt\u003c/code>：宿主归属、问题、预算 → asset_id/version候选与bounded\u003c/td>\u003ctd>过滤ready后排序，最多200候选；Rust按当前权限/版本/状态/依赖回源\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>POST /internal/memory/model-calls\u003c/code>\u003c/td>\u003ctd>\u003ccode>MemoryModelCall\u003c/code>：issue/finalize、调用ID、用途、上限、usage\u003c/td>\u003ctd>内部token；M08逐调用许可和结算；run或索引作业还原原预算\u003c/td>\u003c/tr>\u003ctr>\u003ctd>现有\u003ccode>GET /assets\u003c/code>\u003c/td>\u003ctd>Asset新增可选\u003ccode>memory_index_state\u003c/code>\u003c/td>\u003ctd>queued/issued/indexed/failed/superseded，正式保存与索引完成分开显示\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>以上Schema位于\u003ccode>packages/contracts/schema.json\u003c/code>；Rust入口记在OpenAPI。侧车路由只监听回环并使用内部token，浏览器不能传用户ID调用。\u003ccode>personal_memory\u003c/code>用例组合M09、M08和有效性校验；\u003ccode>memory_provider\u003c/code>薄接缝转换HTTP，不复制SDK算法。\u003c/p>\n\u003cp>\u003ccode>personal_memory_index_jobs\u003c/code>私属M09，与资产同事务写入；Worker在独立循环按目标集合领取，租约180秒、最多3次。只有明确暂时不可用可重试同任务；未知保留，不换ID补额。领取后的新embedding许可再次核对正式启用版本和依赖，结算不要求旧运行仍有效。资产先保存、索引后提交；UI暴露进度与失败。\u003c/p>\n\u003cp>存量/重建每批最多32条，从正式正文排队，使用明确维护profile。目标集合绑定数据库；新集合保留旧队列与账本，旧目标不会被当前Worker领取。SQLite回执目录跟随数据库与集合持久保存，服务互斥启动。索引丢失后按开发文档切换新集合重建，不重置收费历史。\u003c/p>","svg":"\u003csvg aria-roledescription=\"flowchart-v2\ ode>renew_lease\u003c/code>\u003c/td>\u003ctd>作业 ID、领取者、代次、续租时间\u003c/td>\u003ctd>新到期时间\u003c/td>\u003ctd>旧代次、租约失效\u003c/td>\u003ctd>只延长当前持有者租约\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>settle_in_tx\u003c/code>\u003c/td>\u003ctd>AppTx、作业/代次、完成或有限重试决定、错误\u003c/td>\u003ctd>作业状态 / 原回执\u003c/td>\u003ctd>旧代次、状态冲突\u003c/td>\u003ctd>完成、待重试或失败；不修改业务表\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>","svg":"\u003csvg aria-roledescription=\"flowchart-v2\" role=\"graphics-document document\" viewBox=\"-8 -8 763.5625 274\" height=\"274\" xmlns=\"http://www.w3.org/2000/svg\" width=\"763.5625\" id=\"diagramS10\">\u003cstyle>#diagramS10{font-family:PingFang SC,Microsoft YaHei,Arial,sans-serif;font-size:17px;fill:#172c40;}#diagramS10 .error-icon{fill:#ffffff;}#diagramS10 .error-text{fill:#000000;stroke:#000000;}#diagramS10 .edge-thickness-normal{stroke-width:2px;}#diagramS10 .edge-thickness-thick{stroke-width:3.5px;}#diagramS10 .edge-pattern-solid{stroke-dasharray:0;}#diagramS10 .edge-pattern-dashed{stroke-dasharray:3;}#diagramS10 .edge-pattern-dotted{stroke-dasharray:2;}#diagramS10 .marker{fill:#617387;stroke:#617387;}#diagramS10 .marker.cross{stroke:#617387;}#diagramS10 svg{font-family:PingFang SC,Microsoft YaHei,Arial,sans-serif;font-size:17px;}#diagramS10 .label{font-family:PingFang SC,Microsoft YaHei,Arial,sans-serif;color:#172c40;}#diagramS10 .cluster-label text{fill:#000000;}#diagramS10 .cluster-label span,#diagramS10 p{color:#000000;}#diagramS10 .label text,#diagramS10 span,#diagramS10 p{fill:#172c40;color:#172c40;}#diagramS10 .node rect,#diagramS10 .node circle,#diagramS10 .node ellipse,#diagramS10 .node polygon,#diagramS10 .node path{fill:#eef4fb;stroke:#607c99;stroke-width:1px;}#diagramS10 .flowchart-label text{text-anchor:middle;}#diagramS10 .node .katex path{fill:#000;stroke:#000;stroke-width:1px;}#diagramS10 .node .label{text-align:center;}#diagramS10 .node.clickable{cursor:pointer;}#diagramS10 .arrowheadPath{fill:#0b0b0b;}#diagramS10 .edgePath .path{str 003c/tspan>\u003c/text>\u003c/g>\u003c/g>\u003cg transform=\"translate(614.9921875, 129)\" data-id=\"Retry\" data-node=\"true\" id=\"flowchart-Retry-656\" class=\"node default default flowchart-label\">\u003crect height=\"46\" width=\"265.140625\" y=\"-23\" x=\"-132.5703125\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\">\u003c/rect>\u003cg transform=\"translate(0, -12)\" style=\"\" class=\"label\">\u003crect>\u003c/rect>\u003ctext style=\"\">\u003ctspan class=\"row\" x=\"0\" dy=\"1em\" xml:space=\"preserve\">retry · 保存重试安排与结束状态\u003c/tspan>\u003c/text>\u003c/g>\u003c/g>\u003cg transform=\"translate(338.03125, 235)\" data-id=\"Store\" data-node=\"true\" id=\"flowchart-Store-660\" class=\"node default default flowchart-label\">\u003crect height=\"46\" width=\"275.5\" y=\"-23\" x=\"-137.75\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\">\u003c/rect>\u003cg transform=\"translate(0, -12)\" style=\"\" class=\"label\">\u003crect>\u003c/rect>\u003ctext style=\"\">\u003ctspan class=\"row\" x=\"0\" dy=\"1em\" xml:space=\"preserve\">私有 store.rs · background_jobs\u003c/tspan>\u003c/text>\u003c/g>\u003c/g>\u003c/g>\u003c/g>\u003c/g>\u003c/svg>"},{"id":"S11","module":"M11","name":"M11 pi-bridge：Node 与 Pi","heading":"S11 模块内部结构","filename":"implementation-views.md","source":"flowchart TB\n  subgraph Bridge[\"M11 · Node 桥\"]\n    Session[\"session · 恢复、交付与取消\"] --> Tools[\"tools · 受控工具映射\"]\n    Session --> Provider[\"provider · 每次调用许可与结算\"]\n    Session --> Transport[\"transport · Rust 协议与事件\"]\n    Session --> Checkpoint[\"checkpoint · 小引用 / 精确 leaf\"]\n    Checkpoint --> Journal[\"journal · 原生存储校验 / fsync\"]\n    Tools & Provider --> Transport\n  end\n  Session --> SDK[\"Pi SDK · 唯一 Agent 循环\"]\n  Journal --> SDK\n  Journal --> Files[(私有 JSONL 会话树)]\n  Transport --> Rust[\"Rust 受控接口\"]","context":"\u003cp>桥接固定 SDK 的注册、恢复、事件和取消；业务身份由 M01 产生并由 Rust 绑定。首次工具登记由宿主分配稳定 \u003ccode>operation_id\u003c/code>，持久映射到 \u003ccode>origin_run_id / sdk_tool_call_id\u003c/code>；恢复包携带该映射以接回原调用与结果。新的 \u003ccode>run_id / lease_epoch\u003c/code> 校验当前运行权，恢复不改变原副作用身份。M11 复用 Pi 原生 JSONL 会话存储，恢复包只保存版本、文件名、原 session 与精确 leaf/authority；业务授权仍由 Rust 判断。\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>操作\u003c/th>\u003cth>输入\u003c/th>\u003cth>输出\u003c/th>\u003cth>错误\u003c/th>\u003cth>副作用\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ccode>resume_and_deliver\u003c/code>\u003c/td>\u003ctd>运行/代次、事件、任务条件、允许上下文、工具清单、恢复包\u003c/td>\u003ctd>接收状态 / 运行标识\u003c/td>\u003ctd>版本不支持、运行冲突、恢复失败\u003c/td>\u003ctd>恢复 Pi；不自行创建业务任务\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>invoke_tool\u003c/code> → Rust\u003c/td>\u003ctd>当前运行/代次、宿主绑定 operation_id、origin_run_id / sdk_tool_call_id、工具及参数指纹\u003c/td>\u003ctd>原操作结果 / 处理中 / 未知\u003c/td>\u003ctd>权限、旧版本、映射不符、同 ID 异参\u003c/td>\u003ctd>Rust 按原 operation_id 接回或执行；新运行不能重置副作用身份\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>send_model_attempt\u003c/code>\u003c/td>\u003ctd>原预算引用、调用指纹、输入/输出上界\u003c/td>\u003ctd>响应 / 用量 / 未知\u003c/td>\u003ctd>额度不足、许可过期、超时\u003c/td>\u003ctd>向 M08 申请并消费许可后发一次请求；SDK 重试也受控\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>append_output\u003c/code> → Rust\u003c/td>\u003ctd>output_id、attempt_id、chunk_seq、代次、片段\u003c/td>\u003ctd>接收进度 / 缺口\u003c/td>\u003ctd>旧代次、片段冲突\u003c/td>\u003ctd>保存可重连片段；不代表最终提交\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>finish_run\u003c/code> → Rust\u003c/td>\u003ctd>最终输出、恢复包、消费进度、代次\u003c/td>\u003ctd>原提交 / 已提交\u003c/td>\u003ctd>旧代次、缺片、持久化失败\u003c/td>\u003ctd>Rust 原子提交并释放 M05 租约；不伪造查询终态\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>cancel_run\u003c/code>\u003c/td>\u003ctd>运行 ID、代次\u003c/td>\u003ctd>已接收 / 当前模型状态\u003c/td>\u003ctd>运行不存在、旧代次\u003c/td>\u003ctd>停止模型；平台取消由 M07 单独处理\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>","svg":"\u003csvg aria-roledescription=\"flowchart-v2\" role=\"graphics-document document\" viewBox=\"-8 -9 1003.5078125 484.553466796875\" height=\"484.553466796875\" xmlns=\"http://ww form=\"translate(0, -12)\" style=\"\" class=\"label\">\u003crect>\u003c/rect>\u003ctext style=\"\">\u003ctspan class=\"row\" x=\"0\" dy=\"1em\" xml:space=\"preserve\">Rust 受控接口\u003c/tspan>\u003c/text>\u003c/g>\u003c/g>\u003c/g>\u003c/g>\u003c/g>\u003c/svg>"},{"id":"S12","module":"M12","name":"M12 web：交互与展示","heading":"S12 模块内部结构","filename":"implementation-views.md","source":"flowchart TB\n  App[\"app · 路由、身份与功能装配\"] --> Workbench[\"feature · 工作台与历史\"]\n  App --> Knowledge[\"feature · 语义与文档维护\"]\n  App --> Assets[\"feature · 记忆与 Skill\"]\n  App --> API[\"API client · 请求与 DTO 校验\"]\n  App --> SSE[\"SSE client · 游标、去重与重连\"]\n  Workbench & Knowledge & Assets --> API\n  Workbench --> SSE\n  Workbench & Knowledge & Assets --> UI[\"shared UI · 基础交互组件\"]","context":"\u003cp>只保存输入草稿、页面选择等界面状态；服务端状态经 HTTP 与可重连 SSE 更新。主入口沿用工作台、我的积累、语义管理；身份、确认可执行性和资源归属以 Rust 返回为准。\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>操作\u003c/th>\u003cth>输入\u003c/th>\u003cth>输出\u003c/th>\u003cth>错误\u003c/th>\u003cth>副作用\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ccode>load_workspace\u003c/code>\u003c/td>\u003ctd>登录会话、会话/任务或资源 ID\u003c/td>\u003ctd>有权查看的快照与版本\u003c/td>\u003ctd>无权限、不存在、结果过期\u003c/td>\u003ctd>更新视图；不自报用户身份\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>submit_message\u003c/code>\u003c/td>\u003ctd>会话、稳定 message_id、正文/澄清引用\u003c/td>\u003ctd>已接收消息 / 当前阻塞状态\u003c/td>\u003ctd>ID 异参、无权限、服务失败\u003c/td>\u003ctd>服务端持久化成功后标记已发送\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>confirm_query\u003c/code>\u003c/td>\u003ctd>已展示请求 ID、草稿版本、客户端确认 ID\u003c/td>\u003ctd>同一查询 ID / 当前状态\u003c/td>\u003ctd>message_pending、版本冲突、无权限\u003c/td>\u003ctd>由真实用户操作触发；不附替换 SQL、不自动重确认\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>cancel_task\u003c/code>\u003c/td>\u003ctd>任务 ID、命令 ID\u003c/td>\u003ctd>任务停止与各关联查询取消状态\u003c/td>\u003ctd>无权限、已终止、服务失败\u003c/td>\u003ctd>停止该任务后续推进；展示各查询真实状态\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>cancel_query\u003c/code>\u003c/td>\u003ctd>查询 ID、命令 ID\u003c/td>\u003ctd>该查询的取消接收结果与真实状态\u003c/td>\u003ctd>无权限、已终止、不支持、服务失败\u003c/td>\u003ctd>只取消指定查询，不取消整个分析任务；不先宣布成功\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>save_resource\u003c/code> / \u003ccode>select_skill\u003c/code>\u003c/td>\u003ctd>资源 ID、base_version、补丁；或 Skill 版本/任务\u003c/td>\u003ctd>新版本与索引状态 / 选择记录\u003c/td>\u003ctd>冲突、停用、范围不符\u003c/td>\u003ctd>通过服务端保存；Skill 推荐不自动采用\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>consume_events\u003c/code>\u003c/td>\u003ctd>会话、上次 event_seq\u003c/td>\u003ctd>追加/替换输出与新游标\u003c/td>\u003ctd>缺片、需快照、连接中断\u003c/td>\u003ctd>去重；缺历史时取快照，不拼接两次半段回答\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>show_result\u003c/code> / \u003ccode>export_csv\u003c/code>\u003c/td>\u003ctd>查询引用、已获数据范围\u003c/td>\u003ctd>表格、图表、CSV\u003c/td>\u003ctd>过期、无权限、数据未齐\u003c/td>\u003ctd>明示分页、截断和来源；导出不扩大范围\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>","svg":"\u003csvg aria-roledescription=\"flowchart-v2\" role=\"graphics-document document\" viewBox=\"-8 -8 905.9921875 274\" height=\"274\" xmlns=\"http://www.w3.org/2000/svg\" width=\"905.9921875\" id=\"diagramS12\">\u003cstyle>#diagramS12{font-family:PingFang SC,Microsoft YaHei,Arial,sans-serif;font-size:17px;fill:#172c40;}#diagramS12 .error-icon{fill:#ffffff;}#diagramS12 .error-text{fill:#000000;stroke:#000000;}#diagramS12 .edge-thickness-normal{stroke-width:2px;}#diagramS12 .edge-thickness-thick{stroke-width:3.5px;}#diagramS12 .edge-pattern-solid{stroke-dasharray:0;}#diagramS12 .edge-pattern-dashed{stroke-dasharray:3;}#diagramS12 .edge-pattern-dotted{stroke-dasharray:2;}#diagramS12 .marker{fill:#617387;stroke:#617387;}#diagramS12 .marker.cross{stroke:#617387;}#diagramS12 svg{font-family:PingFang SC,Microsoft YaHei,Arial,sans-serif;font-size:17px;}#diagramS12 .label{font-family:PingFang SC,Microsoft YaHei,Arial,sans-serif;color:#172c40;}#diagramS12 .cluster-label text{fill:#000000;}#diagramS12 .cluster-label span,#diagramS12 p{color:#000000;}#diagramS12 .label text,#diagramS12
