te over R,P: 按相同领取与恢复流程继续\n  end\n  P->>R: request_query / SQL、参数、条件与目标版本\n  R->>D: 保存检查结果、草稿和待确认请求\n  P->>R: finish_run / 等待确认\n  R->>D: 提交输出、检查点和进度；释放会话租约\n  R-->>W: 展示已保存 SQL 与取数说明\n  opt 用户补充或纠正\n    W->>R: 保存修订消息，立即阻止受影响旧确认\n    Note over R,P: 调查并保存新版 SQL，重新展示；未提及条件保留\n  end\n  U->>W: 确认展示的具体版本\n  W->>R: confirm / 请求 ID、草稿版本\n  R->>D: 事务：会话锁、版本和待归属检查、确认记录、提交作业\n  B->>R: 提交已确认请求\n  R->>D: 登记提交意图；检查领取代次与最新权限\n  Note over R,Q: SQL 完整解析与目标能力检查；网络调用在数据库事务之外\n  R->>Q: submit_query / 已存 SQL / 幂等标识\n  Q-->>R: 平台 ID 与状态，或回执未知\n  R->>D: 保存回执；未知先查证，不盲目重提\n  Note over W,P: 查询等待期间 Pi 已释放；页面可断开，同会话可处理新问题\n  B->>R: 跟踪查询\n  R->>Q: 查状态 / 按权限读取结果引用\n  Q-->>R: 真实终态、范围与完整性\n  R->>D: 事务：M07 查询状态、M05 交付事件、M10 续跑作业\n  B->>R: 领取原会话结果事件\n  R->>P: 原任务、原条件和原预算范围；恢复解释\n  P->>R: finish_run / 解释与 SDK 恢复条目\n  R->>D: 事务：最终输出、检查点与消费进度；释放会话租约\n  R-->>W: 原任务结果与解释 / SSE\n  opt 明确且有复用价值的个人纠错\n    U->>W: 纠正理解或口径\n    W->>R: 保存消息并登记续跑\n    R->>P: 按新消息范围恢复运行\n    P->>R: 受控个人记忆保存请求 / 范围与依据\n    R->>M: 原始消息和引用 / 原operation / M08逐调用预算\n    M-->>R: 候选正文及持久提取回执\n    R->>D: 重新核对后事务保存M09资产与索引待办\n    B->>M: 提交正式版本 / 候选可检索\n    R-->>W: 已保存的内容、适用范围及管理入口\n  end","context":"","svg":"\u003csvg aria-roledescription=\"sequence\" role=\"graphics-document document\" viewBox=\"-30 -25 1637 3493\" height=\"3493\" xmlns=\"http://www.w3.org/2000/svg\" width=\"1637\" id=\"diagramV03\">\u003cg>\u003crect class=\"actor actor-bottom\" ry=\"3\" rx=\"3\" name=\"M\" height=\"65\" width=\"150\" stroke=\"#666\" fill=\"#eaeaea\" y=\"3377\" x=\"1427\">\u003c/rect>\u003ctext style=\"text-anchor: middle; font-size: 16px; font-weight: 400; font-family: &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, Arial, sans-serif;\" class=\"actor\" alignment-baseline=\"central\" dominant-baseline=\"central\" y=\"3409.5\" x=\"1502\">\u003ctspan dy=\"0\" x=\"1502\">Mem0侧车\u003c/tspan>\u003c/text>\u003c/g>\u003cg>\u003crect class=\"actor actor-bottom\" ry=\"3\" rx=\"3\" name=\"Q\" height=\"65\" width=\"150\" stroke=\"#666\" fill=\"#eaeaea\" y=\ minant-baseline=\"middle\" text-anchor=\"middle\" y=\"3178\" x=\"611\">引待办\u003c/text>\u003cline style=\"fill: none;\" marker-end=\"url(#arrowhead)\" stroke=\"none\" stroke-width=\"2\" class=\"messageLine0\" y2=\"3217\" x2=\"718\" y1=\"3217\" x1=\"504\">\u003c/line>\u003ctext style=\"font-family: &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, Arial, sans-serif; font-size: 16px; font-weight: 400;\" dy=\"1em\" class=\"messageText\" alignment-baseline=\"middle\" dominant-baseline=\"middle\" text-anchor=\"middle\" y=\"3232\" x=\"1208\">提交正式版本 / 候选可检索\u003c/text>\u003cline style=\"fill: none;\" marker-end=\"url(#arrowhead)\" stroke=\"none\" stroke-width=\"2\" class=\"messageLine0\" y2=\"3271\" x2=\"1498\" y1=\"3271\" x1=\"918\">\u003c/line>\u003ctext style=\"font-family: &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, Arial, sans-serif; font-size: 16px; font-weight: 400;\" dy=\"1em\" class=\"messageText\" alignment-baseline=\"middle\" dominant-baseline=\"middle\" text-anchor=\"middle\" y=\"3286\" x=\"395\">已保存的内容、适用范围及管理入-\u003c/text>\u003ctext style=\"font-family: &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, Arial, sans-serif; font-size: 16px; font-weight: 400;\" dy=\"1em\" class=\"messageText\" alignment-baseline=\"middle\" dominant-baseline=\"middle\" text-anchor=\"middle\" y=\"3308\" x=\"395\">口\u003c/text>\u003cline style=\"stroke-dasharray: 3, 3; fill: none;\" marker-end=\"url(#arrowhead)\" stroke=\"none\" stroke-width=\"2\" class=\"messageLine1\" y2=\"3347\" x2=\"288\" y1=\"3347\" x1=\"502\">\u003c/line>\u003cg name=\"U\" class=\"actor-man actor-bottom\">\u003cline y2=\"3422\" x2=\"75\" y1=\"3402\" x1=\"75\" id=\"actor-man-torso7\">\u003c/line>\u003cline y2=\"3410\" x2=\"93\" y1=\"3410\" x1=\"57\" id=\"actor-man-arms7\">\u003c/line>\u003cline y2=\"3422\" x2=\"75\" y1=\"3437\" x1=\"57\">\u003c/line>\u003cline y2=\"3437\" x2=\"91\" y1=\"3422\" x1=\"75\">\u003c/line>\u003ccircle height=\"65\" width=\"150\" r=\"15\" cy=\"3387\" cx=\"75\">\u003c/circle>\u003ctext style=\"text-anchor: middle; font-size: 16px; font-weight: 400; font-family: &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, Arial, sans-serif;\" class=\"actor\" alignment-baseline=\"central\" dominant-baseline=\"central\" y=\"3444.5\" x=\"75\">\u003ctspan dy=\"0\" x=\"75\">用户\u003c/tspan>\u003c/text>\u003c/g>\u003c/svg>"},{"id":"F01","module":"M01","name":"M01 access：身份、权限与模型资料范围","heading":"F01 身份与资料范围校验","filename":"knowledge-modules.md","source":"flowchart TD\n    A[可信身份与资源描述] --> B{身份和空间有效}\n    B -->|否| X[统一拒绝或服务失败]\n    B -->|是| C{当前动作属于哪类}\n    C -->|语义编辑与接受或驳回| L[校验本系统表负责人或超级维护者\u003cbr/>按当前授权版本校验]\n    C -->|提交纠错建议| Proposal[核对本人 目标可读与内容可共享范围\u003cbr/>不要求维护权]\n    C -->|平台资料与SQL查询| P[独立校验Datasight动作权限]\n    C -->|个人资源| O[核对本人及空间归属]\n    L --> V{对应授权通过}\n    P --> V\n    O --> V\n    Proposal --> V\n    V -->|否或未知| X\n    V -->|是| D{资料交给模型}\n    D -->|是| E[核对端点资料类别和字段范围]\n    D -->|否| F[生成允许的字段与来源]\n    E --> J{端点范围允许}\n    J -->|否| X\n    J -->|是| F\n    F --> G[返回内部授权决定及策略版本]\n    G --> H[组合层仅交付允许内容]","context":"\u003cp>\u003cstrong>职责：\u003c/strong>验证可信身份，分别校验本系统语义维护权限、平台数据权限和个人资源归属，再核对具体模型端点可接收的资料范围。目录读取、来源 SQL、文档、字段样例和结果分别判断；目录可见不等于查询可执行。平台权限适配器表达实际授权与未知能力，M01 不自建数仓权限平台。\u003c/p>\n\u003cp>\u003cstrong>私有数据：\u003c/strong>身份映射、空间与平台授权映射、端点资料策略及版本、必要的权限缓存/失效标识；只保存凭据引用。\u003ccode>semantic_ownership\u003c/code> 保存对象归属与授权版本，\u003ccode>semantic_owner_operations\u003c/code> 保存独立指派回执；超级维护者来自可信启动配置，不能用平台执行权限推导。会话/资产归属和对象分类由各所属模块通过组合层提供，M01 不读取其私有表。\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>公开操作\u003c/th>\u003cth>输入\u003c/th>\u003cth>输出\u003c/th>\u003cth>错误、副作用与幂等\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ccode>resolve_principal\u003c/code>\u003c/td>\u003ctd>已验证登录凭证或受信服务调用、维护配置版本\u003c/td>\u003ctd>区分用户/服务主体的可信 \u003ccode>AccessContext\u003c/code>\u003c/td>\u003ctd>\u003ccode>unauthenticated\u003c/code> / \u003ccode>identity_unavailable\u003c/code>；服务范围受配置限制；处理用户请求的后台作业仍引用原用户授权，作业执行身份另存；模拟身份只在开发模式启用\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>authorize_action\u003c/code>\u003c/td>\u003ctd>可信上下文、动作、对象描述/归属、目标\u003c/td>\u003ctd>限定动作与版本的授权决定\u003c/td>\u003ctd>对外 \u003ccode>not_available\u003c/code> / \u003ccode>policy_unavailable\u003c/code>，内部细分拒绝与缺失；只读；缓存不能越过有效期或撤权代次\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>derive_search_scope\u003c/code>\u003c/td>\u003ctd>空间、资源类型、任务范围\u003c/td>\u003ctd>可下推的过滤条件、权限版本\u003c/td>\u003ctd>服务未知则明确失败；过滤条件只是候选范围，不替代逐项回源检查\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>filter_for_delivery\u003c/code>\u003c/td>\u003ctd>当前资料描述与引用、接收方 \u003ccode>user/model\u003c/code>、端点策略\u003c/td>\u003ctd>允许字段/片段及可见来源\u003c/td>\u003ctd>不输出被拒条目；端点限制不能退化为用户可读即允许外发；只读\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>check_context_refs\u003c/code>\u003c/td>\u003ctd>恢复/输出将用到的引用与权限版本\u003c/td>\u003ctd>\u003ccode>valid\u003c/code> 或内部失效引用集合\u003c/td>\u003ctd>查证失败不得继续发送相关内容；无状态修改，组合层决定重建或暂停\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>record_policy_change_in_tx\u003c/code>\u003c/td>\u003ctd>经宿主验证的策略变更、起点版本\u003c/td>\u003ctd>新策略版本、上下文失效意图\u003c/td>\u003ctd>版本冲突或权限不足拒绝；原子更新本模块策略；相同操作幂等\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>M01 的授权决定只在受信 Rust 内部流转；携带主体、动作、范围、资源/策略版本和有效期。组合层在事务内核对本地版本，在事务外按平台能力查证；平台不能提供稳定快照时保守重查，不能承诺跨系统原子撤权。\u003c/p>\n\u003ch3>2.1 两类权限分别校验\u003c/h3>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>动作\u003c/th>\u003cth>权限依据\u003c/th>\u003cth>限制\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>编辑正式语义、接受/驳回已提交建议\u003c/td>\u003ctd>本系统的表负责人关系，或超级维护者角色\u003c/td>\u003ctd>逐对象在事务内核验；录入人/最后修改人不自动取得维护权\u003c/td>\u003c/tr>\u003ctr>\u003ctd>读取平台资料、查询数据、执行 SQL、读取结果\u003c/td>\u003ctd>Datasight 当前用户及动作授权\u003c/td>\u003ctd>系统语义角色不能放大权限；SQL 仍绑定用户确认版本\u003c/td>\u003c/tr>\u003ctr>\u003ctd>读取聊天、个人记忆或 Skill\u003c/td>\u003ctd>本人、空间与资产状态\u003c/td>\u003ctd>超级维护者角色不提供他人私有内容访问权\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>表和字段按所属表授权。跨表共用指标/文档的维护归属须明确，引用关系不传播编辑权。维护时如需查询数据，分别通过两类动作的检查。表/字段负责人通过平台目录同步；共用对象由超级维护者独立指定；超级角色按空间在启动配置中提供，不增加权限服务。\u003c/p>\n\u003cp>\u003ccode>authorize_maintainer\u003c/code> 现在校验可信配置的空间超级维护者，用于创建、同步和全局索引维护；\u003ccode>authorize_semantic_in_tx\u003c/code> 对对象负责人或超级维护者授权。M01 只读取自己的授权表，平台表身份按 namespace + id 匹配，引用关系不传播权限。未配置负责人只允许超级维护者维护。\u003c/p>","svg":"\u003csvg aria-roledescription=\"flowchart-v2\" role=\"graphics-document document\" viewBox=\"-8 -8 1152.9375 1954\" height=\"1954\" xmlns=\"http://www.w3.org/2000/svg\" width=\"1152.9375\" id=\"diagramF01\">\u003cstyle>#diagramF01{font-family:PingFang SC,Microsoft YaHei,Arial,sans-serif;font-size:17px;fill:#172c40;}#diagramF01 .error-icon{fill:#ffffff;}#diagramF01 .error-text{fill:#000000;stroke:#000000;}#diagramF01 .edge-thickness-normal{stroke-width:2px;}#diagramF01 .edge-thickness-thick{stroke-width:3.5px;}#diagramF01 .edge-pattern-solid{stroke-dasharray:0;}#diagramF01 .edge-pattern-dashed{stroke-dasharray:3;}#diagramF01 .edge-pattern-dotted{stroke-dasharray:2;}#diagramF01 .marker{fill:#617387;stroke:#617387;}#diagramF01 .marker.cross{stroke:#617387;}#diagramF01 svg{font-family:PingFang SC,Microsoft YaHei,Arial,sans-serif;font-size:17px;}#diagramF01 .label{font-family:PingFang SC,Microsoft YaHei,Arial,sans-serif;color:#172c40;}#diagramF01 .cluster-label text{fill:#000000;}#diagramF01 .cluster-label span,#diagramF01 p{color:#000000;}#diagramF01 .label text,#diagramF01 span,#diagramF01 p{fill:#172c40;color:#172c40;}#diagramF01 .node rect,#diagramF01 .node circle,#diagramF01 .node ellipse,#diagramF01 .node polygon,#diagramF01 .node path{fill:#eef4fb;stroke:#607c99;stroke-width:1px;}#diagramF01 .flowchart-label text{text-anchor:middle;}#diagramF01 .node .katex path{fill:#000;stroke:#000;stroke-width:1px;}#diagramF01 .node .label{text-align:center;}#diagramF01 .node.clickable{cursor:pointer;}#diagramF01 .arrowheadPath{fill:#0b0b0b;}#diagramF01 .edgePath .path{stroke:#617387;stroke-width:2.0px;}#diagramF01 .flowchart-link{stroke:#617387;fill:none art-label\">\u003crect height=\"46\" width=\"192\" y=\"-23\" x=\"-96\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\">\u003c/rect>\u003cg transform=\"translate(0, -12)\" style=\"\" class=\"label\">\u003crect>\u003c/rect>\u003ctext style=\"\">\u003ctspan class=\"row\" x=\"0\" dy=\"1em\" xml:space=\"preserve\">组合层仅交付允许内容\u003c/tspan>\u003c/text>\u003c/g>\u003c/g>\u003c/g>\u003c/g>\u003c/g>\u003c/svg>"},{"id":"F02","module":"M02","name":"M02 knowledge：正式语义、文档与依据","heading":"F02 知识版本与人工覆盖","filename":"knowledge-modules.md","source":"flowchart TD\n    A[创建 编辑 预填或模型修改建议] --> P{是否仅提出建议}\n    P -->|是| Q[保存本人建议 不改正式版本]\n    Q --> Submit[提交可共享建议给负责人]\n    Submit --> Decision{负责人或超级维护者处理}\n    Decision -->|驳回| Rejected[记录理由 正式语义不变]\n    Decision -->|接受| Accepted[已接受待修改 正式语义不变]\n    Accepted --> R[核对 编辑并明确保存最终内容]\n    P -->|否| S[校验本系统维护范围或限定配置]\n    R --> S\n    S --> O[事务内锁定原操作并核对参数指纹]\n    O --> J{是否已有成功回执}\n    J -->|是| T[接回原回执 不新建版本或待办]\n    J -->|否| N{是否首次创建}\n    N -->|是| K[核对稳定创建键不存在及来源证明]\n    N -->|否| B[核对起点版本和来源版本]\n    K --> E\n    B --> C{版本可合并}\n    C -->|否| D[返回冲突或来源过期]\n    C -->|是| E[按条目合并事实 建议 人工覆盖]\n    E --> F[校验结构 章节 引用与验证状态]\n    F --> G[事务内保存不可变版本及当前指针]\n    G --> H[返回索引与依赖复核意图]\n    H --> I[组合层登记待办并提交事务]","context":"\u003cp>\u003cstrong>职责：\u003c/strong>维护表、字段/取值、指标、查询关联、业务术语/规则、经验证案例、文档/章节和主题；管理立即生效的版本、条目来源、人工覆盖、待复核项与依赖。生产血缘事实和可用查询关联保留不同类型，不能由前者自动推出可 JOIN。\u003c/p>\n\u003cp>\u003cstrong>私有数据：\u003c/strong>\u003ccode>knowledge_objects\u003c/code>、不可变 \u003ccode>knowledge_versions\u003c/code>、\u003ccode>knowledge_references\u003c/code>、条目编辑/验证记录、文档章节与关联，以及独立的 \u003ccode>semantic_change_proposals\u003c/code>。原始平台快照归 M03；本模块按稳定来源 ID、版本和 SQL/章节位置引用。建议记录不参与正式正文或检索索引。物理表随增量落地，不按对象类型复制业务服务。\u003c/p>\n\u003ch3>3.1 条目级语义\u003c/h3>\n\u003cp>每个可编辑字段、规则、指标子项、文档条目有稳定 \u003ccode>entry_id/path\u003c/code>，独立保存以下内容；不能只给整张表打“人工修改”标记。\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>内容\u003c/th>\u003cth>保存与更新规则\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ccode>source_facts\u003c/code>\u003c/td>\u003ctd>来源事实值、来源版本/原文位置、解析器版本、获取完整性；未解析 SQL 留缺口，不捏造事实\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>model_suggestion\u003c/code>\u003c/td>\u003ctd>建议值、模型/输入版本、来源、生成时间与不确定项；不得标记为人工确认\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>human_override\u003c/code>\u003c/td>\u003ctd>人工值、操作者、时间、起点版本与修改路径；重新预填必须保留，清除覆盖需显式编辑操作\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>effective_value\u003c/code>\u003c/td>\u003ctd>有人工覆盖时采用人工值，否则按条目类型采用可用事实/建议；同时返回出处和冲突，事实与业务定义冲突不自动裁决\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>review_state\u003c/code> / \u003ccode>validation\u003c/code>\u003c/td>\u003ctd>待复核原因、受影响依赖、验证方式/范围/版本与结果；启用、人工修改、业务验证分别记录\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>文档完整正文有版本，章节有稳定标识。关联可指向表、字段、指标或主题及特定章节；文档改名不换 ID，章节删改产生明确的断开/替代引用。仅有链接保存 \u003ccode>body_unavailable\u003c/code>，不会假装正文已获取。文档权限与所关联对象分别检查，引用不授予权限。\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>公开操作\u003c/th>\u003cth>输入\u003c/th>\u003cth>输出\u003c/th>\u003cth>错误、副作用与幂等\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ccode>create_object_in_tx\u003c/code>\u003c/td>\u003ctd>对象类型、稳定创建/来源键、首版正文/事实、来源引用及当前来源证明；不传 \u003ccode>base_version\u003c/code>\u003c/td>\u003ctd>新对象 ID、版本 1、依赖与索引意图\u003c/td>\u003ctd>校验维护权限或限定维护配置；创建键唯一；同操作重传返回原记录，其他同键创建返回 \u003ccode>already_exists\u003c/code>，不隐式覆盖\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>read_objects\u003c/code>\u003c/td>\u003ctd>空间、对象/版本引用、所需字段\u003c/td>\u003ctd>内部版本正文、状态、依赖与资料描述\u003c/td>\u003ctd>批量只读；不附未经授权的外部可见错误详情；组合层随后做 M01 校验\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>find_exact\u003c/code>\u003c/td>\u003ctd>空间、类型、名称/别名、有限查询范围\u003c/td>\u003ctd>当前对象候选 ID/版本\u003c/td>\u003ctd>只读；为精确定位和索引滞后补查提供正式数据\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>read_evidence\u003c/code>\u003c/td>\u003ctd>对象版本、条目/章节、邻接范围\u003c/td>\u003ctd>依据引用、必要相邻段落、缺口\u003c/td>\u003ctd>引用断开显式保留；来源正文由组合层另向 M03 读取和授权\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>find_dependents\u003c/code>\u003c/td>\u003ctd>来源/对象版本、变化路径\u003c/td>\u003ctd>受影响条目及引用集合\u003c/td>\u003ctd>只读、可分页；不直接修改其他模块的依赖状态\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>mark_dependencies_changed_in_tx\u003c/code>\u003c/td>\u003ctd>可靠变化及当前受影响条目、起点版本\u003c/td>\u003ctd>新版本中的待复核项、索引/上下文失效意图\u003c/td>\u003ctd>来源快照提交时同步标记，模型未完成前旧依据不继续显示为已核实；保留人工值\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>save_edit_in_tx\u003c/code>\u003c/td>\u003ctd>已授权编辑、起点版本、条目补丁/清除覆盖\u003c/td>\u003ctd>新知识版本、差异、索引及依赖复核意图\u003c/td>\u003ctd>\u003ccode>version_conflict\u003c/code> / \u003ccode>invalid_definition\u003c/code>；清除后无来源/建议时有效正文为空字符串，历史版本保留；提交前校验完整对象，失败不落库；不自动变成业务验证通过\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>save_document_in_tx\u003c/code>\u003c/td>\u003ctd>正文/链接、章节、关联、起点版本\u003c/td>\u003ctd>新文档版本、有效/断开引用及待办\u003c/td>\u003ctd>关联结构不合法则拒绝；改版保留人工文字、标记受影响规则需复核\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>apply_prefill_in_tx\u003c/code>\u003c/td>\u003ctd>结构化预填、来源/输入版本、组合层取得的当前来源证明、条目起点版本\u003c/td>\u003ctd>合并后新版本、保留人工项、冲突/缺口\u003c/td>\u003ctd>来源已变返回 \u003ccode>stale_source\u003c/code>；并发人工改动先重新合并，绝不盲写旧建议\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>record_validation_in_tx\u003c/code>\u003c/td>\u003ctd>条目及依赖版本、检查范围、证据、结论\u003c/td>\u003ctd>新版本或对应验证记录、待办\u003c/td>\u003ctd>\u003ccode>version_conflict\u003c/code> / \u003ccode>invalid_evidence\u003c/code>；SQL 可执行不等于口径验证通过\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>change_status_in_tx\u003c/code>\u003c/td>\u003ctd>对象、起点版本、停用/恢复/删除原因\u003c/td>\u003ctd>当前状态、新版本、索引/上下文失效意图\u003c/td>\u003ctd>有权维护者操作；关联不级联删除其他对象；重复操作返回原回执\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>save_change_proposal_in_tx\u003c/code>\u003c/td>\u003ctd>可信用户、可读目标/基版本、补丁/来源/原任务/私有标记；修改另带建议 ID 与预期修订\u003c/td>\u003ctd>本人建议 ID、\u003ccode>open\u003c/code> 状态及保存回执\u003c/td>\u003ctd>\u003ccode>propose_semantic_change\u003c/code> 仅调用此操作；只创建或修订本人的开放建议，不写正式版本；不要求维护权，不接受不可读目标\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>read_change_proposals\u003c/code>\u003c/td>\u003ctd>用户主体、本人建议 ID或目标/游标\u003c/td>\u003ctd>本人可读的建议、基版本、状态与差异\u003c/td>\u003ctd>当前只读本人建议；第 3.3 节另增受控提交后的负责人读取，不能直接移除 owner 过滤\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>apply_change_proposal_in_tx\u003c/code>\u003c/td>\u003ctd>维护者本人明确保存、本人建议 ID、预期建议修订、当前知识基版本、最终补丁/公共来源\u003c/td>\u003ctd>已生效知识版本、\u003ccode>applied\u003c/code> 建议回执、索引/依赖意图\u003c/td>\u003ctd>重用 \u003ccode>save_edit_in_tx\u003c/code> 规则；知识版本和建议状态同事务；过期基版返回冲突，未授权模型请求不能进入本操作\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>dismiss_change_proposal_in_tx\u003c/code>\u003c/td>\u003ctd>本人建议 ID、预期修订、放弃原因\u003c/td>\u003ctd>\u003ccode>dismissed\u003c/code> 回执\u003c/td>\u003ctd>只关闭建议；不更改正式知识，重复命令幂等\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>删除对象后保留必要的引用断开状态，相关规则/案例/Skill 通过组合层标记需复核。精确历史保留/物理清理范围在实际部署策略中确定；不得向用户承诺未经实现的彻底清除。\u003c/p>\n\u003ch3>3.2 首次创建与同步新条目\u003c/h3>\n\u003cp>维护页面读取表的字段、指标、文档和关系时，通过现有 \u003ccode>GET /knowledge?related_id=&lt;id&gt;&amp;after_id=&lt;cursor&gt;\u003c/code> 单独分页，每页最多100项。先检查目标可读，再按空间、当前非删除记录和直接关联查询；与 \u003ccode>q\u003c/code> 检索参数互斥。目录首页或前30条搜索结果不能作为关联内容的全集，界面独立提供“加载更多关联内容”。该读取复用M02存储边界，不进入Agent检索路径。\u003c/p>\n\u003cp>• 稳定来源键为 \u003ccode>(space_id, source_namespace, platform_object_id, object_kind, stable_subobject_id?)\u003c/code>；字段等子对象由 M03 保存稳定映射，不能仅按显示名称匹配。人工条目使用 \u003ccode>source_namespace=manual\u003c/code> 与宿主分配/客户端重传保持不变的创建 ID。创建键和对象 ID 分离，改名不换对象，删除后同键也不自动复活。\u003c/p>\n\u003cp>• \u003ccode>create_object_in_tx\u003c/code> 以唯一键和“不存在”条件创建版本 1，无虚构 \u003ccode>base_version=0\u003c/code>。首次创建同时保存来源/父对象/已知依赖引用；结构仍有缺口时明确保存未知与待补项。文档首版复用相同创建入口及正文/章节校验，后续编辑才使用版本校验。\u003c/p>\n\u003cp>• 新来源同步在保存可靠快照的同一小批事务中，通过 M02 创建最小正式对象、版本 1 和来源依赖，再由 M10 登记预填/索引任务。不能只对既有依赖调用 \u003ccode>find_dependents\u003c/code>，否则新表/字段永远没有知识入口。创建返回 \u003ccode>already_exists\u003c/code> 时回读对应对象/当前版本，按既有对象走变化标记与版本化预填，不把整个批次判为失败或当作创建覆盖；已有对象若已删除/停用则保留该状态，不自动恢复。\u003c/p>\n\u003ch3>3.3 语义修改建议到维护保存\u003c/h3>\n\u003cp>\u003cstrong>当前实现：\u003c/strong>\u003ccode>propose_semantic_change\u003c/code> 保存本人私人建议，记录对象、条目、基版本、建议值、理由和公共依据。\u003ccode>semantic_change_proposals\u003c/code> 列表和兼容采用仍按 \u003ccode>owner_id + space_id\u003c/code> 限定本人。新 \u003ccode>semantic_corrections\u003c/code> 只接收用户明确确认的共享提交；不复制聊天或个人资产。预填 \u003ccode>model_suggestion\u003c/code>、私人提案和正式版本分别保存。\u003c/p>\n\u003cp>\u003cstrong>协作流程：\u003c/strong>A 提出纠错，B 是目标表的语义负责人。B 或超级维护者可驳回，或接受后核对、编辑并保存。接受不直接套用模型补丁；不需要 A 先获得维护权。新流程替代旧版“仅提出者本人维护采用”的产品限制；已有私人记录继续保留原范围。\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>阶段\u003c/th>\u003cth>谁可以操作\u003c/th>\u003cth>正式语义与共享召回\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>本人草稿\u003c/td>\u003ctd>A 与其受控 Agent 整理内容\u003c/td>\u003ctd>不变；不进入负责人列表或共享召回\u003c/td>\u003c/tr>\u003ctr>\u003ctd>提交为待处理建议\u003c/td>\u003ctd>A 提交明确可共享的修改与依据\u003c/td>\u003ctd>不变；A、目标负责人及超级维护者可按当前权限读取提交内容\u003c/td>\u003c/tr>\u003ctr>\u003ctd>驳回\u003c/td>\u003ctd>B 或超级维护者说明原因\u003c/td>\u003ctd>不变；保留处理人、理由和记录，A 可查看\u003c/td>\u003c/tr>\u003ctr>\u003ctd>接受待修改\u003c/td>\u003ctd>B 或超级维护者接受建议\u003c/td>\u003ctd>不变；尚无新的正式版本\u003c/td>\u003c/tr>\u003ctr>\u003ctd>编辑并保存生效\u003c/td>\u003ctd>B 或超级维护者核对并保存最终内容\u003c/td>\u003ctd>新正式版本生效，登记索引及依赖复核待办\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>读取建议仍检查当前对象/资料权限；建议访问权不打开 A 的私人原文或结果。普通第三人不因同空间而取得建议内容。已提交建议保留独立内容与修订记录，后续修改不能悄悄替换已审核内容；存量 \u003ccode>open\u003c/code> 记录不能批量当作已提交建议公开。\u003c/p>\n\u003cp>正式保存复用 \u003ccode>save_edit_in_tx\u003c/code>，重新校验本系统维护范围、建议修订、知识基版本、依赖及共享依据。基版本已变则保留原建议和差异，要求重新核对最终补丁；权限收回则拒绝保存。用同一事务保存正式新版本、建议实际采用内容/生效版本、操作回执和待办；重复命令接回原回执，失败不标“已生效”。已有私人来源不自动进入公共正文或出处。\u003c/p>\n\u003cp>仅处理本次 SQL 时无需等待建议审核；生成新版 SQL、用户确认及 Datasight 查询校验沿用既有路径。Mem0 继续处理本人记忆，建议处理结果不静默更改个人资产。共享检索只采用正式版本；待处理、已接受和已驳回建议均不作为正式知识召回。\u003c/p>\n\u003ch3>3.4 数据与接口边界\u003c/h3>\n\u003cp>本节列出本轮实施边界。跨语言请求及错误在 \u003ccode>packages/contracts\u003c/code> 定义，本文不维护另一套可执行 Schema。\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>归属\u003c/th>\u003cth>实施内容\u003c/th>\u003cth>保持的边界\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>M01\u003c/td>\u003ctd>本系统表负责人关系、超级维护者角色及授权版本；按对象/动作校验\u003c/td>\u003ctd>与 Datasight 权限独立，不保存一份数仓授权替代品\u003c/td>\u003c/tr>\u003ctr>\u003ctd>M02\u003c/td>\u003ctd>建议的提交内容、原值/建议值/依据、提交状态与修订；接受/驳回记录、处理人/原因；最终补丁及生效版本\u003c/td>\u003ctd>提出者、负责人和实际编辑人分别记录；私人原任务引用不作为共享阅读入口\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Rust 具名用例\u003c/td>\u003ctd>提交建议、列出本人/负责范围建议、接受或驳回、关联建议保存正式编辑\u003c/td>\u003ctd>身份由宿主绑定，服务器检查当前对象归属；受控 Agent 工具不发布正式语义\u003c/td>\u003c/tr>\u003ctr>\u003ctd>M12\u003c/td>\u003ctd>在现有语义页展示负责人、建议与状态；预览共享内容；接受、驳回理由、编辑保存及冲突差异\u003c/td>\u003ctd>不另建审批应用，界面状态以服务端为准\u003c/td>\u003c/tr>\u003ctr>\u003ctd>M10 / M04\u003c/td>\u003ctd>正式保存后的既有索引与依赖复核待办\u003c/td>\u003ctd>仅接受建议不触发正式知识索引；索引失败显示滞后\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>M01 的 \u003ccode>semantic_ownership\u003c/code> 保存对象→授权对象→负责人的关系及版本。表负责人来自 Datasight mock，字段指向所属表；共用对象指向自身，只有超级维护者可单独指派。M02 的 \u003ccode>semantic_corrections\u003c/code> 与 \u003ccode>semantic_correction_operations\u003c/code> 保存共享内容、处理状态和幂等回执；历史私人表不迁移成公开记录。\u003ccode>created_by\u003c/code> 从首版记录保留，\u003ccode>updated_by\u003c/code> 只表示最后编辑者。平台维护人变更以最近一次成功同步为准，正式平台 ACL 尚未接入。\u003c/p>\n\u003cp>先锁授权快照，再锁来源/知识与建议；目标和依据知识按 ID 排序。接受不写知识，正式保存复用 M02 \u003ccode>save_edit_in_tx\u003c/code> 和 \u003ccode>knowledge_index_jobs\u003c/code>，复用既有 Worker 检索索引链路，不新增审批进程。\u003c/p>\n\u003cp>合成来源的空授权登记单独幂等提交，不授予维护权；随后以新事务同步来源、正式知识和索引待办，避免提前固定旧快照。权威目录移除先按序撤维护权，取得来源锁后重核当前缺失集合和来源基线，再停用对象；任一步失败均回滚该事务。\u003c/p>","svg":"\u003csvg aria-roledescription=\"flowchart-v2\" role=\"graphics-document document\" viewBox=\"-8 -8 736.0859375 2723\" height=\"2723\" xmlns=\"http://www.w3.org/2000/svg\" width=\"736.0859375\" id=\"diagramF02\">\u003cstyle>#diagramF02{font-family:PingFang SC,Microsoft YaHei,Arial,sans-serif;font-size:17px;fill:#172c40;}#diagramF02 .error-icon{fill:#ffffff;}#diagramF02 .error-text{fill:#000000;stroke:#000000;}#diagramF02 .edge-thickness-normal{stroke-width  flowchart-label\">\u003crect height=\"46\" width=\"209\" y=\"-23\" x=\"-104.5\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\">\u003c/rect>\u003cg transform=\"translate(0, -12)\" style=\"\" class=\"label\">\u003crect>\u003c/rect>\u003ctext style=\"\">\u003ctspan class=\"row\" x=\"0\" dy=\"1em\" xml:space=\"preserve\">返回索引与依赖复核意图\u003c/tspan>\u003c/text>\u003c/g>\u003c/g>\u003cg transform=\"translate(364.25390625, 2684)\" data-id=\"I\" data-node=\"true\" id=\"flowchart-I-173\" class=\"node default default flowchart-label\">\u003crect height=\"46\" width=\"226\" y=\"-23\" x=\"-113\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\">\u003c/rect>\u003cg transform=\"translate(0, -12)\" style=\"\" class=\"label\">\u003crect>\u003c/rect>\u003ctext style=\"\">\u003ctspan class=\"row\" x=\"0\" dy=\"1em\" xml:space=\"preserve\">组合层登记待办并提交事务\u003c/tspan>\u003c/text>\u003c/g>\u003c/g>\u003c/g>\u003c/g>\u003c/g>\u003c/svg>"},{"id":"F03","module":"M03","name":"M03 ingestion：来源同步与增量预填","heading":"F03 来源同步与增量预填","filename":"knowledge-modules.md","source":"flowchart TD\n    R[短事务固定采集前来源头基线] --> A[事务外读取平台批次]\n    A --> B[比较来源指纹与批次完整性]\n    B --> C{取得可靠来源变化}\n    B --> D{批次是否部分失败}\n    D -->|是| X[保留未取得对象并记录同步缺口]\n    D -->|否| Y[记录本批采集完整性]\n    C -->|无变化| Z[结束本批次的变更处理]\n    C -->|有变化| V{来源头CAS与平台版本通过}\n    V -->|否| W[仅保留历史快照或冲突\u003cbr/>重新采集后再处理]\n    V -->|是| T[首个事务按小批提交\u003cbr/>M03头快照 M02首版或待复核 M10待办]\n    T --> E[仅解析已确认变化的事实与路径]\n    E --> First{首次导入的普通对象}\n    First -->|是| Basic[基础事实进入目录和索引\u003cbr/>其余解释按需补齐]\n    First -->|否| F[组合层取依赖并准备有限预填输入\u003cbr/>常用优先 来源改版自动分析]\n    Preference[维护者设置常用范围] --> Priority[核对配置版本与幂等回执\u003cbr/>调整未领取任务优先级]\n    Priority -->|开启| F\n    F --> Material[同批目录终止后装配并冻结\u003cbr/>本表 上游及关联表字段文档 明确缺口]\n    Material --> G[事务外分析并结算预算]\n    G --> Review[核对固定来源与目标版本\u003cbr/>事务外复核并独立结算]\n    Review --> H[校验结构 引用和领取代次\u003cbr/>锁当前来源 目标与文档版本]\n    H --> I[另一个事务提交\u003cbr/>M03尝试 M02合并版本 M10索引待办]","context":"\u003cp>\u003cstrong>职责：\u003c/strong>完整导入可获取目录、DDL、血缘和加工 SQL，保留快照与同步范围；解析确定事实，构造预填输入并校验模型结果。全空间先基础预填并可检索，常用表优先深入分析，其余按需补齐；常用范围由维护者指定，不假设平台有热度接口。\u003c/p>\n\u003cp>\u003cstrong>私有数据：\u003c/strong>\u003ccode>source_snapshots\u003c/code>、\u003ccode>source_heads\u003c/code>、同步批次/游标及采集前基线、平台对象稳定映射、来源变化、解析结果、预填尝试与输入指纹。原文不可被模型建议覆盖；没有完整同步或可靠删除事件不能把本次缺席对象判定已删除。\u003c/p>\n\u003cp>常用范围由M03的\u003ccode>table_analysis_preferences\u003c/code>维护：空间及稳定知识表ID、独立配置版本、是否常用及操作者；\u003ccode>analysis_preference_operations\u003c/code>保存命令指纹和原回执。配置不改变知识正文版本。\u003ccode>set_table_analysis_preference\u003c/code>组合用例先核对维护权限、表对象可读及配置版本，再原子保存配置、调整该表/字段尚未领取的队列优先级，并为启用范围的当前版本幂等排队。已领取的调用继续沿用原身份与预算，关闭常用不删除知识或撤回已发送调用。\u003c/p>\n\u003cp>首次导入所有表/字段立即生成基础事实并进入目录与索引，只有常用范围自动排深入分析；普通表通过\u003ccode>request_prefill\u003c/code>按需分析。来源改版仍为所有受影响对象自动排重分析（D05），不能受常用开关阻断。领取按常用优先、再按创建时间排序。知识管理读取返回当前\u003ccode>analysis_preference\u003c/code>及现有\u003ccode>prefill_status\u003c/code>；历史知识版本不混入当前维护配置。没有配置记录时返回默认非优先、配置版本1，首次修改在事务内以唯一键建立默认行并校验该起点。\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>公开操作\u003c/th>\u003cth>输入\u003c/th>\u003cth>输出\u003c/th>\u003cth>错误、副作用与幂等\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ccode>begin_source_read_in_tx\u003c/code>\u003c/td>\u003ctd>已授权的本批来源范围、稳定批次 ID\u003c/td>\u003ctd>已持久化 \u003ccode>read_token\u003c/code>，含范围内采集前的来源头修订/不存在基线\u003c/td>\u003ctd>网络读取前短事务完成；同批次重传返回原基线；新采集须新批次，不把旧载荷改绑新基线\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>fetch_source_batch\u003c/code>\u003c/td>\u003ctd>已授权空间/来源、游标、能力与大小限制\u003c/td>\u003ctd>来源片段、版本、完整性、下一游标\u003c/td>\u003ctd>事务外平台读取；\u003ccode>source_unavailable\u003c/code> / \u003ccode>unsupported_capability\u003c/code>；不以空批次伪装成功\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>save_snapshot_in_tx\u003c/code>\u003c/td>\u003ctd>\u003ccode>read_token\u003c/code>、来源稳定键、采集版本/指纹、结果、当前作业代次\u003c/td>\u003ctd>快照引用、\u003ccode>head_advanced / unchanged / historical_only\u003c/code>、变化路径/待办\u003c/td>\u003ctd>锁来源头并比较采集前 \u003ccode>expected_head_revision\u003c/code>；CAS 冲突返回 \u003ccode>source_head_conflict\u003c/code> 和 \u003ccode>historical_only\u003c/code>，不触发当前知识更新；同载荷重传幂等\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>read_source_snapshot\u003c/code>\u003c/td>\u003ctd>来源版本、位置/大小限制\u003c/td>\u003ctd>原文片段、原始元数据与完整性\u003c/td>\u003ctd>只读；仅返回内部内容，组合层做读者与端点范围检查\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>check_source_heads_in_tx\u003c/code>\u003c/td>\u003ctd>预填引用的来源版本\u003c/td>\u003ctd>本事务当前来源版本证明\u003c/td>\u003ctd>\u003ccode>stale_source\u003c/code>；只读并锁定相应来源头，防止校验后被并发同步更新\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>parse_facts\u003c/code>\u003c/td>\u003ctd>固定快照、方言/解析版本、限额\u003c/td>\u003ctd>可定位事实、未解析片段及缺口\u003c/td>\u003ctd>无持久副作用；不执行加工 SQL；循环/深度上限给具体缺口\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>prepare_prefill\u003c/code>\u003c/td>\u003ctd>变化路径、M02 依赖查询结果、已授权必要资料、固定维护预算范围\u003c/td>\u003ctd>固定输入版本与预算范围的预填请求、受影响条目\u003c/td>\u003ctd>缺正文/上游保留缺口；不直接调用其他业务模块，不决定公共口径\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>read_analysis_preference_in_tx\u003c/code>\u003c/td>\u003ctd>可读表或字段对象、空间\u003c/td>\u003ctd>当前常用范围及配置版本；字段继承所属表\u003c/td>\u003ctd>只读，不改变知识正文；其他对象不附表级设置\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>save_analysis_preference_in_tx\u003c/code>\u003c/td>\u003ctd>稳定表ID、是否常用、配置起点版本、命令ID\u003c/td>\u003ctd>配置回执及是否发生变化\u003c/td>\u003ctd>维护权限由组合层核对；同命令同参数返回原回执，改参数冲突；调整未领取任务优先级，启用后由组合层登记表及字段分析\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>run_prefill\u003c/code>\u003c/td>\u003ctd>预填请求、组合层取得的 M08 单次调用许可\u003c/td>\u003ctd>\u003ccode>PrefillModelPort\u003c/code> 返回的结构化建议或未知/失败\u003c/td>\u003ctd>事务外固定分析、依据复核各一次；两次分别取原维护范围许可并结算；复核失败不应用分析草稿；\u003ccode>budget_unavailable\u003c/code> 时保留事实等待补充；实际重试须新许可并扣原范围\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>validate_prefill_result\u003c/code>\u003c/td>\u003ctd>模型结构化建议、原输入与来源版本\u003c/td>\u003ctd>合法条目建议、依据与冲突\u003c/td>\u003ctd>\u003ccode>invalid_prefill\u003c/code> / \u003ccode>stale_source\u003c/code>；逐个覆盖本次语义目标，拒绝空结果、遗漏/重复/多余条目及DDL/ETL/type；解释可留空但须有明确缺口和引用，不沿用旧建议冒充成功；拒绝不存在的来源/路径，不把推测升格为事实\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>record_prefill_in_tx\u003c/code>\u003c/td>\u003ctd>输入指纹、结果/失败、当前领取代次\u003c/td>\u003ctd>尝试记录及提交知识的意图\u003c/td>\u003ctd>旧代次拒绝；稳定操作幂等，M02 正式版本由组合层另行提交\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>来源头保存本地 \u003ccode>head_revision\u003c/code>、当前快照引用及可用的平台单调版本。采集前基线以本批范围的数据库快照为准，新键使用当时确认不存在的基线；读取后才发现的新键不能先读取最新头再把旧采集结果当成新结果写入。回写只在起点仍匹配时推进来源头并递增修订；平台提供可靠单调版本时还须拒绝倒退版本，不能用采集结束时间或字符串大小猜顺序。\u003c/p>\n\u003cp>两个独立同步作业即使租约都有效，也必须通过上述来源头 CAS。失败可保留旧快照作历史，当前来源头、知识变化和待办均不改变；需要继续时重新捕获基线并重新读取平台，禁止仅替换 \u003ccode>expected_head_revision\u003c/code> 重交同一旧载荷。相同内容无需换头；部分失败、未完成分页不推进完整同步标记，也不推断删除。CAS 保证本地采集竞争不回退，不承诺平台自身返回了全局一致快照。\u003c/p>\n\u003cp>\u003cstrong>当前实施：\u003c/strong>M03 通过所属 \u003ccode>PrefillModelPort\u003c/code> 适配器做固定两次结构化维护调用（分析及依据复核），不创建聊天会话或第二个 Agent 循环。原生提交工具携带同源 \u003ccode>PrefillResult\u003c/code> 参数Schema；只接收一次完整同名工具参数作为建议，截断、坏身份和坏结构均拒绝，不执行模型声明的业务副作用。DeepSeek思考模式使用auto工具选择，off可指定提交工具，原profile与持久预算保持一致。所有实际模型调用（含预填、Embedding）取得 M08 许可；预算范围区分 \u003ccode>user_request\u003c/code> 与 \u003ccode>maintenance\u003c/code>。自动来源变化只引用维护配置已限定的范围，不自建额度；未配置时保留同步事实并等待模型补充。当前使用明确配置及持久账本，真实模型结果与本地回环分别验收。\u003c/p>\n\u003cp>当前组合操作：\u003ccode>prefill_materials::collect_in_tx\u003c/code> 组装有界材料；\u003ccode>knowledge_sources::read_in_tx/versions_in_tx/assert_in_tx\u003c/code>统一原始来源与M02文档版本检查；\u003ccode>knowledge::related_documents_in_tx\u003c/code>查直接关联和相关表的字段专属文档。它们不允许跨模块访问私有存储。资料限额、目录冻结时机及模型正文投影详见[实现设计](implementation-design.md#语义材料与实际上下文依赖)。\u003c/p>","svg":"\u003csvg aria-roledescription=\"flowchart-v2\" role=\"graphics-document document\" viewBox=\"-8 -8 1448.7421875 2173.296875\" height=\"2173.296875\" xmlns=\"http://www.w3.org/2000/svg\" width=\"1448.7421875\" id=\"diagramF03\">\u003cstyle>#diagramF03{font-family:PingFang SC,Microsoft YaHei,Arial,sans-serif;font-size:17px;fill:#172c40;}#diagramF03 .error-icon{fill:#ffffff;}#diagramF03 .error-text{fill:#000000;stroke:#000000;}#diagramF03 .edge =\"0\" rx=\"0\" style=\"\" class=\"basic label-container\">\u003c/rect>\u003cg transform=\"translate(0, -20.5)\" style=\"\" class=\"label\">\u003crect>\u003c/rect>\u003ctext style=\"\">\u003ctspan class=\"row\" x=\"0\" dy=\"1em\" xml:space=\"preserve\">同批目录终止后装配并冻结\u003c/tspan>\u003ctspan class=\"row\" x=\"0\" dy=\"1em\" xml:space=\"preserve\">本表 上游及关联表字段文档 明确缺口\u003c/tspan>\u003c/text>\u003c/g>\u003c/g>\u003cg transform=\"translate(1279.6796875, 1765.296875)\" data-id=\"G\" data-node=\"true\" id=\"flowchart-G-209\" class=\"node default default flowchart-label\">\u003crect height=\"46\" width=\"192\" y=\"-23\" x=\"-96\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\">\u003c/rect>\u003cg transform=\"translate(0, -12)\" style=\"\" class=\"label\">\u003crect>\u003c/rect>\u003ctext style=\"\">\u003ctspan class=\"row\" x=\"0\" dy=\"1em\" xml:space=\"preserve\">事务外分析并结算预算\u003c/tspan>\u003c/text>\u003c/g>\u003c/g>\u003cg transform=\"translate(1279.6796875, 1879.796875)\" data-id=\"Review\" data-node=\"true\" id=\"flowchart-Review-211\" class=\"node default default flowchart-label\">\u003crect height=\"63\" width=\"209\" y=\"-31.5\" x=\"-104.5\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\">\u003c/rect>\u003cg transform=\"translate(0, -20.5)\" style=\"\" class=\"label\">\u003crect>\u003c/rect>\u003ctext style=\"\">\u003ctspan class=\"row\" x=\"0\" dy=\"1em\" xml:space=\"preserve\">核对固定来源与目标版本\u003c/tspan>\u003ctspan class=\"row\" x=\"0\" dy=\"1em\" xml:space=\"preserve\">事务外复核并独立结算\u003c/tspan>\u003c/text>\u003c/g>\u003c/g>\u003cg transform=\"translate(1279.6796875, 2002.796875)\" data-id=\"H\" data-node=\"true\" id=\"flowchart-H-213\" class=\"node default default flowchart-label\">\u003crect height=\"63\" width=\"231.671875\" y=\"-31.5\" x=\"-115.8359375\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\">\u003c/rect>\u003cg transform=\"translate(0, -20.5)\" style=\"\" class=\"label\">\u003crect>\u003c/rect>\u003ctext style=\"\">\u003ctspan class=\"row\" x=\"0\" dy=\"1em\" xml:space=\"preserve\">校验结构 引用和领取代次\u003c/tspan>\u003ctspan class=\"row\" x=\"0\" dy=\"1em\" xml:space=\"preserve\">锁当前来源 目标与文档版本\u003c/tspan>\u003c/text>\u003c/g>\u003c/g>\u003cg transform=\"translate(1279.6796875, 2125.796875)\" data-id=\"I\" data-node=\"true\" id=\"flowchart-I-215\" class=\"node default default flowchart-label\">\u003crect height=\"63\" width=\"306.125\" y=\"-31.5\" x=\"-153.0625\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\">\u003c/rect>\u003cg transform=\"translate(0, -20.5)\" style=\"\" class=\"label\">\u003crect>\u003c/rect>\u003ctext style=\"\">\u003ctspan class=\"row\" x=\"0\" dy=\"1em\" xml:space=\"preserve\">另一个事务提交\u003c/tspan>\u003ctspan class=\"row\" x=\"0\" dy=\"1em\" xml:space=\"preserve\">M03尝试 M02合并版本 M10索引待办\u003c/tspan>\u003c/text>\u003c/g>\u003c/g>\u003c/g>\u003c/g>\u003c/g>\u003c/svg>"},{"id":"F04","module":"M04","name":"M04 retrieval：候选检索与派生索引","heading":"F04 候选检索与回源","filename":"knowledge-modules.md","source":"flowchart TD\n    A[检索范围 配额与可选问句向量] --> B[只读关键词与向量查找]\n    B --> C[合并组合层传入的精确及更新项]\n    C --> D[返回候选 ID 版本 与内部评分]\n    D --> E[组合层经 M02 或 M09 回源]\n    E --> F[经 M01 校验主体 端点 状态与版本]\n    F --> H{有效对象满足各类配额}\n    H -->|是| G[仅交付允许内容 依据与覆盖状态]\n    H -->|否| I{候选未耗尽且仍有补取额度}\n    I -->|是| J[保存内部续取位置\u003cbr/>复用问句向量补取]\n    J --> B\n    I -->|否| K[标明通道耗尽或本轮覆盖不完整]\n    K --> G","context":"\u003cp>\u003cstrong>职责：\u003c/strong>按类型结合精确、关键词和向量候选，维护可重建索引与更新状态。正式正文与授权判断仍属于 M02 / M09 / M01；相似度不等于适用性或执行许可。另一个重排模型、Embedding 选择与参数由样例试验决定。\u003c/p>\n\u003cp>\u003cstrong>私有数据：\u003c/strong>索引配置/版本、向量模型与文本处理版本、索引应用状态；Milvus/Zilliz 派生条目包含空间、个人归属、对象 ID、正文版本、章节位置和检索文本。业务明细、原始对话、个人标识和凭据不批量写入共享索引。\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>公开操作\u003c/th>\u003cth>输入\u003c/th>\u003cth>输出\u003c/th>\u003cth>错误、副作用与幂等\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ccode>search_candidates\u003c/code>\u003c/td>\u003ctd>问句、可选向量、类型/本批候选量、M01 范围、索引版本、内部 \u003ccode>continuation?\u003c/code>\u003c/td>\u003ctd>候选 ID/版本/评分、各通道续取位置、耗尽状态\u003c/td>\u003ctd>只读，不暗中向量化；续取绑定问句/范围/索引指纹；无法继续返回 \u003ccode>continuation_invalid\u003c/code>，服务失败区别于无命中\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>merge_candidates\u003c/code>\u003c/td>\u003ctd>向量/关键词候选、M02/M09 精确与更新项候选\u003c/td>\u003ctd>去重且保留各类型的候选\u003c/td>\u003ctd>无持久副作用；相同输入确定融合，不以统一分数代替口径判断\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>build_index_payload\u003c/code>\u003c/td>\u003ctd>组合层交付的有效正文、允许索引范围、版本\u003c/td>\u003ctd>检索文本与确定的片段键\u003c/td>\u003ctd>字段保留完整含义/计算/提醒，指标保留分母与限制；不擅自读取正式表\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>embed_payload\u003c/code>\u003c/td>\u003ctd>已获端点授权的问句/索引文本及指纹、模型版本、M08 单次调用许可\u003c/td>\u003ctd>对应文本/模型版本的向量或失败/未知\u003c/td>\u003ctd>事务外调用；预算不可用时不发送；重试仍扣原预算范围\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>apply_index\u003c/code>\u003c/td>\u003ctd>对象/正文/索引版本、片段键、upsert/delete\u003c/td>\u003ctd>外部写入回执或未知状态\u003c/td>\u003ctd>网络在事务外；版本化键幂等，未知先查证；删除限指定版本键，旧任务不覆盖/误删新版\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>record_index_state_in_tx\u003c/code>\u003c/td>\u003ctd>写入回执、目标版本、租约代次\u003c/td>\u003ctd>当前/失败/未知索引状态\u003c/td>\u003ctd>仅匹配目标版本与代次可推进；旧任务结果不回退当前索引状态\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>\u003ccode>retrieve_context\u003c/code> 先经 M01 核对问句/必要资料可发送到 Embedding 端点，再以原 \u003ccode>user_request\u003c/code> 范围取得 M08 许可，复用 \u003ccode>embed_payload\u003c/code> 生成问句向量后传入只读检索。维护索引向量化沿用 \u003ccode>maintenance\u003c/code> 范围。没有向量许可时可用关键词/精确匹配继续，返回中明确降级范围；不得伪装已完成语义检索。\u003c/p>\n\u003cp>旧索引命中先回源取当前版本，再核对相关性、依赖、权限与状态；组合层还经 M03 核对引用的来源头，来源已变而依赖标记尚未扫完时也不能继续作为已核实依据。更新尚未完成时，从正式存储补查精确标识、别名和最新关联纠错；覆盖不足明确标为降级。长文命中补齐章节标题、范围、必要邻段与被引用规则，每段独立核对资料范围。\u003c/p>\n\u003cp>当前正式知识索引待办归 M02 的私有存储。领取先无锁查有待办的对象，再按对象 ID 取得主键行锁，跳过其他事务正在修改的对象，最后按作业主键处理当前版本；旧作业每对象每轮最多清理 64 条，领取每批最多 64 个当前对象。语义保存和受控重建同样先锁对象、后写作业，避免索引扫描持有作业锁再等待正在保存的对象。候选快照只提供查找范围，版本、目标代次、租约与三次耗尽条件都在锁内重新核对；正文读取锁内确定的不可变版本。网络索引仍在提交领取事务之后执行。\u003c/p>\n\u003cp>\u003ccode>retrieve_context\u003c/code> 按\u003cstrong>回源、授权、去重后的有效对象数\u003c/strong>核对每类配额，多个历史版本/片段不能占满对象配额；单对象片段另受上下文大小限制。配额不足且候选未耗尽时，使用内部续取位置补查并重复校验，不能首批过滤后直接判定资料不足。向量服务没有游标时，适配器用有界扩大候选量和已见键去重实现续取，不谎称有稳定分页能力。\u003c/p>\n\u003cp>初始补取限制建议为最多 5 批、累计 200 个候选、检索与回源合计 2 秒，均为配置初值并待小样调整，任一先到即停止；复用同一问句向量，不每批新调模型。范围/索引发生变化时在剩余总限制内重新开始，所有已见工作仍计入上限。结果记录 \u003ccode>quota_met / candidates_exhausted / bounded\u003c/code>；\u003ccode>bounded\u003c/code> 明确本轮覆盖不完整，候选耗尽只描述所查通道，不证明整个知识库不存在答案。外部仅返回允许内容、可见结果游标和通用覆盖说明，内部续取位置、被过滤数量及受限对象存在性不外泄。\u003c/p>","svg":"\u003csvg aria-roledescription=\"flowchart-v2\" role=\"graphics-document document\" viewBox=\"-8 -8 553.5859375 1499\" height=\"1499\" xmlns=\"http://www.w3.org/2000/svg\" width=\"553.5859375\" id=\"diagramF04\">\u003cstyle>#diagramF04{font-family:PingFang SC,Microsoft YaHei,Arial,sans-serif;font-size:17px;fill:#172c40;}#diagramF04 .error-icon{fill:#ffffff;}#diagramF04 .error-text{fill:#000000;stroke:#000000;}#diagramF04 .edge-thickness-normal{stroke-width:2px;}#diagramF04 .edge-thickness-thick{stroke-width:3.5px;}#diagramF04 .edge-pattern-solid{stroke-dasharray:0;}#diagramF04 .edge-pattern-dashed{stroke-dasharray:3;}#diagramF04 .edge-pattern-dotted{stroke-dasharray:2;}#diagramF04 .marker{fill:#617387;stroke:#617387;}#diagramF04 .marker.cross{stroke:#617387;}#diagramF04 svg{font-family:PingFang SC,Microsoft YaHei,Arial,sans-serif;font-size:17px;}#diagramF04 .label{font-family:PingFang SC,Microsoft YaHei,Arial,sans-serif;color:#172c40;}#diagramF04 .cluster-label text{fill:#000000;}#diagramF04 .cluster-label span,#diagramF04 p{color:#000000;}#diagramF04 .label text,#diagramF04 span,#diagramF04 p{fill:#172c40;color:#172c40;}#diagramF04 .node rect,#diagramF04 .node circle,#diagramF04 .node ellipse,#diagramF04 .node polygon,#diagramF04 .node path{fill:#eef4fb;stroke:#607c99;stroke-width:1px;}#diagramF04 .flowchart-label text{text-anchor:middle;}#diagramF04 .node .katex path{fill:#000;stroke:#000;stroke-width:1px;}#diagramF04 .node .label{text-align:center;}# rm=\"translate(-8.5, -12)\" class=\"label\">\u003crect height=\"24.00033950805664\" width=\"17.000240325927734\" ry=\"0\" rx=\"0\">\u003c/rect>\u003ctext style=\"\">\u003ctspan class=\"row\" x=\"0\" dy=\"1em\" xml:space=\"preserve\">是\u003c/tspan>\u003c/text>\u003c/g>\u003c/g>\u003cg transform=\"translate(304.5, 916)\" class=\"edgeLabel\">\u003cg transform=\"translate(-8.5, -12)\" class=\"label\">\u003crect height=\"24.00033950805664\" width=\"17.000240325927734\" ry=\"0\" rx=\"0\">\u003c/rect>\u003ctext style=\"\">\u003ctspan class=\"row\" x=\"0\" dy=\"1em\" xml:space=\"preserve\">否\u003c/tspan>\u003c/text>\u003c/g>\u003c/g>\u003cg transform=\"translate(182.5, 1272)\" class=\"edgeLabel\">\u003cg transform=\"translate(-8.5, -12)\" class=\"label\">\u003crect height=\"24.00033950805664\" width=\"17.000240325927734\" ry=\"0\" rx=\"0\">\u003c/rect>\u003ctext style=\"\">\u003ctspan class=\"row\" x=\"0\" dy=\"1em\" xml:space=\"preserve\">是\u003c/tspan>\u003c/text>\u003c/g>\u003c/g>\u003cg class=\"edgeLabel\">\u003cg transform=\"translate(0, 0)\" class=\"label\">\u003crect height=\"0\" width=\"0\" ry=\"0\" rx=\"0\">\u003c/rect>\u003ctext style=\"\">\u003ctspan class=\"row\" x=\"0\" dy=\"1em\" xml:space=\"preserve\">\u003c/tspan>\u003c/text>\u003c/g>\u003c/g>\u003cg transform=\"translate(323, 1272)\" class=\"edgeLabel\">\u003cg transform=\"translate(-8.5, -12)\" class=\"label\">\u003crect height=\"24.00033950805664\" width=\"17.000240325927734\" ry=\"0\" rx=\"0\">\u003c/rect>\u003ctext style=\"\">\u003ctspan class=\"row\" x=\"0\" dy=\"1em\" xml:space=\"preserve\">否\u003c/tspan>\u003c/text>\u003c/g>\u003c/g>\u003cg class=\"edgeLabel\">\u003cg transform=\"translate(0, 0)\" class=\"label\">\u003crect height=\"0\" width=\"0\" ry=\"0\" rx=\"0\">\u003c/rect>\u003ctext style=\"\">\u003ctspan class=\"row\" x=\"0\" dy=\"1em\" xml:space=\"preserve\">\u003c/tspan>\u003c/text>\u003c/g>\u003c/g>\u003c/g>\u003cg class=\"nodes\">\u003cg transform=\"translate(282.75, 23)\" data-id=\"A\" data-node=\"true\" id=\"flowchart-A-216\" class=\"node default default flowchart-label\">\u003crect height=\"46\" width=\"248.671875\" y=\"-23\" x=\"-124.3359375\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\">\u003c/rect>\u003cg transform=\"translate(0, -12)\" style=\"\" class=\"label\">\u003crect>\u003c/rect>\u003ctext style=\"\">\u003ctspan class=\"row\" x=\"0\" dy=\"1em\" xml:space=\"preserve\">检索范围 配额与可选问句向量\u003c/tspan>\u003c/text>\u003c/g>\u003c/g>\u003cg transform=\"translate(282.75, 129)\" data-id=\"B\" data-node=\"true\" id=\"flowchart-B-217\" class=\"node default default flowchart-label\">\u003crect height=\"46\" width=\"192\" y=\"-23\" x=\"-96\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\">\u003c/rect>\u003cg transform=\"translate(0, -12)\" style=\"\" class=\"label\">\u003crect>\u003c/rect>\u003ctext style=\"\">\u003ctspan class=\"row\" x=\"0\" dy=\"1em\" xml:space=\"preserve\">只读关键词与向量查找\u003c/tspan>\u003c/text>\u003c/g>\u003c/g>\u003cg transform=\"translate(386.25, 235)\" data-id=\"C\" data-node=\"true\" id=\"flowchart-C-219\" class=\"node default default flowchart-label\">\u003crect height=\"46\" width=\"260\" y=\"-23\" x=\"-130\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\">\u003c/rect>\u003cg transform=\"translate(0, -12)\" style=\"\" class=\"label\">\u003crect>\u003c/rect>\u003ctext style=\"\">\u003ctspan class=\"row\" x=\"0\" dy=\"1em\" xml:space=\"preserve\">合并组合层传入的精确及更新项\u003c/tspan>\u003c/text>\u003c/g>\u003c/g>\u003cg transform=\"translate(386.25, 341)\" data-id=\"D\" data-node=\"true\" id=\"flowchart-D-221\" class=\"node default default flowchart-label\">\u003crect height=\"46\" width=\"242.015625\" y=\"-23\" x=\"-121.0078125\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\">\u003c/rect>\u003cg transform=\"translate(0, -12)\" style=\"\" class=\"label\">\u003crect>\u003c/rect>\u003ctext style=\"\">\u003ctspan class=\"row\" x=\"0\" dy=\"1em\" xml:space=\"preserve\">返回候选 ID 版本 与内部评分\u003c/tspan>\u003c/text>\u003c/g>\u003c/g>\u003cg transform=\"translate(386.25, 447)\" data-id=\"E\" data-node=\"true\" id=\"flowchart-E-223\" class=\"node default default flowchart-label\">\u003crect height=\"46\" width=\"234.4375\" y=\"-23\" x=\"-117.21875\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\">\u003c/rect>\u003cg transform=\"translate(0, -12)\" style=\"\" class=\"label\">\u003crect>\u003c/rect>\u003ctext style=\"\">\u003ctspan class=\"row\" x=\"0\" dy=\"1em\" xml:space=\"preserve\">组合层经 M02 或 M09 回源\u003c/tspan>\u003c/text>\u003c/g>\u003c/g>\u003cg transform=\"translate(386.25, 553)\" data-id=\"F\" data-node=\"true\" id=\"flowchart-F-225\" class=\"node default default flowchart-label\">\u003crect height=\"46\" width=\"280.65625\" y=\"-23\" x=\"-140.328125\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\">\u003c/rect>\u003cg transform=\"translate(0, -12)\" style=\"\" class=\"label\">\u003crect>\u003c/rect>\u003ctext style=\"\">\u003ctspan class=\"row\" x=\"0\" dy=\"1em\" xml:space=\"preserve\">经 M01 校验主体 端点 状态与版本\u003c/tspan>\u003c/text>\u003c/g>\u003c/g>\u003cg transform=\"translate(386.25, 755)\" data-id=\"H\" data-node=\"true\" id=\"flowchart-H-227\" class=\"node default default flowchart-label\">\u003cpolygon style=\"\" transform=\"translate(-119,119)\" class=\"label-container\" points=\"119,0 238,-119 119,-238 0,-119\">\u003c/polygon>\u003cg transform=\"translate(0, -12)\" style=\"\" class=\"label\">\u003crect>\u003c/rect>\u003ctext style=\"\">\u003ctspan class=\"row\" x=\"0\" dy=\"1em\" xml:space=\"preserve\">有效对象满足各类配额\u003c/tspan>\u003c/text>\u003c/g>\u003c/g>\u003cg transform=\"translate(404.75, 1460)\" data-id=\"G\" data-node=\"true\" id=\"flowchart-G-229\" class=\"node default default flowchart-label\">\u003crect height=\"46\" width=\"265.671875\" y=\"-23\" x=\"-132.8359375\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\">\u003c/rect>\u003cg transform=\"translate(0, -12)\" style=\"\" class=\"label\">\u003crect>\u003c/rect>\u003ctext style=\"\">\u003ctspan class=\"row\" x=\"0\" dy=\"1em\" xml:space=\"preserve\">仅交付允许内容 依据与覆盖状态\u003c/tspan>\u003c/text>\u003c/g>\u003c/g>\u003cg transform=\"translate(304.5, 1094)\" data-id=\"I\" data-node=\"true\" id=\"flowchart-I-231\" class=\"node default default flowchart-label\">\u003cpolygon style=\"\" transform=\"translate(-136,136)\" class=\"label-container\" points=\"136,0 272,-136 136,-272 0,-136\">\u003c/polygon>\u003cg transform=\"translate(0, -12)\" style=\"\" class=\"label\">\u003crect>\u003c/rect>\u003ctext style=\"\">\u003ctspan class=\"row\" x=\"0\" dy=\"1em\" xml:space=\"preserve\">候选未耗尽且仍有补取额度\u003c/tspan>\u003c/text>\u003c/g>\u003c/g>\u003cg transform=\"translate(79, 1345.5)\" data-id=\"J\" data-node=\"true\" id=\"flowchart-J-233\" class=\"node default default flowchart-label\">\u003crect height=\"63\" width=\"158\" y=\"-31.5\" x=\"-79\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\">\u003c/rect>\u003cg transform=\"translate(0, -20.5)\" style=\"\" class=\"label\">\u003crect>\u003c/rect>\u003ctext style=\"\">\u003ctspan class=\"row\" x=\"0\" dy=\"1em\" xml:space=\"preserve\">保存内部续取位置\u003c/tspan>\u003ctspan class=\"row\" x=\"0\" dy=\"1em\" xml:space=\"preserve\">复用问句向量补取\u003c/tspan>\u003c/text>\u003c/g>\u003c/g>\u003cg transform=\"translate(323, 1345.5)\" data-id=\"K\" data-node=\"true\" id=\"flowchart-K-237\" class=\"node default default flowchart-label\">\u003crect height=\"46\" width=\"260\" y=\"-23\" x=\"-130\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\">\u003c/rect>\u003cg transform=\"translate(0, -12)\" style=\"\" class=\"label\">\u003crect>\u003c/rect>\u003ctext style=\"\">\u003ctspan class=\"row\" x=\"0\" dy=\"1em\" xml:space=\"preserve\">标明通道耗尽或本轮覆盖不完整\u003c/tspan>\u003c/text>\u003c/g>\u003c/g>\u003c/g>\u003c/g>\u003c/g>\u003c/svg>"},{"id":"F05","module":"M05","name":"M05 conversations：消息、归属与会话串行","heading":"F05 消息归属与持久事件","filename":"runtime-modules.md","source":"flowchart TD\n  A[锁定会话并去重消息] --> B[保存消息与归属阻塞]\n  B --> C[等待当前运行权处理]\n  C --> D{结构化归属结果}\n  C -->|用户撤回尚未应用消息| W[宿主事务置withdrawn\u003cbr/>推进连续终态输入游标]\n  W --> H\n  D -->|目标已知| E[保存任务关联并重算阻塞]\n  D -->|目标不清| F[保存澄清引用与候选阻塞]\n  D -->|失败| G[保留阻塞及待恢复原因]\n  F --> E\n  G --> C\n  E --> H[追加事件并等待事务提交]\n  H --> I[SSE按序读取已提交事件]","context":"\u003cp>\u003cstrong>负责：\u003c/strong>会话归属、消息去重、持久事件序号、消息与任务关联、确认阻塞范围、Pi 会话的领取代次和消费进度。\u003c/p>\n\u003cp>\u003cstrong>边界：\u003c/strong>不解析自然语言、不修改条件/SQL/预算、不把 SSE 连接当作运行生命周期。会话租约区别于 M10 后台任务租约；领取一个 job 不等于取得 Pi 会话写权。\u003c/p>\n\u003cp>\u003cstrong>私有数据：\u003c/strong>\u003ccode>conversations\u003c/code>、\u003ccode>conversation_events\u003c/code>，以及消息正文/指纹、归属记录、阻塞项、事件消费记录。保留消息/事件 ID、展示 \u003ccode>event_seq\u003c/code>、仅 Agent 输入的 \u003ccode>input_seq\u003c/code>、\u003ccode>schema_version\u003c/code>、归属、对象引用和原预算；两个序列与游标分别保存。\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>字段\u003c/th>\u003cth>初始状态设计\u003c/th>\u003cth>规则\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ccode>routing_state\u003c/code>\u003c/td>\u003ctd>\u003ccode>pending / new_task / task_update / task_question / needs_target / withdrawn\u003c/code>\u003c/td>\u003ctd>归属由结构化操作保存；已应用消息不可撤回删除历史\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>processing_state\u003c/code>\u003c/td>\u003ctd>\u003ccode>unprocessed / processing / applied / retryable_failed\u003c/code>\u003c/td>\u003ctd>失败不解除阻塞；错误与恢复原因单独记录\u003c/td>\u003c/tr>\u003ctr>\u003ctd>输入 \u003ccode>disposition\u003c/code>\u003c/td>\u003ctd>\u003ccode>pending / consumed / withdrawn / suppressed\u003c/code>\u003c/td>\u003ctd>后三者为持久终态；\u003ccode>consumed\u003c/code> 由运行提交，撤回/取消/删除等宿主动作可处分对应输入，不能替模型消费其他输入\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>confirmation_block\u003c/code>\u003c/td>\u003ctd>\u003ccode>none / conversation / task_set\u003c/code>\u003c/td>\u003ctd>按全部未解决消息/澄清求并集；不能用一个“忙碌”布尔值覆盖\u003c/td>\u003c/tr>\u003ctr>\u003ctd>会话运行权\u003c/td>\u003ctd>\u003ccode>lease_owner / lease_until / lease_epoch\u003c/code>\u003c/td>\u003ctd>接管递增代次；超时和代次校验均由数据库时间决定\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>对外操作\u003c/th>\u003cth>输入 → 输出\u003c/th>\u003cth>关键校验、副作用与幂等\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ccode>create_conversation_in_tx\u003c/code>\u003c/td>\u003ctd>\u003ccode>AccessContext, client_creation_id\u003c/code> → 会话 ID\u003c/td>\u003ctd>用户首次发送时创建；创建 ID 幂等，纯空白页不创建持久记录\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>list_conversations_in_tx\u003c/code>\u003c/td>\u003ctd>\u003ccode>AccessContext, cursor, limit\u003c/code> → 有权读取的摘要页\u003c/td>\u003ctd>返回会话、最新事件和未完成关联引用；不跨模块读任务/查询私表\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>read_snapshot_in_tx\u003c/code>\u003c/td>\u003ctd>\u003ccode>AccessContext, conversation_id\u003c/code> → 消息/事件游标/任务引用快照\u003c/td>\u003ctd>组合层另读 M06/M07 汇总；SSE 游标失效后以快照重建再续读\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>delete_conversation_in_tx\u003c/code>\u003c/td>\u003ctd>用户动作、会话 ID、期望修订 → 删除回执与收尾引用\u003c/td>\u003ctd>幂等保存删除标记、终止新的加载/运行权；组合层停止任务并安排查询查证/取消，不删除独立个人资产\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>lock_conversation_in_tx\u003c/code>\u003c/td>\u003ctd>\u003ccode>AccessContext, conversation_id\u003c/code> → 锁定的会话快照\u003c/td>\u003ctd>校验归属/未删除，取得所有组合写入的首把行锁；可信收尾路径只允许已删除会话的必要查证\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>lock_inputs_in_tx\u003c/code>\u003c/td>\u003ctd>锁定会话、输入 ID/待处理范围 → 按 \u003ccode>input_seq\u003c/code> 锁定的输入与处分\u003c/td>\u003ctd>只读本模块记录，校验输入归属；领取、撤回和推进输入游标使用同一会话锁\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>accept_message_in_tx\u003c/code>\u003c/td>\u003ctd>\u003ccode>client_message_id, text, explicit_task?, clarification_id?, budget_scope_id\u003c/code> → \u003ccode>message_id, event_id, routing_state\u003c/code>\u003c/td>\u003ctd>同用户客户端 ID 唯一；不同会话、正文或目标冲突；保存 \u003ccode>pending\u003c/code> 和会话阻塞，明确目标另返回需冻结的任务 ID\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>apply_routing_in_tx\u003c/code>\u003c/td>\u003ctd>\u003ccode>message_id, decision, task_refs, clarification_ref?, block_scope\u003c/code> → 新归属与剩余阻塞\u003c/td>\u003ctd>\u003ccode>decision\u003c/code> 限定上述归属枚举；组合层提供同事务已校验的任务/澄清引用；不能解除其他消息的阻塞\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>withdraw_message_in_tx\u003c/code>\u003c/td>\u003ctd>用户动作、锁定消息、期望修订 → 撤回事件与剩余阻塞\u003c/td>\u003ctd>仅尚未应用消息可撤回；同事务将对应输入置 \u003ccode>withdrawn\u003c/code> 并推进可推进的输入游标；已应用返回 \u003ccode>already_applied\u003c/code>，不改写旧条件\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>claim_turn_in_tx / assert_turn_in_tx / renew_turn_in_tx / release_turn_in_tx / revoke_turn_in_tx\u003c/code>\u003c/td>\u003ctd>领取者或 \u003ccode>run_id, lease_epoch\u003c/code>，撤销另带用户动作 → 当前运行权\u003c/td>\u003ctd>领取/接管/撤销增加代次，续租只限未过期当前持有者；工具/输出/提交前检查运行权；等待用户/查询后释放\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>append_events_in_tx\u003c/code>\u003c/td>\u003ctd>带稳定 \u003ccode>event_id\u003c/code> 的事件批次 → 已分配序号\u003c/td>\u003ctd>同事件 ID 同载荷返回原序号；分配持久递增序号，事务提交后方可投递 SSE\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>commit_consumption_in_tx\u003c/code>\u003c/td>\u003ctd>运行权、锁定输入、期望输入游标 → 消费回执\u003c/td>\u003ctd>只将该运行已领取且仍为 \u003ccode>pending\u003c/code> 的输入置 \u003ccode>consumed\u003c/code>；沿连续终态推进 \u003ccode>input_seq\u003c/code>，遇 \u003ccode>pending\u003c/code> 即停止；重复提交返回原结果\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>dispose_inputs_in_tx\u003c/code>\u003c/td>\u003ctd>宿主动作及同事务受影响范围、锁定输入、\u003ccode>withdrawn/suppressed\u003c/code> 与原因 → 处分/游标回执\u003c/td>\u003ctd>宿主短事务仅处分明确撤回消息或已取消任务/已删除会话的对应输入；幂等、不改已消费输入，不以模型失败为由跳过其他消息\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>read_events_in_tx\u003c/code>\u003c/td>\u003ctd>\u003ccode>AccessContext, conversation_id, after_seq, limit\u003c/code> → 事件页/新游标\u003c/td>\u003ctd>当前权限回源；游标超出保留范围返回 \u003ccode>snapshot_required\u003c/code>，不静默漏事件\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>输入游标只扫描 Agent 输入，并跨过已经 \u003ccode>consumed/withdrawn/suppressed\u003c/code> 的连续前缀；展示事件无输入序号，不形成缺口。运行提交与宿主处分复用该规则；处分不会调用模型，也不能将仍待判断的其他消息冒充已消费。\u003c/p>","svg":"\u003csvg aria-roledescription=\"flowchart-v2\" role=\"graphics-document document\" viewBox=\"-8 -8 681.5 986\" height=\"986\" xmlns=\"http://www.w3.org/2000/svg\" width=\"681.5\" id=\"diagramF05\">\u003cstyle>#diagramF05{font-family:PingFang SC,Microsoft YaHei,Arial,sans-serif;font-size:17px;fill:#172c40;}#diagramF05 .error-icon{fill:#ffffff;}#diagramF05 .error-text{fill:#000000;stroke:#000000;}#diagramF05 .edge-thickness-normal{stroke-width:2px;}#diagramF05 .edge-thickness-thick{stroke-width:3.5px;}#diagramF05 .edge-pattern-solid{stroke-dasharray:0;}#diagramF05 .edge-pattern-dashed{stroke-dasharray:3;}#diagramF05 .edge-pattern-dotted{stroke-dasharray:2;}#diagramF05 .marker{fill:#617387;stroke:#617387;}#diagramF05 .marker.cross{stroke:#617387;}#diagramF05 svg{font-family:PingFang SC,Microsoft YaHei,Arial,sans-serif;font-size:17px;}#diagramF05 .label{font-family:PingFang SC,Microsoft YaHei,Arial,sans-serif;color:#172c40;}#diagramF05 .cluster-label text{fill:#000000;}#diagramF05 .cluster-label span,#diagramF05 p{color:#000000;}#diagramF05 .label text,#diagramF05 span,#diagramF05 p{fill:#172c40;color:#172c40;}#diagramF05 .node rect,#diagramF05 .node circle,#diagramF05 .node ellipse,#diagramF05 .node polygon,#diagramF05 .node path{fill:#eef4fb;stroke:#607c99;stroke-width:1px;}#diagramF05 .flowchart-label text{text-anchor:middle;}#diagramF05 .node .katex path{fill:#000;stroke:#000;stroke-width:1px;}#diagramF05 .node .label{text-align:center;}#diagramF05 .node.clickable{cursor:pointer;}#diagramF05 .arrowheadPath{fill:#0b0b0b;}#diagramF05 .edgePath .path{stroke:#617387;stroke-width:2.0px;}#diagramF05 .flowchart-link{stroke:#617387;fill:none;}#diagramF05 .edgeLabel{background-color:#f5f8fb;text-align:center;}#diagramF05 .edgeLabel rect{opacity:0.5;background-color:#f5f8fb;fill:#f5f8fb;}#diagramF05 .labelBkg{background-color:rgba(245, 248, 251, 0.5);}#diagramF05 .cluster rect{fill:#f7f9fc;stroke:#bccbd9;stroke-width:1px;}#d transform=\"translate(0, -12)\" style=\"\" class=\"label\">\u003crect>\u003c/rect>\u003ctext style=\"\">\u003ctspan class=\"row\" x=\"0\" dy=\"1em\" xml:space=\"preserve\">保存消息与归属阻塞\u003c/tspan>\u003c/text>\u003c/g>\u003c/g>\u003cg transform=\"translate(255.75, 235)\" data-id=\"C\" data-node=\"true\" id=\"flowchart-C-243\" class=\"node default default flowchart-label\">\u003crect height=\"46\" width=\"175\" y=\"-23\" x=\"-87.5\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\">\u003c/rect>\u003cg transform=\"translate(0, -12)\" style=\"\" class=\"label\">\u003crect>\u003c/rect>\u003ctext style=\"\">\u003ctspan class=\"row\" x=\"0\" dy=\"1em\" xml:space=\"preserve\">等待当前运行权处理\u003c/tspan>\u003c/text>\u003c/g>\u003c/g>\u003cg transform=\"translate(395, 411.5)\" data-id=\"D\" data-node=\"true\" id=\"flowchart-D-245\" class=\"node default default flowchart-label\">\u003cpolygon style=\"\" transform=\"translate(-93.5,93.5)\" class=\"label-container\" points=\"93.5,0 187,-93.5 93.5,-187 0,-93.5\">\u003c/polygon>\u003cg transform=\"translate(0, -12)\" style=\"\" class=\"label\">\u003crect>\u003c/rect>\u003ctext style=\"\">\u003ctspan class=\"row\" x=\"0\" dy=\"1em\" xml:space=\"preserve\">结构化归属结果\u003c/tspan>\u003c/text>\u003c/g>\u003c/g>\u003cg transform=\"translate(96, 726.5)\" data-id=\"W\" data-node=\"true\" id=\"flowchart-W-247\" class=\"node default default flowchart-label\">\u003crect height=\"63\" width=\"192\" y=\"-31.5\" x=\"-96\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\">\u003c/rect>\u003cg transform=\"translate(0, -20.5)\" style=\"\" class=\"label\">\u003crect>\u003c/rect>\u003ctext style=\"\">\u003ctspan class=\"row\" x=\"0\" dy=\"1em\" xml:space=\"preserve\">宿主事务置withdrawn\u003c/tspan>\u003ctspan class=\"row\" x=\"0\" dy=\"1em\" xml:space=\"preserve\">推进连续终态输入游标\u003c/tspan>\u003c/text>\u003c/g>\u003c/g>\u003cg transform=\"translate(337.25, 841)\" data-id=\"H\" data-node=\"true\" id=\"flowchart-H-249\" class=\"node default default flowchart-label\">\u003crect height=\"46\" width=\"209\" y=\"-23\" x=\"-104.5\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\">\u003c/rect>\u003cg transform=\"translate(0, -12)\" style=\"\" class=\"label\">\u003crect>\u003c/rect>\u003ctext style=\"\">\u003ctspan class=\"row\" x=\"0\" dy=\"1em\" xml:space=\"preserve\">追加事件并等待事务提交\u003c/tspan>\u003c/text>\u003c/g>\u003c/g>\u003cg transform=\"translate(478, 726.5)\" data-id=\"E\" data-node=\"true\" id=\"flowchart-E-251\" class=\"node default default flowchart-label\">\u003crect height=\"46\" width=\"209\" y=\"-23\" x=\"-104.5\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\">\u003c/rect>\u003cg transform=\"translate(0, -12)\" style=\"\" class=\"label\">\u003crect>\u003c/rect>\u003ctext style=\"\">\u003ctspan class=\"row\" x=\"0\" dy=\"1em\" xml:space=\"preserve\">保存任务关联并重算阻塞\u003c/tspan>\u003c/text>\u003c/g>\u003c/g>\u003cg transform=\"translate(561, 612)\" data-id=\"F\" data-node=\"true\" id=\"flowchart-F-253\" class=\"node default default flowchart-label\">\u003crect height=\"46\" width=\"209\" y=\"-23\" x=\"-104.5\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\">\u003c/rect>\u003cg transform=\"translate(0, -12)\" style=\"\" class=\"label\">\u003crect>\u003c/rect>\u003ctext style=\"\">\u003ctspan class=\"row\" x=\"0\" dy=\"1em\" xml:space=\"preserve\">保存澄清引用与候选阻塞\u003c/tspan>\u003c/text>\u003c/g>\u003c/g>\u003cg transform=\"translate(237.25, 612)\" data-id=\"G\" data-node=\"true\" id=\"flowchart-G-255\" class=\"node default default flowchart-label\">\u003crect height=\"46\" width=\"192\" y=\"-23\" x=\"-96\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\">\u003c/rect>\u003cg transform=\"translate(0, -12)\" style=\"\" class=\"label\">\u003crect>\u003c/rect>\u003ctext style=\"\">\u003ctspan class=\"row\" x=\"0\" dy=\"1em\" xml:space=\"preserve\">保留阻塞及待恢复原因\u003c/tspan>\u003c/text>\u003c/g>\u003c/g>\u003cg transform=\"translate(337.25, 947)\" data-id=\"I\" data-node=\"true\" id=\"flowchart-I-263\" class=\"node default default flowchart-label\">\u003crect height=\"46\" width=\"207.328125\" y=\"-23\" x=\"-103.6640625\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\">\u003c/rect>\u003cg transform=\"translate(0, -12)\" style=\"\" class=\"label\">\u003crect>\u003c/rect>\u003ctext style=\"\">\u003ctspan class=\"row\" x=\"0\" dy=\"1em\" xml:space=\"preserve\">SSE按序读取已提交事件\u003c/tspan>\u003c/text>\u003c/g>\u003c/g>\u003c/g>\u003c/g>\u003c/g>\u003c/svg>"},{"id":"F06","module":"M06","name":"M06 analysis：分析目标、条件与澄清","heading":"F06 条件修订与澄清","filename":"runtime-modules.md","source":"flowchart TD\n  A[结构化任务操作] --> B{起点版本与归属有效}\n  A -->|用户取消目标任务| XCancel[关闭目标澄清并停止该任务\u003cbr/>其他任务继续]\n  B -->|否| X[返回冲突或拒绝]\n  B -->|是| C{存在必须补充的条件}\n  C -->|是| D[保存澄清与已知条件]\n  D --> E[校验回答并保存新修订]\n  C -->|否| F[保存完整条件修订]\n  E --> F\n  F --> G[返回新版本和影响范围]\n  G --> H[组合层据持久事实推进交互阶段]","context":"\u003cp>\u003cstrong>负责：\u003c/strong>任务身份、不可变条件修订、条件来源、缺口、可恢复澄清和任务交互阶段。\u003ccode>update_analysis_task\u003c/code> 的不同动作由组合层分别调用本模块和 M05/M07，不在模块内调用兄弟模块。\u003c/p>\n\u003cp>\u003cstrong>边界：\u003c/strong>不判断消息的自然语言含义、不生成 SQL、不保存用户执行确认、不把模型叙述转为平台成功。SQL 草稿和查询状态由 M07 提供事实快照。\u003c/p>\n\u003cp>\u003cstrong>私有数据：\u003c/strong>\u003ccode>analysis_tasks\u003c/code>、\u003ccode>condition_revisions\u003c/code>、\u003ccode>clarifications\u003c/code>、\u003ccode>task_lifecycle_operations\u003c/code>；条件包含目标、对象、时间/时区、过滤、维度、粒度、依据与来源、未解决问题。澄清含问题、候选任务、可选答案、创建事件、回答消息和解决版本；无明确任务时可暂挂会话。取消命令按用户和操作身份保存载荷指纹与回执；相同载荷重传直接取回执，换目标或版本拒绝冲突，已取消终态不再次中断剩余目标。\u003c/p>\n\u003cp>Pi工具的\u003ccode>AnalysisUpdate\u003c/code>沿用同源JSON Schema：新建任务须带完整\u003ccode>conditions\u003c/code>，新建可省略尚未分配的\u003ccode>task_id/expected_version\u003c/code>（保留接受JSON null），已有任务必须给真实ID与当前版本；未指定标量保留null、列表保留空数组。已有任务版本使用工具回执中的数字字符串。没有需要用户补充的歧义时省略\u003ccode>question\u003c/code>并传\u003ccode>options=[]\u003c/code>（仍接受JSON null）。\u003ccode>knowledge_refs\u003c/code>引用知识对象的\u003ccode>id/version/path\u003c/code>，来源读取的\u003ccode>source_id\u003c/code>不能充当知识对象ID。校验失败仍作为Pi工具错误交模型修正，不由宿主猜测任务条件。\u003c/p>\n\u003cp>已有任务的\u003ccode>revise/clarify\u003c/code>须带\u003ccode>condition_patch\u003c/code>及当前版本；空白问题和字符串\u003ccode>null/undefined\u003c/code>不能生成澄清。正式输出取Pi最后一条助手消息，通过\u003ccode>FinishRun.final_start_chunk_seq\u003c/code>绑定其已保存片段；省略该字段的旧请求从片段1核对。Rust始终核对全部片段连续、起点范围和正式文本相等，调查过程仍作为事件保留。\u003c/p>\n\u003cp>\u003ccode>route\u003c/code>只登记消息归属，禁止附带\u003ccode>conditions/condition_patch\u003c/code>或澄清问题。修改渠道、时间、指标等条件使用\u003ccode>revise\u003c/code>，获得新的条件版本并失效旧待确认草稿；只有条件保持不变而改写SQL时，\u003ccode>route\u003c/code>可带\u003ccode>replaces_query_id\u003c/code>声明修订。错误动作与参数组合在共享契约边界拒绝，不能成功返回后静默丢掉修改。\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>状态维度\u003c/th>\u003cth>初始状态设计\u003c/th>\u003cth>规则\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>任务生命周期\u003c/td>\u003ctd>\u003ccode>active / cancelled\u003c/code>\u003c/td>\u003ctd>取消停止后续推进；相关查询的真实终态单独保存\u003c/td>\u003c/tr>\u003ctr>\u003ctd>当前交互阶段\u003c/td>\u003ctd>\u003ccode>investigating / waiting_clarification / waiting_confirmation / waiting_query / answered / failed\u003c/code>\u003c/td>\u003ctd>带条件版本和阶段修订号；历史查询运行不阻止新条件进入调查\u003c/td>\u003c/tr>\u003ctr>\u003ctd>澄清状态\u003c/td>\u003ctd>\u003ccode>open / resolved / withdrawn\u003c/code>\u003c/td>\u003ctd>目标澄清可保持会话级；业务口径澄清在归属明确后仅影响对应任务\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>对外操作\u003c/th>\u003cth>输入 → 输出\u003c/th>\u003cth>关键校验、副作用与幂等\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ccode>lock_tasks_in_tx\u003c/code>\u003c/td>\u003ctd>锁定会话、任务 ID 集合、关联澄清范围 → \u003ccode>LockedTask\u003c/code> / 澄清快照\u003c/td>\u003ctd>任务 ID 排序后锁相关澄清；校验同会话归属，返回当前生命周期与版本；取消、修订和查询确认均用此快照\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>create_task_in_tx\u003c/code>\u003c/td>\u003ctd>消息引用、目标、已知条件、依据/缺口 → 任务与首个条件版本\u003c/td>\u003ctd>创建归属固定的任务；重复工具操作返回原任务；不自行关联消息\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>revise_conditions_in_tx\u003c/code>\u003c/td>\u003ctd>\u003ccode>task_id, base_revision, patch, evidence\u003c/code> → 新版本与受影响字段\u003c/td>\u003ctd>校验起点版本；补丁只允许 \u003ccode>set/unset\u003c/code> 和允许路径；未提及字段与来源保留\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>open_clarification_in_tx\u003c/code>\u003c/td>\u003ctd>消息、目标/候选、字段、问题、选项、可选条件补丁 → 澄清 ID/条件版本\u003c/td>\u003ctd>候选均属同会话；修订须带起点版本；问题和附带修订同事务保存\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>resolve_clarification_in_tx\u003c/code>\u003c/td>\u003ctd>澄清 ID、回答消息、确定任务、起点版本/补丁 → 条件版本与解决回执\u003c/td>\u003ctd>校验尚未解决、回答属于同会话；旧版回答返回冲突，不生成或确认 SQL\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>read_task_context_in_tx\u003c/code>\u003c/td>\u003ctd>\u003ccode>task_id, condition_revision?\u003c/code> → 当前或历史条件/澄清快照\u003c/td>\u003ctd>不用当前条件替换查询绑定的历史条件；当前归属和权限由组合层核对\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>set_interaction_phase_in_tx\u003c/code>\u003c/td>\u003ctd>期望任务/条件修订、受控事实摘要 → 新阶段\u003c/td>\u003ctd>组合层汇集未解决澄清、当前待确认请求、相关查询和提交输出；拒绝模型任意状态字符串\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>cancel_task_in_tx\u003c/code>\u003c/td>\u003ctd>用户动作、锁定任务、期望修订 → 停止回执、关闭澄清与待收尾关联范围\u003c/td>\u003ctd>只取消指定任务并关闭其业务澄清；多候选目标澄清移除该任务，仍有其他候选则保留；组合层拒绝该任务原待确认并安排查询取消，不宣称平台已取消\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>阶段更新由保存的业务事实决定：开放澄清优先等待澄清；可执行当前草稿等待确认；当前条件的已确认查询未结束则等待查询；允许交付且输出已提交才可标为已回答。已取消任务拒绝新条件、澄清回答和查询推进；旧条件结果只写历史事件，不能推进当前条件阶段。缺口与失败原因保留。\u003c/p>","svg":"\u003csvg aria-roledescription=\"flowchart-v2\" role=\"graphics-document document\" viewBox=\"-8 -8 566 1250\" height=\"1250\" xmlns=\"http://www.w3.org/2000/svg\" width=\"566\" id=\"diagramF06\">\u003cstyle>#diagramF06{font-family:PingFang SC,Microsoft YaHei,Arial,sans-serif;font-size:17px;fill:#172c40;}#diagramF06 .error-icon{fill:#ffffff;}#diagramF06 .error-text{fill:#000000;stroke:#000000;}#diagramF06 .edge-thickness-normal{stroke-width:2px;}#diagramF06 .edge-thickness-thick{stroke-width:3.5px;}#diagramF06 .edge-pattern-solid{stroke-dasharra 03ctext style=\"\">\u003ctspan class=\"row\" x=\"0\" dy=\"1em\" xml:space=\"preserve\">结构化任务操作\u003c/tspan>\u003c/text>\u003c/g>\u003c/g>\u003cg transform=\"translate(178.5, 240.5)\" data-id=\"B\" data-node=\"true\" id=\"flowchart-B-265\" class=\"node default default flowchart-label\">\u003cpolygon style=\"\" transform=\"translate(-110.5,110.5)\" class=\"label-container\" points=\"110.5,0 221,-110.5 110.5,-221 0,-110.5\">\u003c/polygon>\u003cg transform=\"translate(0, -12)\" style=\"\" class=\"label\">\u003crect>\u003c/rect>\u003ctext style=\"\">\u003ctspan class=\"row\" x=\"0\" dy=\"1em\" xml:space=\"preserve\">起点版本与归属有效\u003c/tspan>\u003c/text>\u003c/g>\u003c/g>\u003cg transform=\"translate(437, 240.5)\" data-id=\"XCancel\" data-node=\"true\" id=\"flowchart-XCancel-267\" class=\"node default default flowchart-label\">\u003crect height=\"63\" width=\"226\" y=\"-31.5\" x=\"-113\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\">\u003c/rect>\u003cg transform=\"translate(0, -20.5)\" style=\"\" class=\"label\">\u003crect>\u003c/rect>\u003ctext style=\"\">\u003ctspan class=\"row\" x=\"0\" dy=\"1em\" xml:space=\"preserve\">关闭目标澄清并停止该任务\u003c/tspan>\u003ctspan class=\"row\" x=\"0\" dy=\"1em\" xml:space=\"preserve\">其他任务继续\u003c/tspan>\u003c/text>\u003c/g>\u003c/g>\u003cg transform=\"translate(70.5, 545.5)\" data-id=\"X\" data-node=\"true\" id=\"flowchart-X-269\" class=\"node default default flowchart-label\">\u003crect height=\"46\" width=\"141\" y=\"-23\" x=\"-70.5\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\">\u003c/rect>\u003cg transform=\"translate(0, -12)\" style=\"\" class=\"label\">\u003crect>\u003c/rect>\u003ctext style=\"\">\u003ctspan class=\"row\" x=\"0\" dy=\"1em\" xml:space=\"preserve\">返回冲突或拒绝\u003c/tspan>\u003c/text>\u003c/g>\u003c/g>\u003cg transform=\"translate(286.5, 545.5)\" data-id=\"C\" data-node=\"true\" id=\"flowchart-C-271\" class=\"node default default flowchart-label\">\u003cpolygon style=\"\" transform=\"translate(-110.5,110.5)\" class=\"label-container\" points=\"110.5,0 221,-110.5 110.5,-221 0,-110.5\">\u003c/polygon>\u003cg transform=\"translate(0, -12)\" style=\"\" class=\"label\">\u003crect>\u003c/rect>\u003ctext style=\"\">\u003ctspan class=\"row\" x=\"0\" dy=\"1em\" xml:space=\"preserve\">存在必须补充的条件\u003c/tspan>\u003c/text>\u003c/g>\u003c/g>\u003cg transform=\"translate(348.25, 763)\" data-id=\"D\" data-node=\"true\" id=\"flowchart-D-273\" class=\"node default default flowchart-label\">\u003crect height=\"46\" width=\"175\" y=\"-23\" x=\"-87.5\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\">\u003c/rect>\u003cg transform=\"translate(0, -12)\" style=\"\" class=\"label\">\u003crect>\u003c/rect>\u003ctext style=\"\">\u003ctspan class=\"row\" x=\"0\" dy=\"1em\" xml:space=\"preserve\">保存澄清与已知条件\u003c/tspan>\u003c/text>\u003c/g>\u003c/g>\u003cg transform=\"translate(348.25, 893)\" data-id=\"E\" data-node=\"true\" id=\"flowchart-E-275\" class=\"node default default flowchart-label\">\u003crect height=\"46\" width=\"192\" y=\"-23\" x=\"-96\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\">\u003c/rect>\u003cg transform=\"translate(0, -12)\" style=\"\" class=\"label\">\u003crect>\u003c/rect>\u003ctext style=\"\">\u003ctspan class=\"row\" x=\"0\" dy=\"1em\" xml:space=\"preserve\">校验回答并保存新修订\u003c/tspan>\u003c/text>\u003c/g>\u003c/g>\u003cg transform=\"translate(286.5, 999)\" data-id=\"F\" data-node=\"true\" id=\"flowchart-F-277\" class=\"node default default flowchart-label\">\u003crect height=\"46\" width=\"158\" y=\"-23\" x=\"-79\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\">\u003c/rect>\u003cg transform=\"translate(0, -12)\" style=\"\" class=\"label\">\u003crect>\u003c/rect>\u003ctext style=\"\">\u003ctspan class=\"row\" x=\"0\" dy=\"1em\" xml:space=\"preserve\">保存完整条件修订\u003c/tspan>\u003c/text>\u003c/g>\u003c/g>\u003cg transform=\"translate(286.5, 1105)\" data-id=\"G\" data-node=\"true\" id=\"flowchart-G-281\" class=\"node default default flowchart-label\">\u003crect height=\"46\" width=\"192\" y=\"-23\" x=\"-96\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\">\u003c/rect>\u003cg transform=\"translate(0, -12)\" style=\"\" class=\"label\">\u003crect>\u003c/rect>\u003ctext style=\"\">\u003ctspan class=\"row\" x=\"0\" dy=\"1em\" xml:space=\"preserve\">返回新版本和影响范围\u003c/tspan>\u003c/text>\u003c/g>\u003c/g>\u003cg transform=\"translate(286.5, 1211)\" data-id=\"H\" data-node=\"true\" id=\"flowchart-H-283\" class=\"node default default flowchart-label\">\u003crect height=\"46\" width=\"260\" y=\"-23\" x=\"-130\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\">\u003c/rect>\u003cg transform=\"translate(0, -12)\" style=\"\" class=\"label\">\u003crect>\u003c/rect>\u003ctext style=\"\">\u003ctspan class=\"row\" x=\"0\" dy=\"1em\" xml:space=\"preserve\">组合层据持久事实推进交互阶段\u003c/tspan>\u003c/text>\u003c/g>\u003c/g>\u003c/g>\u003c/g>\u003c/g>\u003c/svg>"},{"id":"F07","module":"M07","name":"M07 queries：SQL 版本、用户确认与平台执行","heading":"F07 SQL 确认与平台查证","filename":"runtime-modules.md","source":"flowchart TD\n  A[检查并保存草稿] --> B[等待用户确认]\n  B --> C{会话阻塞与绑定版本有效}\n  C -->|否| X[拒绝本次确认]\n  C -->|是| D[保存确认并排队]\n  B -->|取消先提交| L[本地取消并拒绝旧确认]\n  D --> S{同锁核对活跃任务且无取消}\n  S -->|否| L\n  S -->|是| Intent[保存submitting与提交意图]\n  Intent --> E[事务外提交平台]\n  Intent -->|取消晚于提交意图| Cancel[记录取消意图并查证平台]\n  Cancel --> F\n  E -->|回执明确| F[跟踪平台状态]\n  E -->|回执未知| G[按幂等标识查证]\n  G --> F\n  F --> H{平台证实终态}\n  H -->|成功| I[保存结果引用和交付载荷]\n  H -->|失败或取消| J[保存真实终态和原因]","context":"\u003cp>\u003cstrong>负责：\u003c/strong>SQL 草稿/参数/依据/条件/执行目标绑定、完整语法与只读能力检查、待确认请求、真实用户确认、平台提交与查证、结果引用和取消记录。\u003c/p>\n\u003cp>\u003cstrong>边界：\u003c/strong>\u003ccode>request_query\u003c/code> 只检查和保存草稿，成功返回 \u003ccode>awaiting_confirmation\u003c/code>；它没有用户确认能力。该工具通过组合层调用下表操作。模块不整理条件、不解释结果、不把本地超时推断成平台失败或取消成功。\u003c/p>\n\u003cp>\u003cstrong>私有数据：\u003c/strong>\u003ccode>sql_drafts\u003c/code> 及不可变版本、\u003ccode>query_requests\u003c/code>、确认记录、平台提交/观察/取消回执；每个请求固定 \u003ccode>task_id, condition_revision, draft_version, target_id, target_version, budget_scope_id\u003c/code>。主键在预览时创建；主动重跑创建新待确认请求，SQL 相同仍需用户确认。\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>状态维度\u003c/th>\u003cth>初始状态设计\u003c/th>\u003cth>规则\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>草稿检查\u003c/td>\u003ctd>\u003ccode>passed / rejected / unsupported\u003c/code>\u003c/td>\u003ctd>整条语句可解析且目标能力允许才通过；失败也保留草稿与理由\u003c/td>\u003c/tr>\u003ctr>\u003ctd>确认\u003c/td>\u003ctd>\u003ccode>awaiting_confirmation / modifying / superseded / confirmed\u003c/code>\u003c/td>\u003ctd>只影响未确认请求；\u003ccode>confirmed\u003c/code> 保留真实用户、时间、绑定版本，不被新消息改写\u003c/td>\u003c/tr>\u003ctr>\u003ctd>执行\u003c/td>\u003ctd>\u003ccode>not_submitted / queued / submitting / submission_unknown / running / succeeded / failed / cancelled\u003c/code>\u003c/td>\u003ctd>\u003ccode>submitting\u003c/code> 崩溃按可能已发出处理；\u003ccode>submission_unknown\u003c/code> 先查证；状态查询超时保留最近已知状态并标 \u003ccode>observation_unknown\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>取消\u003c/td>\u003ctd>\u003ccode>none / requested / acknowledged / unsupported / unknown / rejected / completed\u003c/code>\u003c/td>\u003ctd>\u003ccode>acknowledged\u003c/code> 只表示平台收到请求；未生成提交意图可凭本地事务进入取消终态，可能发出后须平台证据\u003c/td>\u003c/tr>\u003ctr>\u003ctd>结果\u003c/td>\u003ctd>\u003ccode>unavailable / available / expired / access_denied\u003c/code>\u003c/td>\u003ctd>空行可以是成功；分页完整性、截断、上游到齐状态分别记录\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>对外操作\u003c/th>\u003cth>输入 → 输出\u003c/th>\u003cth>关键校验、副作用与幂等\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ccode>lock_requests_in_tx\u003c/code>\u003c/td>\u003ctd>锁定会话/任务、查询请求 ID 集合 → \u003ccode>LockedQueryRequest\u003c/code> 集合\u003c/td>\u003ctd>按 ID 锁定请求及其确认/取消状态；只读状态接口不能替代此锁；提交与取消竞争使用同一组锁\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>check_sql\u003c/code>（纯操作）\u003c/td>\u003ctd>SQL、参数、目标能力快照 → 检查报告/指纹\u003c/td>\u003ctd>检查完整 AST、单条只读、函数和外部访问；未知能力/语法返回 \u003ccode>unsupported\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>begin_revision_in_tx / save_draft_in_tx\u003c/code>\u003c/td>\u003ctd>条件快照、SQL、依据、目标版本、报告、预算范围、可选 \u003ccode>replaces_query_id\u003c/code> → 草稿版本/待确认请求\u003c/td>\u003ctd>SQL修订声明与消息归属同事务，声明后即失效目标旧稿，再进行外部检查。route声明须带task_id/expected_version/replaces_query_id；request_query可直接完成声明。引用限同用户/会话/任务/目标，检查失败也不恢复旧稿。独立新查询传null；已确认原查询独立收尾；已有后继的祖先不能再次修订\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>hold_pending_in_tx / supersede_pending_in_tx\u003c/code>\u003c/td>\u003ctd>任务范围、消息/条件修订引用 → 受影响请求 ID\u003c/td>\u003ctd>明确补充先置 \u003ccode>modifying\u003c/code>；新修订置 \u003ccode>superseded\u003c/code>；不改变已确认或执行中的请求\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>release_pending_in_tx\u003c/code>\u003c/td>\u003ctd>需释放的消息阻塞及同事务剩余阻塞快照 → 可恢复请求\u003c/td>\u003ctd>仅撤回或确定不影响时恢复未失效请求；不得复活已替代的草稿\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>confirm_request_in_tx\u003c/code>\u003c/td>\u003ctd>可信用户动作、锁定请求/会话/任务、展示草稿版本、确认 ID → 同一查询 ID\u003c/td>\u003ctd>已确认重传只返回现状，不重新排队；首次仅从 \u003ccode>awaiting_confirmation + not_submitted + active task + cancel=none\u003c/code> 进入 \u003ccode>queued\u003c/code>，并核对阻塞/版本/目标/权限；取消或替代请求拒绝\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>begin_submission_in_tx\u003c/code>\u003c/td>\u003ctd>锁定请求/任务、当前 Worker 代次、最新权限/能力检查结果 → 提交包或已有状态\u003c/td>\u003ctd>仅 \u003ccode>confirmed + queued + active task + cancel=none\u003c/code> 可原子登记提交意图并置 \u003ccode>submitting\u003c/code>；与本地取消按同锁事务提交顺序竞争；网络在提交后调用\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>record_submission_in_tx\u003c/code>\u003c/td>\u003ctd>请求 ID、代次、提交回执/未知原因 → 平台 ID/执行状态\u003c/td>\u003ctd>同次提交回执幂等；明确拒绝进入 failed，未知置 \u003ccode>submission_unknown\u003c/code> 后先查证；仅平台确认未接收才可重排，最多三次提交；旧代次拒绝。保存平台错误类别与至多1000字符诊断，查询工具和页面可读取\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>record_observation_in_tx\u003c/code>\u003c/td>\u003ctd>请求 ID、代次、稳定观察 ID、平台状态/结果引用 → 状态变化及交付载荷\u003c/td>\u003ctd>校验平台身份与版本；不从终态回退；同观察去重，终态交付 ID 按查询固定；与交付事件登记共事务\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>request_cancel_in_tx / record_cancel_in_tx\u003c/code>\u003c/td>\u003ctd>可信取消动作或平台回执、锁定请求 → 已知取消/执行状态\u003c/td>\u003ctd>\u003ccode>not_submitted/queued\u003c/code> 且无提交意图可本地置 \u003ccode>execution=cancelled, cancel=completed\u003c/code>；未确认置 \u003ccode>superseded\u003c/code>，已确认保留 \u003ccode>confirmed\u003c/code> 历史；\u003ccode>submitting\u003c/code> 以后先查证/发取消，终态竞争保留平台证据\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>read_query_in_tx / resolve_result_ref_in_tx\u003c/code>\u003c/td>\u003ctd>查询 ID、当前授权 → 查询快照/结果引用\u003c/td>\u003ctd>回看重新核对权限和有效期；过期不自动重跑；历史条件版本保持不变\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>fetch_result_page\u003c/code>（事务外）\u003c/td>\u003ctd>已授权结果引用、游标、范围 → 标准结果页\u003c/td>\u003ctd>经平台适配器读取；明确字段类型、精确数值编码、完整性/截断/来源；CSV 仅导出同一已授权范围，不提交 SQL\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>平台接口为 \u003ccode>submit_query / lookup_submission / get_status / read_results / cancel_query\u003c/code>。组合层在数据库事务之间调用适配器；提交前重新核对权限和目标能力。网络检查返回的版本/有效期在落库前核对，实际平台仍负责最终权限与只读约束。\u003c/p>\n\u003cp>本地取消先提交，Worker 随后不得发出查询；提交意图先提交，即使网络尚未发送也按可能已发出处理，后续取消走查证路径，不谎报本地取消成功。所有取消终态都不能被旧确认或重传恢复为 \u003ccode>queued\u003c/code>；主动重跑须新请求、新确认。\u003c/p>\n\u003cp>晚到结果属于已保存的原任务和条件。旧 Worker 的回执只能触发当前持有者重新查证，不能越过代次直接写状态；真实 \u003ccode>succeeded\u003c/code> 不被晚到取消确认覆盖，冲突或不明回执保留证据并查证。\u003c/p>","svg":"\u003csvg aria-roledescription=\"flowchart-v2\" role=\"graphics-document document\" viewBox=\"-8 -8 775.21875 1777\" height=\"1777\" xmlns=\"http://www.w3.org/2000/svg\" width=\"775.21875\" id=\"diagramF07\">\u003cstyle>#diagramF07{font-family:PingFang SC,Microsoft YaHei,Arial,sans-serif;font-size:17px;fill:#172c40;}#diagramF07 .error-icon{fill:#ffffff;}#diagramF07 .error-text{fill:#000000;stroke:#000000;}#diagramF07 .edge-thickness-normal{stroke-width:2px;}#diagramF07 .edge-thickness-thick{stroke-width:3.5px;}#diagramF07 .edge-pattern-solid{stroke-dasharray:0;}#diagramF07
