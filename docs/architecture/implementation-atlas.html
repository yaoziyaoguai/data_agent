ult flowchart-label\">\u003cpolygon style=\"\" transform=\"translate(-85,85)\" class=\"label-container\" points=\"85,0 170,-85 85,-170 0,-85\">\u003c/polygon>\u003cg transform=\"translate(0, -12)\" style=\"\" class=\"label\">\u003crect>\u003c/rect>\u003ctext style=\"\">\u003ctspan class=\"row\" x=\"0\" dy=\"1em\" xml:space=\"preserve\">平台证实终态\u003c/tspan>\u003c/text>\u003c/g>\u003c/g>\u003cg transform=\"translate(426.21875, 1738)\" data-id=\"I\" data-node=\"true\" id=\"flowchart-I-315\" class=\"node default default flowchart-label\">\u003crect height=\"46\" width=\"209\" y=\"-23\" x=\"-104.5\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\">\u003c/rect>\u003cg transform=\"translate(0, -12)\" style=\"\" class=\"label\">\u003crect>\u003c/rect>\u003ctext style=\"\">\u003ctspan class=\"row\" x=\"0\" dy=\"1em\" xml:space=\"preserve\">保存结果引用和交付载荷\u003c/tspan>\u003c/text>\u003c/g>\u003c/g>\u003cg transform=\"translate(653.21875, 1738)\" data-id=\"J\" data-node=\"true\" id=\"flowchart-J-317\" class=\"node default default flowchart-label\">\u003crect height=\"46\" width=\"175\" y=\"-23\" x=\"-87.5\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\">\u003c/rect>\u003cg transform=\"translate(0, -12)\" style=\"\" class=\"label\">\u003crect>\u003c/rect>\u003ctext style=\"\">\u003ctspan class=\"row\" x=\"0\" dy=\"1em\" xml:space=\"preserve\">保存真实终态和原因\u003c/tspan>\u003c/text>\u003c/g>\u003c/g>\u003c/g>\u003c/g>\u003c/g>\u003c/svg>"},{"id":"F08","module":"M08","name":"M08 runtime：运行、检查点、工具、输出与预算","heading":"F08 Pi 运行与提交","filename":"runtime-modules.md","source":"flowchart TD\n  A[新run继承恢复链与已保存检查点] --> Restore[M11沿数据库leaf恢复原生会话\u003cbr/>旧inline先绑定不可变副本再迁移]\n  Restore --> B[预留并领取模型调用许可]\n  B --> C[Node运行Pi SDK循环]\n  C --> D[按链和SDK调用ID登记\u003cbr/>跨run接回原operation与回执]\n  D --> B\n  C --> E[按序保存输出片段]\n  E --> Sync[M11校验并fsync原生会话\u003cbr/>导出精确leaf小引用]\n  Sync --> F{正常结束且提交材料完整}\n  F -->|是| G[交给finish_run组合事务]\n  F -->|否| H[记录中断失败或预算耗尽]\n  H --> I{输入仍待处理且未被处分}\n  I -->|是| Retry[沿原恢复链恢复或替换尝试]\n  I -->|否| Stop[保留输入终态 不再调用模型]\n  Retry --> Restore","context":"\u003cp>\u003cstrong>负责：\u003c/strong>运行绑定与恢复记录、工具调用账本、输出尝试及片段、模型调用许可与原范围预算。Node/M11 负责唯一 SDK 循环，M08 只执行约束与持久化，不另设规划器。\u003c/p>\n\u003cp>\u003cstrong>边界：\u003c/strong>不根据文本承诺修改任务/查询，不重放已成功业务副作用，不自行给新运行补额度。Pi 检查点不是条件、确认或长期记忆的替代品。\u003c/p>\n\u003cp>\u003cstrong>私有数据：\u003c/strong>\u003ccode>agent_runs\u003c/code>、\u003ccode>pi_checkpoints\u003c/code>、\u003ccode>tool_calls\u003c/code>、\u003ccode>assistant_outputs\u003c/code>/尝试/片段、\u003ccode>budget_scopes\u003c/code>、\u003ccode>model_call_attempts\u003c/code>。当前检查点含 SDK 格式版本、原 session、私有 JSONL 文件名、精确 leaf 和 authority；完整原生树由 M11 保存。旧 inline 在交付事务绑定不可变副本及指纹，受当前运行权校验后只读迁移；凭据不在其中。\u003c/p>\n\u003cp>\u003ccode>recovery_chain_id\u003c/code> 绑定一次逻辑交付、原输入/预算和 \u003ccode>output_id\u003c/code>，重启或替换执行创建新 \u003ccode>run_id\u003c/code> 时继承；新用户操作/新结果交付另建恢复链。工具业务唯一键为 \u003ccode>(conversation_id, operation_id)\u003c/code>；恢复映射另以 \u003ccode>(conversation_id, recovery_chain_id, sdk_tool_call_id)\u003c/code> 唯一，指向同一稳定操作，保存工具名/参数指纹、\u003ccode>origin_run_id\u003c/code> 与接回记录。去重不按 SQL/参数永久生效；相同参数的新操作可以正常执行，已提交调用恢复不能换链或操作身份。\u003c/p>\n\u003cp>恢复包的依据清单覆盖原资料及其派生回答、工具结果和压缩摘要。发送前发现引用失效，保守剔除所有依赖该引用的派生条目；无法证明依赖清单完整时，只从当前允许的用户消息与业务事实重建，不能仅删引用标签而保留正文。当前沿用Pi原生SessionManager和压缩接口，运行清单使用\u003ccode>dependency_schema=1\u003c/code>记录真正交付的知识/来源/记忆/Skill版本。启动材料裁剪后登记，工具回传后同事务累积，跨新输入和压缩保留并集；实际引用回源失效才重建。旧清单缺失或格式不完整时保守重建，新输入可重新调查，同输入恢复不得换SDK操作身份。额外近期材料仅含用户消息，助手历史从核对过的Pi检查点恢复。具体验证范围以CURRENT为准。\u003c/p>\n\u003cp>\u003cstrong>内部文件：\u003c/strong>\u003ccode>runs.rs\u003c/code>、\u003ccode>checkpoints.rs\u003c/code>、\u003ccode>outputs.rs\u003c/code>、\u003ccode>tool_ledger.rs\u003c/code>、\u003ccode>budgets.rs\u003c/code> 分担本模块规则，\u003ccode>store.rs\u003c/code> 保存存储细节；这些是内部职责边界，不导出一个同时处理全部动作的 Agent 类。\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>对象\u003c/th>\u003cth>初始状态设计\u003c/th>\u003cth>不变量\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>运行\u003c/td>\u003ctd>\u003ccode>queued / running / finished / interrupted / failed / cancelled / budget_exhausted\u003c/code>\u003c/td>\u003ctd>运行结束原因和任务等待原因分开；一个运行固定一个原预算范围\u003c/td>\u003c/tr>\u003ctr>\u003ctd>工具调用\u003c/td>\u003ctd>\u003ccode>registered / processing / succeeded / failed / unknown\u003c/code>\u003c/td>\u003ctd>同调用 ID/参数接回回执；副作用未知先查证，不能换 ID 重做\u003c/td>\u003c/tr>\u003ctr>\u003ctd>输出尝试\u003c/td>\u003ctd>\u003ccode>streaming / committed / interrupted / superseded\u003c/code>\u003c/td>\u003ctd>同一逻辑 \u003ccode>output_id\u003c/code> 最多一个有效提交；不同尝试不拼接\u003c/td>\u003c/tr>\u003ctr>\u003ctd>模型调用\u003c/td>\u003ctd>\u003ccode>reserved / issued / settled / unknown / released\u003c/code>\u003c/td>\u003ctd>\u003ccode>issued\u003c/code> 只授权首次发送；未知保留预留，证实未发出才可释放\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>对外操作\u003c/th>\u003cth>输入 → 输出\u003c/th>\u003cth>关键校验、副作用与幂等\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ccode>lock_run_in_tx\u003c/code>\u003c/td>\u003ctd>锁定会话、运行 ID → 锁定运行/恢复链\u003c/td>\u003ctd>校验运行与会话/链的归属，提供实际关联任务和原预算；历史回执读取不要求原运行仍持有租约，新写入须当前运行权\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>lock_tool_call_in_tx / lock_model_attempt_in_tx\u003c/code>\u003c/td>\u003ctd>锁定运行/链或维护上下文、调用键/尝试 ID → 锁定账本记录\u003c/td>\u003ctd>工具按会话/链/SDK 调用键读取；模型按尝试 ID 读取，两者不混用；同类多记录按 ID 排序，新记录由唯一键保护\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>lock_budget_scope_in_tx / lock_trial_budget_in_tx\u003c/code>\u003c/td>\u003ctd>固定范围/试验 ID → 锁定额度快照\u003c/td>\u003ctd>先范围后试验总额；预留/结算在短事务用当前额度，不接受事务外余额；维护调用同样适用\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>open_budget_scope_in_tx\u003c/code>\u003c/td>\u003ctd>主动用户消息、配置限额版本、试验总额度引用 → 范围 ID\u003c/td>\u003ctd>与接收消息同事务；同消息唯一；确认、Worker 和结果事件不新建额度\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>resolve_maintenance_budget_in_tx\u003c/code>\u003c/td>\u003ctd>空间、维护配置版本、作业类别/批次 → 已配置范围 ID\u003c/td>\u003ctd>仅采用运维配置限定的维护额度；无配置返回 \u003ccode>budget_unavailable\u003c/code>，作业/重试不能自建额度\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>start_run_in_tx\u003c/code>\u003c/td>\u003ctd>会话运行权、锁定输入、恢复链或新交付、目标/条件、原预算 → 运行/链/输出/尝试 ID\u003c/td>\u003ctd>输入须未被宿主终态处分；校验归属与预算，不同范围串行；恢复继承原链/逻辑输出并映射新运行，模型不得新建链绕过去重\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>stop_run_in_tx\u003c/code>\u003c/td>\u003ctd>锁定运行、停止原因/目标范围、期望版本 → 终止回执/中断尝试引用\u003c/td>\u003ctd>仅中断匹配范围的运行；停止新增调用，保留已提交工具；只有它是当前租约持有者时才同事务撤销运行权，不撤销同会话其他任务的运行\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>read_recovery_bundle_in_tx\u003c/code>\u003c/td>\u003ctd>运行/链/检查点版本、可见性判定 → 恢复包或重建要求\u003c/td>\u003ctd>沿恢复链接回原调用及 \u003ccode>operation_id\u003c/code>，只包含已提交输出和已查证工具结果；权限、资产变化经组合层校验后重建\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>register_tool_call_in_tx\u003c/code>\u003c/td>\u003ctd>当前运行权、恢复链、SDK 调用 ID、参数指纹、SDK 条目 → 稳定操作 ID/历史回执\u003c/td>\u003ctd>先保存调用与恢复条目再执行；同链同调用跨运行接回原记录，异参冲突；不接受新链/新 ID 代替已提交调用恢复\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>read_tool_call_in_tx\u003c/code>\u003c/td>\u003ctd>当前运行权、锁定调用、稳定操作 ID/指纹 → 状态/历史回执\u003c/td>\u003ctd>校验当前运行可接回该恢复链；成功返回原结果，未知先查证，不因 \u003ccode>run_id\u003c/code> 改变执行新副作用\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>record_tool_receipt_in_tx\u003c/code>\u003c/td>\u003ctd>锁定调用、稳定操作 ID、业务回执/错误/未知 → 持久回执\u003c/td>\u003ctd>应用内业务写入和成功回执同事务；保留原运行出处，外部 I/O 分段登记；仅明确失败标 \u003ccode>failed\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>append_output_in_tx\u003c/code>\u003c/td>\u003ctd>运行权、输出/尝试 ID、\u003ccode>chunk_seq, text\u003c/code> → 接受序号/缺口\u003c/td>\u003ctd>同序号同内容去重，异内容拒绝；推荐仅接收下一连续片段，乱序返回 \u003ccode>chunk_gap\u003c/code> 供重传\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>interrupt_output_in_tx / replace_output_in_tx\u003c/code>\u003c/td>\u003ctd>尝试 ID、原因或新尝试请求 → 中断/替换引用\u003c/td>\u003ctd>新尝试记录 \u003ccode>replaces_attempt_id\u003c/code>；组合层追加替换事件；旧片段不得作为完整历史\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>reserve_model_call_in_tx\u003c/code>\u003c/td>\u003ctd>运行权、\u003ccode>call_attempt_id\u003c/code>、参数指纹、输入/输出上界 → 许可\u003c/td>\u003ctd>原子检查范围和试验总限额；同 ID 幂等预留；真正重试另 ID，仍扣原范围；额度不足返回 \u003ccode>budget_exhausted\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>issue_model_call_in_tx\u003c/code>\u003c/td>\u003ctd>许可 ID、运行权 → 一次性发送许可或已知状态\u003c/td>\u003ctd>检查代次、参数、限额版本、到期时间；仅首次 \u003ccode>reserved→issued\u003c/code> 返回可发送，不因重传再次授权\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>settle_model_call_in_tx\u003c/code>\u003c/td>\u003ctd>尝试 ID、可靠用量/未发出证据/未知原因 → 结算状态\u003c/td>\u003ctd>用量幂等结算；超时未知不退款；会话删除/取消后允许核对归属、原运行代次与指纹后结算原尝试，不能获得新发送权\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>prepare_run_commit_in_tx\u003c/code>\u003c/td>\u003ctd>运行权、最终片段摘要、SDK 检查点、消费事件列表 → 已验证提交材料\u003c/td>\u003ctd>检查完整片段、格式版本、事件/输出归属和未决工具；不接收任意任务/查询状态；纯验证不提前提交\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>commit_run_in_tx\u003c/code>\u003c/td>\u003ctd>提交材料、稳定 \u003ccode>commit_id\u003c/code> → 最终输出引用/运行回执\u003c/td>\u003ctd>在组合层事务内保存最终正文、检查点和运行终态；同 ID/摘要返回原提交，冲突拒绝；旧代次不能新增提交\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>预算新增 \u003ccode>scope_kind=user_request|maintenance\u003c/code>。用户范围继续严格遵守第 19.8 节；资料预填和 Embedding 等后台付费调用采用已配置的有界 \u003ccode>maintenance\u003c/code> 范围，并受试验总上限约束。M03 单次结构化分析可经 \u003ccode>PrefillModelPort\u003c/code> 调模型；它不建立自主循环，也须先申请 M08 许可。\u003c/p>\n\u003cp>调用许可接受宿主绑定的 \u003ccode>RunContext\u003c/code> 或 \u003ccode>MaintenanceContext\u003c/code>；后者固定作业 ID、领取代次、配置/模型/资料范围、预算引用。维护调用校验 M10 的当前代次；工具/聊天接口不接受维护上下文，模型不能借此改换预算。若资料同步仅调用不计费平台读取，则不扣模型额度。\u003c/p>\n\u003cp>\u003ccode>append_output\u003c/code> 组合用例在一事务保存 M08 片段和 M05 流式事件，提交后才投递；事件携带输出/尝试/片段 ID。模型消费推进 \u003ccode>input_seq\u003c/code>，SSE 按 \u003ccode>event_seq\u003c/code> 读取；输出/展示事件不重新成为 Agent 输入。\u003c/p>\n\u003cp>模型选择来自持久 \u003ccode>ModelProfile\u003c/code>，Pi 从锁定 SDK 的对应目录项加载，维护预填使用同一模型 ID。允许 Flash 与 Pro 的明确价格版本配对；Pro 当前支持 off/high，原 I0 task 配置继续限 Flash。模型和价格都属于试验指纹，不能在旧试验中改换。聊天与维护按各自模型的高峰缓存未命中价保守计账，不声称等于服务商实际折扣账单。\u003c/p>\n\u003cp>调用耗时和 token/调用数跨重启累计，等待用户/查询不算模型运行时长。SDK 每次实际网络尝试均先取许可；不能拦截的隐式重试必须关闭，否则真实模型子项保持阻塞。价格或可计算输入/输出上界缺失时不承诺严格金额上限。\u003c/p>\n\u003cp>\u003ccode>issued\u003c/code> 落库与网络发送之间不能原子化，崩溃按可能已发出处理；新调用另申请尝试且旧预留保留。模型用量迟到可凭平台回执结算原账本，运行已过期不允许因此提交旧输出或再次发请求。\u003c/p>\n\u003cp>锁定Pi 1.0.0的恢复接入：从最近assistant消息中找出尚未匹配toolResult的调用，即使检查点以另一工具的结果结尾，也沿原SDK调用及operation_id逐个接回。明确拒绝的持久回执接为isError结果，成功的只写一次。工具提交响应失败后，通过内部只读\u003ccode>/internal/data/tool-rejections\u003c/code>按当前运行权、原SDK调用和参数指纹查证；仅返回已持久的rejected回执，不执行原工具、不返回成功正文，不存在或失权继续保留原错误。首次业务拒绝也在同次恢复交给Pi，不额外耗费一次Worker交付。执行前工具名/参数校验失败也接为未执行的isError结果，交Pi修正；登记与提交未知继续抛出，不能伪装成明确失败。接回后使用公开的\u003ccode>session.prompt(RECOVERY_NOTICE, { expandPromptTemplates: false })\u003c/code>继续原输入，先刷新当前资源，再经SDK会话的原生完成后处理与溢出压缩；不直接调用底层\u003ccode>session.agent.continue()\u003c/code>。恢复通知绑定原message_id/recovery_chain_id，不创建新业务输入或新预算。\u003c/p>\n\u003cp>正式回答交付若被\u003ccode>finish_run\u003c/code>明确拒绝\u003ccode>message_pending\u003c/code>，说明当前消息尚未登记归属且输出未提交。SDK明确报告\u003ccode>stopReason=length\u003c/code>时同样拒绝提交半截回答。Node仅通过Pi原生\u003ccode>sendCustomMessage\u003c/code>反馈一次相应拒绝，让模型补齐归属/澄清或重写简洁完整的回答，再提交修正后的完整文本。沿用原会话、run、message、恢复链和调用预算；宿主不替模型创建任务。取消后不起补正轮；再次拒绝、其他错误和未知回执均继续失败，不循环追加反馈或重做未知提交。验证覆盖修正成功、持续遗漏仅反馈一次、明确length不提交及最后回答替代前轮文本。\u003ccode>stopReason=stop\u003c/code>并不能证明自然语言完整或正确，仍需业务质量审查。\u003c/p>\n\u003cp>交付从Pi原生\u003ccode>message_end\u003c/code>事件取得最近完成的助手消息。SDK为整理上下文可能从\u003ccode>agent.state.messages\u003c/code>移除length消息；不能从整理后的上下文倒查输出，否则会拿前一条工具调用文字冒充最终回答。\u003ccode>message_start\u003c/code>继续绑定正式片段起点，完整片段校验仍由Rust执行。\u003c/p>","svg":"\u003csvg aria-roledescription=\"flowchart-v2\" role=\"graphics-document document\" viewBox=\"-8 -8 981.4921875 1533\" height=\"1533\" xmlns=\"http://www.w3.org/2000/svg\" width=\"981.4921875\" id=\"diagramF08\">\u003cstyle>#diagramF08{font-family:PingFang SC,Microsoft YaHei,Arial,sans-serif;font-size:17px;fill:#172c40;}#diagramF08 .error-icon{fill:#ffffff;}#diagramF08 .error-text{fill:#000000;stroke:#000000;}#diagramF08 .edge-thickness-normal{stroke-width:2px;}#diagramF08 .edge-thickness-thick{stroke-width:3.5px;}#diagramF08 .edge-pattern-solid{stroke-dasharray:0;}#diagramF08 .edge-pattern-dashed{stroke-dasharray:3;}#diagramF08 .edge-pattern-dotted{stroke-dasharray:2;}#diagramF08 .marker{fill:#617387;stroke:#617387;}#diagramF08 .marker.cross{stroke:#617387;}#diagramF08 svg{font-family:PingFang SC,Microsoft YaHei,Arial,sans-serif;font-size:17px;}#diagramF08 .label{font-family:PingFang SC,Microsoft YaHei,Arial,sans-serif;color:#172c40;}#diagramF08 .cluster-label text{fill:#000000;}#diagramF08 .cluster-label span,#diagramF08 p{color:#000000;}#diagramF08 .label text,#diagramF08 span,#diagramF08 p{fill:#172c40;color:#172c40;}#diagramF08 .node rect,#diagramF08 .node circle,#diagramF08 .node ellipse,#diagramF08 .node polygon,#diagramF08 .node path{fill:#eef4fb;stroke:#607c99;stroke-width:1px;}#diagramF08 .flowchart-label text{text-anchor:middle;}#diagramF08 .node .katex path{fill:#000;stroke:#000;stroke-width:1px;}#diagramF08 .node .label{text-align:center;}#diagramF08 .node.clickable{cursor:pointer;}#diagramF08 .arrowheadPath{fill:#0b0b0b;}#diagramF08 .edgePath .path{stroke:#617387;stroke-width:2.0px;}#diagramF08 .flowchart-link{stroke:#617387;fill:none;}#diagramF08 .edgeLabel{background-color:#f5f8fb;text-align:center;}#diagramF08 .edgeLabel rect{opacity:0.5;background-color:#f5f8fb;fill:#f5f8fb;}#diagramF08 .labelBkg{background-color:rgba(245, 248, 251, 0.5);}#diagramF08 .cluster rect{fill:#f7f9fc;stroke:#bccbd9;stroke-width:1px;}#diagramF08 .cluster text{fill:#000000;}#diagramF08 .cluster span,#diagramF08 p{color:#000000;}#diagramF08 div.mermaidTooltip{position:absolute;text-align:center;max-width:200px;padding:2px;font-family:PingFang SC,Microsoft YaHei,Arial,sans-serif;font-size:12px;background:#ffffff;border:1px solid hsl(0, 0%, 90%);border-radius:2px;pointer-events:none;z-index:100;}#diagramF08 .flowchartTitleText{text-anchor:middle;font-size:18px;fill:#172c40;}#diagramF08 :root{--mermaid-font-family:PingFang SC,Microsoft YaHei,Arial,sans-serif;}\u00 l 已选择| J[组合层核对会话任务 M09保存选择]\n    G -->|记忆| I[按范围采用 M09保存采用记录及引用版本]\n    J --> I","context":"\u003cp>\u003cstrong>职责：\u003c/strong>按用户与空间管理独立版本的记忆和 Skill，核对适用范围、依赖、验证和替代关系。会话删除不自动删除已独立保存资产，来源显示已删除且不可读回正文；个人聊天不直接修改公共定义。\u003c/p>\n\u003cp>\u003cstrong>私有数据：\u003c/strong>\u003ccode>personal_assets\u003c/code>、\u003ccode>personal_asset_versions\u003c/code>、\u003ccode>personal_memory_index_jobs\u003c/code>、来源/知识依赖、替代关系、资产验证、Skill 选择与采用记录。记忆保存原话与整理后修正、错误反例、范围/例外、来源任务及依据；Skill 保存名称、说明、参数、步骤、输出要求和依赖。选择前由组合层向 M05 / M06 核对会话/任务归属；选择与采用由 M09 独占保存，M05 / M06 只引用记录 ID。\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>公开操作\u003c/th>\u003cth>输入\u003c/th>\u003cth>输出\u003c/th>\u003cth>错误、副作用与幂等\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ccode>read_assets\u003c/code> / \u003ccode>list_assets\u003c/code>\u003c/td>\u003ctd>可信归属、ID/版本或类型/游标、管理/采用用途\u003c/td>\u003ctd>资产正文、范围、依赖及状态\u003c/td>\u003ctd>只读；管理页可读自己的停用项，采用读取排除停用/删除项；跨用户统一不可用\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>find_related\u003c/code>\u003c/td>\u003ctd>可信归属、对象、问题范围、最新版本条件\u003c/td>\u003ctd>明确关联的最新记忆/Skill 候选\u003c/td>\u003ctd>只读；索引滞后时补查，候选不代表已采用\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>save_memory_in_tx\u003c/code>\u003c/td>\u003ctd>明确纠错/记住请求、范围、原话、整理值、依据\u003c/td>\u003ctd>个人记忆版本、索引意图、可告知的保存范围\u003c/td>\u003ctd>\u003ccode>scope_incomplete\u003c/code> 可保存待核对线索；“仅本次”不写长期记忆；失败不告知已记住\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>save_skill_in_tx\u003c/code>\u003c/td>\u003ctd>用户保存/编辑请求、草稿、名称/参数/依赖、起点版本\u003c/td>\u003ctd>草稿或启用版本、索引意图\u003c/td>\u003ctd>用户保存/启用；已有清楚保存请求可直接保存，不强制改名或编辑；不执行任意用户脚本；稳定操作幂等\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>check_applicability\u003c/code>\u003c/td>\u003ctd>当前资产、任务条件、已回源依赖/授权结果\u003c/td>\u003ctd>可用线索、冲突、需复核或不可用\u003c/td>\u003ctd>只读；未验证记忆仅作检查线索，依赖变化不得悄悄沿用旧定义\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>select_skill_in_tx\u003c/code>\u003c/td>\u003ctd>宿主确认的用户选择、Skill ID/版本、组合层核对的会话/任务归属及条件\u003c/td>\u003ctd>选择记录 ID、固定版本、适用性结果\u003c/td>\u003ctd>\u003ccode>not_available\u003c/code> / \u003ccode>version_conflict\u003c/code> / \u003ccode>not_applicable\u003c/code> / \u003ccode>idempotency_conflict\u003c/code>；按用户与操作保存含会话的请求指纹和原回执，异参拒绝；同参重传不重新激活已改版/停用的旧选择\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>load_selected_skill\u003c/code>\u003c/td>\u003ctd>宿主保存的用户选择、当前启用版本、适用性结果\u003c/td>\u003ctd>本次方法正文及固定引用版本\u003c/td>\u003ctd>\u003ccode>selection_required\u003c/code> / \u003ccode>version_conflict\u003c/code>；推荐不构成选择，模型不能伪造用户选用\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>record_adoption_in_tx\u003c/code>\u003c/td>\u003ctd>实际采用的资产/依赖版本、运行与任务引用、范围/采用方式、Skill 选择记录（如有）\u003c/td>\u003ctd>采用记录 ID 与引用版本\u003c/td>\u003ctd>记忆线索与执行方法分别标明；Skill 无有效选择拒绝；同运行/操作重传不重复记录\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>revise_or_replace_in_tx\u003c/code>\u003c/td>\u003ctd>起点版本、修订值或替代关系、依据\u003c/td>\u003ctd>新版本、旧项替代状态、待办\u003c/td>\u003ctd>不静默合并不同范围；共享语义修正通过组合层另走 M02 维护权限\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>change_asset_status_in_tx\u003c/code>\u003c/td>\u003ctd>起点版本、启用/停用/删除\u003c/td>\u003ctd>新状态、索引及上下文失效意图\u003c/td>\u003ctd>归属与版本必查；停用/删除立即阻止后续采用，派生清理异步且可追踪\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>2026-10-06选择Mem0 OSS 2.2.1作为正式提取/检索适配器。MySQL保留正式正文与版本；Mem0/Milvus保存待提交及已提交向量，SQLite保存技术回执与SDK历史。Skill 正文兼容 \u003ccode>SKILL.md\u003c/code>，M11 使用经宿主核对的正文，不通过任意路径读取或默认资源发现加载。\u003c/p>\n\u003cp>自动保存/修订时，组合用例将Mem0最终正文同时绑定为\u003ccode>body\u003c/code>与\u003ccode>scope\u003c/code>，\u003ccode>name\u003c/code>取该正文前40个Unicode字符。范围保留整段限定，不另调模型压缩或让Pi追加别名；完整原话另存\u003ccode>source_text\u003c/code>，临时要求由提取排除。builtin模型替身的最终正文也遵守相同绑定。人工\u003ccode>POST /assets\u003c/code>继续按用户显式编辑保存名称/范围；已有版本不会被后台悄悄重写。\u003c/p>\n\u003ch3>正式Mem0接缝（同源契约）\u003c/h3>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>接口\u003c/th>\u003cth>输入与输出\u003c/th>\u003cth>约束\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ccode>POST /extract\u003c/code>\u003c/td>\u003ctd>\u003ccode>MemoryExtractionRequest → MemoryExtractionReceipt\u003c/code>：稳定operation、宿主归属、完整消息与引用、预算绑定 → 正文及replayed\u003c/td>\u003ctd>保存前调用；pending不可检索；同操作同指纹接回，未知不重新提取\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>POST /index\u003c/code>\u003c/td>\u003ctd>\u003ccode>MemoryIndexRequest → MemoryIndexReceipt\u003c/code>：正式资产快照、版本、提取operation（可空）→ ready/removed/superseded\u003c/td>\u003ctd>有提取回执时提交现成向量；人工正文直接embedding；旧版本不覆盖新版本\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>POST /search\u003c/code>\u003c/td>\u003ctd>\u003ccode>MemorySearchRequest → MemorySearchReceipt\u003c/code>：宿主归属、问题、预算 → asset_id/version候选与bounded\u003c/td>\u003ctd>过滤ready后排序，最多200候选；Rust按当前权限/版本/状态/依赖回源\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>POST /internal/memory/model-calls\u003c/code>\u003c/td>\u003ctd>\u003ccode>MemoryModelCall\u003c/code>：issue/finalize、调用ID、用途、上限、usage\u003c/td>\u003ctd>内部token；M08逐调用许可和结算；run或索引作业还原原预算\u003c/td>\u003c/tr>\u003ctr>\u003ctd>现有\u003ccode>GET /assets\u003c/code>\u003c/td>\u003ctd>Asset新增可选\u003ccode>memory_index_state\u003c/code>\u003c/td>\u003ctd>queued/issued/indexed/failed/superseded，正式保存与索引完成分开显示\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>以上Schema位于\u003ccode>packages/contracts/schema.json\u003c/code>；Rust入口记在OpenAPI。侧车路由只监听回环并使用内部token，浏览器不能传用户ID调用。\u003ccode>personal_memory\u003c/code>用例组合M09、M08和有效性校验；\u003ccode>memory_provider\u003c/code>薄接缝转换HTTP，不复制SDK算法。\u003c/p>\n\u003cp>\u003ccode>personal_memory_index_jobs\u003c/code>私属M09，与资产同事务写入；Worker在独立循环按目标集合领取，租约180秒、最多3次。只有明确暂时不可用可重试同任务；未知保留，不换ID补额。领取后的新embedding许可再次核对正式启用版本和依赖，结算不要求旧运行仍有效。资产先保存、索引后提交；UI暴露进度与失败。\u003c/p>\n\u003cp>存量/重建每批最多32条，从正式正文排队，使用明确维护profile。目标集合绑定数据库；新集合保留旧队列与账本，旧目标不会被当前Worker领取。SQLite回执目录跟随数据库与集合持久保存，服务互斥启动。索引丢失后按开发文档切换新集合重建，不重置收费历史。\u003c/p>","svg":"\u003csvg aria-roledescription=\"flowchart-v2\" role=\"graphics-document document\" viewBox=\"-8 -8 688.0625 1908\" height=\"1908\" xmlns=\"http://www.w3.org/2000/svg\" width=\"688.0625\" id=\"diagramF09\">\u00 397\" class=\"node default default flowchart-label\">\u003crect height=\"46\" width=\"175\" y=\"-23\" x=\"-87.5\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\">\u003c/rect>\u003cg transform=\"translate(0, -12)\" style=\"\" class=\"label\">\u003crect>\u003c/rect>\u003ctext style=\"\">\u003ctspan class=\"row\" x=\"0\" dy=\"1em\" xml:space=\"preserve\">保存失败或停止原因\u003c/tspan>\u003c/text>\u003c/g>\u003c/g>\u003c/g>\u003c/g>\u003c/g>\u003c/svg>"},{"id":"F11","module":"M11","name":"M11 pi-bridge：Node 与 Pi","heading":"F11 Pi 桥内部流程","filename":"implementation-views.md","source":"flowchart LR\n  A[\"校验运行交付\"] --> Storage{\"检查点存储形式\"}\n  Storage -->|小引用| Open[\"校验文件 / 原 session / 精确 leaf\"]\n  Storage -->|旧 inline 绑定| Read[\"只读获取不可变副本\u003cbr/>核对指纹并一次性迁入 JSONL\"]\n  Open & Read --> B[\"沿保存 leaf 恢复 SDK 与原工具回执\"]\n  B --> C[\"每次模型请求申请并消费许可\"]\n  C --> D[\"Pi 模型与工具循环\"]\n  D -->|调用工具| E[\"Rust 受控工具 / 原 operation_id\"]\n  E --> C\n  D -->|输出| F[\"带序号追加片段\"]\n  F --> Sync[\"SDK 会话文件 fsync\u003cbr/>导出精确 leaf 小引用\"]\n  Sync --> G[\"finish_run 原子提交正文与引用\"]\n  Open & Read -->|缺失 / 损坏 / 指纹不符| H[\"停止新调用，报告真实状态\"]\n  C -->|拒绝 / 未知| H\n  D -->|取消 / 中断| H","context":"\u003cp>桥接固定 SDK 的注册、恢复、事件和取消；业务身份由 M01 产生并由 Rust 绑定。首次工具登记由宿主分配稳定 \u003ccode>operation_id\u003c/code>，持久映射到 \u003ccode>origin_run_id / sdk_tool_call_id\u003c/code>；恢复包携带该映射以接回原调用与结果。新的 \u003ccode>run_id / lease_epoch\u003c/code> 校验当前运行权，恢复不改变原副作用身份。M11 复用 Pi 原生 JSONL 会话存储，恢复包只保存版本、文件名、原 session 与精确 leaf/authority；业务授权仍由 Rust 判断。\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>操作\u003c/th>\u003cth>输入\u003c/th>\u003cth>输出\u003c/th>\u003cth>错误\u003c/th>\u003cth>副作用\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ccode>resume_and_deliver\u003c/code>\u003c/td>\u003ctd>运行/代次、事件、任务条件、允许上下文、工具清单、恢复包\u003c/td>\u003ctd>接收状态 / 运行标识\u003c/td>\u003ctd>版本不支持、运行冲突、恢复失败\u003c/td>\u003ctd>恢复 Pi；不自行创建业务任务\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>invoke_tool\u003c/code> → Rust\u003c/td>\u003ctd>当前运行/代次、宿主绑定 operation_id、origin_run_id / sdk_tool_call_id、工具及参数指纹\u003c/td>\u003ctd>原操作结果 / 处理中 / 未知\u003c/td>\u003ctd>权限、旧版本、映射不符、同 ID 异参\u003c/td>\u003ctd>Rust 按原 operation_id 接回或执行；新运行不能重置副作用身份\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>send_model_attempt\u003c/code>\u003c/td>\u003ctd>原预算引用、调用指纹、输入/输出上界\u003c/td>\u003ctd>响应 / 用量 / 未知\u003c/td>\u003ctd>额度不足、许可过期、超时\u003c/td>\u003ctd>向 M08 申请并消费许可后发一次请求；SDK 重试也受控\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>append_output\u003c/code> → Rust\u003c/td>\u003ctd>output_id、attempt_id、chunk_seq、代次、片段\u003c/td>\u003ctd>接收进度 / 缺口\u003c/td>\u003ctd>旧代次、片段冲突\u003c/td>\u003ctd>保存可重连片段；不代表最终提交\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>finish_run\u003c/code> → Rust\u003c/td>\u003ctd>最终输出、恢复包、消费进度、代次\u003c/td>\u003ctd>原提交 / 已提交\u003c/td>\u003ctd>旧代次、缺片、持久化失败\u003c/td>\u003ctd>Rust 原子提交并释放 M05 租约；不伪造查询终态\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>cancel_run\u003c/code>\u003c/td>\u003ctd>运行 ID、代次\u003c/td>\u003ctd>已接收 / 当前模型状态\u003c/td>\u003ctd>运行不存在、旧代次\u003c/td>\u003ctd>停止模型；平台取消由 M07 单独处理\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>","svg":"\u003csvg aria-roledescription=\"flowchart-v2\" role=\"graphics-document document\" viewBox=\"-8 -8 2688.640625 324.25\" height=\"324.25\" xmlns=\"http://www.w3.org/2000/svg\" width=\"2688.640625\" id=\"diagramF11\">\u003cstyle>#diagramF11{font-family:PingFang SC,Microsoft YaHei,Arial,sans-serif;font-size:17px;fill:#172c40;}#diagramF11 .error-icon{fill:#ffffff;}#diagramF11 .error-text{fill:#000000;stroke:#000000;}#diagramF11 .edge-thickness-normal{stroke-width:2px;}#diagramF11 .edge-thickness-thick{stroke-width:3.5px;}#diagramF11 .edge-pattern-solid{stroke-dasharray:0;}#diagramF11 .edge-pattern-dashed{stroke-dasharray:3;}#diagramF11 .edge-pattern-dotted{stroke-dasharray:2;}#diagramF11 .marker{fill:#617387;stroke:#617387;}#diagramF11 .marker.cross{stroke:#617387;}#diagramF11 svg{font-family:PingFang SC,Microsoft YaHei,Arial,sans-serif;fo 本\"]\n  D & E --> F{\"服务端结果\"}\n  F -->|接收| G[\"跟随 SSE 更新\"]\n  F -->|冲突 / 拒绝| H[\"保留输入，展示原因与当前版本\"]\n  G --> B\n  G -->|断线| I[\"按游标重连，必要时取快照\"]\n  I --> B","context":"\u003cp>只保存输入草稿、页面选择等界面状态；服务端状态经 HTTP 与可重连 SSE 更新。主入口沿用工作台、我的积累、语义管理；身份、确认可执行性和资源归属以 Rust 返回为准。\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>操作\u003c/th>\u003cth>输入\u003c/th>\u003cth>输出\u003c/th>\u003cth>错误\u003c/th>\u003cth>副作用\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ccode>load_workspace\u003c/code>\u003c/td>\u003ctd>登录会话、会话/任务或资源 ID\u003c/td>\u003ctd>有权查看的快照与版本\u003c/td>\u003ctd>无权限、不存在、结果过期\u003c/td>\u003ctd>更新视图；不自报用户身份\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>submit_message\u003c/code>\u003c/td>\u003ctd>会话、稳定 message_id、正文/澄清引用\u003c/td>\u003ctd>已接收消息 / 当前阻塞状态\u003c/td>\u003ctd>ID 异参、无权限、服务失败\u003c/td>\u003ctd>服务端持久化成功后标记已发送\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>confirm_query\u003c/code>\u003c/td>\u003ctd>已展示请求 ID、草稿版本、客户端确认 ID\u003c/td>\u003ctd>同一查询 ID / 当前状态\u003c/td>\u003ctd>message_pending、版本冲突、无权限\u003c/td>\u003ctd>由真实用户操作触发；不附替换 SQL、不自动重确认\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>cancel_task\u003c/code>\u003c/td>\u003ctd>任务 ID、命令 ID\u003c/td>\u003ctd>任务停止与各关联查询取消状态\u003c/td>\u003ctd>无权限、已终止、服务失败\u003c/td>\u003ctd>停止该任务后续推进；展示各查询真实状态\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>cancel_query\u003c/code>\u003c/td>\u003ctd>查询 ID、命令 ID\u003c/td>\u003ctd>该查询的取消接收结果与真实状态\u003c/td>\u003ctd>无权限、已终止、不支持、服务失败\u003c/td>\u003ctd>只取消指定查询，不取消整个分析任务；不先宣布成功\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>save_resource\u003c/code> / \u003ccode>select_skill\u003c/code>\u003c/td>\u003ctd>资源 ID、base_version、补丁；或 Skill 版本/任务\u003c/td>\u003ctd>新版本与索引状态 / 选择记录\u003c/td>\u003ctd>冲突、停用、范围不符\u003c/td>\u003ctd>通过服务端保存；Skill 推荐不自动采用\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>consume_events\u003c/code>\u003c/td>\u003ctd>会话、上次 event_seq\u003c/td>\u003ctd>追加/替换输出与新游标\u003c/td>\u003ctd>缺片、需快照、连接中断\u003c/td>\u003ctd>去重；缺历史时取快照，不拼接两次半段回答\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>show_result\u003c/code> / \u003ccode>export_csv\u003c/code>\u003c/td>\u003ctd>查询引用、已获数据范围\u003c/td>\u003ctd>表格、图表、CSV\u003c/td>\u003ctd>过期、无权限、数据未齐\u003c/td>\u003ctd>明示分页、截断和来源；导出不扩大范围\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>","svg":"\u003csvg aria-roledescription=\"flowchart-v2\" role=\"graphics-document document\" viewBox=\"-8 -8 1930.015625 317.25\" height=\"317.25\" xmlns=\"http://www.w3.org/2000/svg\" width=\"1930.015625\" id=\"diagramF12\">\u003cstyle>#diagramF12{font-family:PingFang SC,Microsoft YaHei,Arial,sans-serif;font-size:17px;fill:#172c40;}#diagramF12 .error-icon{fill:#ffffff;}#diagramF12 .error-text{fill:#000000;stroke:#000000;}#diagramF12 .edge-thickness-normal{stroke-width:2px;}#diagramF12 .edge-thickness-thick{stroke-width:3.5px;}#diagramF12 .edge-pattern-solid{stroke-dasharray:0;}#diagramF12 .edge-pattern-dashed{stroke-dasharray:3;}#diagramF12 .edge-pattern-dotted{stroke-dasharray:2;}#diagramF12 .marker{fill:#617387;stroke:#617387;}#diagramF12 .marker.cross{stroke:#617387;}#diagramF12 svg{font-family:PingFang SC,Microsoft YaHei,Arial,sans-serif;font-size:17px;}#diagramF12 .label{font-family:PingFang SC,Microsoft YaHei,Arial,sans-serif;color:#172c40;}#diagramF12 .cluster-label text{fill:#000000;}#diagramF12 .cluster-label span,#diagramF12 p{color:#000000;}#diagramF12 .label text,#diagramF12 span,#diagramF12 p{fill:#172c40;color:#172c40;}#diagramF12 .node rect,#diagramF12 .node circle,#diagramF12 .node ellipse,#diagramF12 .node polygon,#diagramF12 .node path{fill:#eef4fb;stroke:#607c99;stroke-width:1px;}#diagramF12 .flowchart-label text{text-anchor:middle;}#diagramF12 .node .katex path{fill:#000;stroke:#000;stroke-width:1px;}#diagramF12 .node .label{text-align:center;}#diagramF12 .node.clickable{cursor:pointer;}#diagramF12 .arrowheadPath{fill:#0b0b0b;}#diagramF12 .edgePath .path{stroke:#617387;stroke-width:2.0px;}#diagramF12 .flowchart-link{stroke:#617387;fill:none;}#diagramF12 eLine0\" y2=\"1659\" x2=\"1070\" y1=\"1659\" x1=\"76\">\u003c/line>\u003ctext style=\"font-family: &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, Arial, sans-serif; font-size: 16px; font-weight: 400;\" dy=\"1em\" class=\"messageText\" alignment-baseline=\"middle\" dominant-baseline=\"middle\" text-anchor=\"middle\" y=\"1674\" x=\"768\">embed_payload 取得问句向量 无许可则关键词降级\u003c/text>\u003cline style=\"fill: none;\" marker-end=\"url(#arrowhead)\" stroke=\"none\" stroke-width=\"2\" class=\"messageLine0\" y2=\"1713\" x2=\"1460\" y1=\"1713\" x1=\"76\">\u003c/line>\u003ctext style=\"font-family: &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, Arial, sans-serif; font-size: 16px; font-weight: 400;\" dy=\"1em\" class=\"messageText\" alignment-baseline=\"middle\" dominant-baseline=\"middle\" text-anchor=\"middle\" y=\"1775\" x=\"768\">search_candidates(问题 向量 权限范围 内部续取位置)\u003c/text>\u003cline style=\"fill: none;\" marker-end=\"url(#arrowhead)\" stroke=\"none\" stroke-width=\"2\" class=\"messageLine0\" y2=\"1814\" x2=\"1460\" y1=\"1814\" x1=\"76\">\u003c/line>\u003ctext style=\"font-family: &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, Arial, sans-serif; font-size: 16px; font-weight: 400;\" dy=\"1em\" class=\"messageText\" alignment-baseline=\"middle\" dominant-baseline=\"middle\" text-anchor=\"middle\" y=\"1829\" x=\"771\">候选 ID / 版本 / 通道耗尽及续取位置\u003c/text>\u003cline style=\"stroke-dasharray: 3, 3; fill: none;\" marker-end=\"url(#arrowhead)\" stroke=\"none\" stroke-width=\"2\" class=\"messageLine1\" y2=\"1868\" x2=\"79\" y1=\"1868\" x1=\"1463\">\u003c/line>\u003ctext style=\"font-family: &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, Arial, sans-serif; font-size: 16px; font-weight: 400;\" dy=\"1em\" class=\"messageText\" alignment-baseline=\"middle\" dominant-baseline=\"middle\" text-anchor=\"middle\" y=\"1883\" x=\"281\">当前版本回源 精确和更新项补查\u003c/text>\u003cline style=\"fill: none;\" marker-end=\"url(#arrowhead)\" stroke=\"none\" stroke-width=\"2\" class=\"messageLine0\" y2=\"1922\" x2=\"485\" y1=\"1922\" x1=\"76\">\u003c/line>\u003ctext style=\"font-family: &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, Arial, sans-serif; font-size: 16px; font-weight: 400;\" dy=\"1em\" class=\"messageText\" alignment-baseline=\"middle\" dominant-baseline=\"middle\" text-anchor=\"middle\" y=\"1937\" x=\"378\">核对权限 端点范围 有效状态及引用\u003c/text>\u003cline style=\"fill: none;\" marker-end=\"url(#arrowhead)\" stroke=\"none\" stroke-width=\"2\" class=\"messageLine0\" y2=\"1976\" x2=\"680\" y1=\"1976\" x1=\"76\">\u003c/line>\u003ctext style=\"font-family: &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, Arial, sans-serif; font-size: 16px; font-weight: 400;\" dy=\"1em\" class=\"messageText\" alignment-baseline=\"middle\" dominant-baseline=\"middle\" text-anchor=\"middle\" y=\"2053\" x=\"671\">仅交付允许内容 固定依据版本与覆盖状态\u003c/text>\u003cline style=\"stroke-dasharray: 3, 3; fill: none;\" marker-end=\"url(#arrowhead)\" stroke=\"none\" stroke-width=\"2\" class=\"messageLine1\" y2=\"2092\" x2=\"1265\" y1=\"2092\" x1=\"76\">\u003c/line>\u003c/svg>"},{"id":"S01","module":"M01","name":"M01 access：身份、权限与模型资料范围","heading":"S01 模块内部结构","filename":"knowledge-modules.md","source":"flowchart LR\n    Identity[可信身份解析] --> Scope[对象与动作范围判断]\n    Identity -.-> IdentityPort[IdentityPort\u003cbr/>身份来源接口]\n    Scope --> Local[本系统语义维护授权\u003cbr/>逐表负责人 / 超级维护者]\n    Scope -.-> AccessPort[AccessPolicyPort\u003cbr/>Datasight资料与查询执行权限]\n    Local --> Delivery[模型资料裁剪\u003cbr/>上下文引用复核]\n    AccessPort --> Delivery\n    Delivery --> Store[(私有 store.rs\u003cbr/>策略版本与有效缓存)]\n    Local --> Store\n    Changes[策略变更与失效管理] --> Store","context":"\u003cp>\u003cstrong>职责：\u003c/strong>验证可信身份，分别校验本系统语义维护权限、平台数据权限和个人资源归属，再核对具体模型端点可接收的资料范围。目录读取、来源 SQL、文档、字段样例和结果分别判断；目录可见不等于查询可执行。平台权限适配器表达实际授权与未知能力，M01 不自建数仓权限平台。\u003c/p>\n\u003cp>\u003cstrong>私有数据：\u003c/strong>身份映射、空间与平台授权映射、端点资料策略及版本、必要的权限缓存/失效标识；只保存凭据引用。\u003ccode>semantic_ownership\u003c/code> 保存对象归属与授权版本，\u003ccode>semantic_owner_operations\u003c/code> 保存独立指派回执；超级维护者来自可信启动配置，不能用平台执行权限推导。会话/资产归属和对象分类由各所属模块通过组合层提供，M01 不读取其私有表。\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>公开操作\u003c/th>\u003cth>输入\u003c/th>\u003cth>输出\u003c/th>\u003cth>错误、副作用与幂等\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ccode>resolve_principal\u003c/code>\u003c/td>\u003ctd>已验证登录凭证或受信服务调用、维护配置版本\u003c/td>\u003ctd>区分用户/服务主体的可信 \u003ccode>AccessContext\u003c/code>\u003c/td>\u003ctd>\u003ccode>unauthenticated\u003c/code> / \u003ccode>identity_unavailable\u003c/code>；服务范围受配置限制；处理用户请求的后台作业仍引用原用户授权，作业执行身份另存；模拟身份只在开发模式启用\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>authorize_action\u003c/code>\u003c/td>\u003ctd>可信上下文、动作、对象描述/归属、目标\u003c/td>\u003ctd>限定动作与版本的授权决定\u003c/td>\u003ctd>对外 \u003ccode>not_available\u003c/code> / \u003ccode>policy_unavailable\u003c/code>，内部细分拒绝与缺失；只读；缓存不能越过有效期或撤权代次\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>derive_search_scope\u003c/code>\u003c/td>\u003ctd>空间、资源类型、任务范围\u003c/td>\u003ctd>可下推的过滤条件、权限版本\u003c/td>\u003ctd>服务未知则明确失败；过滤条件只是候选范围，不替代逐项回源检查\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>filter_for_delivery\u003c/code>\u003c/td>\u003ctd>当前资料描述与引用、接收方 \u003ccode>user/model\u003c/code>、端点策略\u003c/td>\u003ctd>允许字段/片段及可见来源\u003c/td>\u003ctd>不输出被拒条目；端点限制不能退化为用户可读即允许外发；只读\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>check_context_refs\u003c/code>\u003c/td>\u003ctd>恢复/输出将用到的引用与权限版本\u003c/td>\u003ctd>\u003ccode>valid\u003c/code> 或内部失效引用集合\u003c/td>\u003ctd>查证失败不得继续发送相关内容；无状态修改，组合层决定重建或暂停\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>record_policy_change_in_tx\u003c/code>\u003c/td>\u003ctd>经宿主验证的策略变更、起点版本\u003c/td>\u003ctd>新策略版本、上下文失效意图\u003c/td>\u003ctd>版本冲突或权限不足拒绝；原子更新本模块策略；相同操作幂等\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>M01 的授权决定只在受信 Rust 内部流转；携带主体、动作、范围、资源/策略版本和有效期。组合层在事务内核对本地版本，在事务外按平台能力查证；平台不能提供稳定快照时保守重查，不能承诺跨系统原子撤权。\u003c/p>\n\u003ch3>2.1 两类权限分别校验\u003c/h3>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>动作\u003c/th>\u003cth>权限依据\u003c/th>\u003cth>限制\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>编辑正式语义、接受/驳回已提交建议\u003c/td>\u003ctd>本系统的表负责人关系，或超级维护者角色\u003c/td>\u003ctd>逐对象在事务内核验；录入人/最后修改人不自动取得维护权\u003c/td>\u003c/tr>\u003ctr>\u003ctd>读取平台资料、查询数据、执行 SQL、读取结果\u003c/td>\u003ctd>Datasight 当前用户及动作授权\u003c/td>\u003ctd>系统语义角色不能放大权限；SQL 仍绑定用户确认版本\u003c/td>\u003c/tr>\u003ctr>\u003ctd>读取聊天、个人记忆或 Skill\u003c/td>\u003ctd>本人、空间与资产状态\u003c/td>\u003ctd>超级维护者角色不提供他人私有内容访问权\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>表和字段按所属表授权。跨表共用指标/文档的维护归属须明确，引用关系不传播编辑权。维护时如需查询数据，分别通过两类动作的检查。表/字段负责人通过平台目录同步；共用对象由超级维护者独立指定；超级角色按空间在启动配置中提供，不增加权限服务。\u003c/p>\n\u003cp>\u003ccode>authorize_maintainer\u003c/code> 现在校验可信配置的空间超级维护者，用于创建、同步和全局索引维护；\u003ccode>authorize_semantic_in_tx\u003c/code> 对对象负责人或超级维护者授权。M01 只读取自己的授权表，平台表身份按 namespace + id 匹配，引用关系不传播权限。未配置负责人只允许超级维护者维护。\u003c/p>","svg":"\u003csvg aria-roledescription=\"flowchart-v2\" role=\"graphics-document document\" viewBox=\"-8 -8 1155.515625 248.5\" height=\"248.5\" xmlns=\"http://www.w3.org/2000/svg\" width=\"1155.515625\" id=\"diagramS01\">\u003cstyle>#diagramS01{font-family:PingFang SC,Microsoft YaHei,Arial,sans-serif;font-size:17px;fill:#172c40;}#diagramS01 .error-icon{fill:#ffffff;}#diagramS01 .error-text{fill:#000000;stroke:#000000;}#diagramS01 .edge-thickness-normal{stroke-width:2px;}#diagramS01 .edge-thickness-thick{stroke-width:3.5px;}#diagramS01 .edge-pattern-solid{stroke-dasharray:0;}#diagramS01 .edge-pattern-dashed{stroke-dasharray:3;}#diagramS01 .edge-pattern-dotted{stroke-dasharray:2;}#diagramS01 .marker{fill:#617387;stroke:#617387;}#diagramS01 .marker.cross{stroke:#617387;}#diagramS01 svg{font-family:PingFang SC,Microsoft YaHei,Arial,sans-serif;font-size:17px;}#diagramS01 .label{font-family:PingFang SC,Microsoft YaHei,Arial,sans-serif;color:#172c40;}#diagramS01 .cluster-label text{fill:#000000;}#diagramS01 .cluster-label span,#diagramS01 p{color:#000000;}#diagramS01 .l l:space=\"preserve\">\u003c/tspan>\u003c/text>\u003c/g>\u003c/g>\u003cg class=\"edgeLabel\">\u003cg transform=\"translate(0, 0)\" class=\"label\">\u003crect height=\"0\" width=\"0\" ry=\"0\" rx=\"0\">\u003c/rect>\u003ctext style=\"\">\u003ctspan class=\"row\" x=\"0\" dy=\"1em\" xml:space=\"preserve\">\u003c/tspan>\u003c/text>\u003c/g>\u003c/g>\u003cg class=\"edgeLabel\">\u003cg transform=\"translate(0, 0)\" class=\"label\">\u003crect height=\"0\" width=\"0\" ry=\"0\" rx=\"0\">\u003c/rect>\u003ctext style=\"\">\u003ctspan class=\"row\" x=\"0\" dy=\"1em\" xml:space=\"preserve\">\u003c/tspan>\u003c/text>\u003c/g>\u003c/g>\u003c/g>\u003cg class=\"nodes\">\u003cg transform=\"translate(62, 115.25)\" data-id=\"Identity\" data-node=\"true\" id=\"flowchart-Identity-449\" class=\"node default default flowchart-label\">\u003crect height=\"46\" width=\"124\" y=\"-23\" x=\"-62\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\">\u003c/rect>\u003cg transform=\"translate(0, -12)\" style=\"\" class=\"label\">\u003crect>\u003c/rect>\u003ctext style=\"\">\u003ctspan class=\"row\" x=\"0\" dy=\"1em\" xml:space=\"preserve\">可信身份解析\u003c/tspan>\u003c/text>\u003c/g>\u003c/g>\u003cg transform=\"translate(271.5, 70.5)\" data-id=\"Scope\" data-node=\"true\" id=\"flowchart-Scope-450\" class=\"node default default flowchart-label\">\u003crect height=\"46\" width=\"175\" y=\"-23\" x=\"-87.5\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\">\u003c/rect>\u003cg transform=\"translate(0, -12)\" style=\"\" class=\"label\">\u003crect>\u003c/rect>\u003ctext style=\"\">\u003ctspan class=\"row\" x=\"0\" dy=\"1em\" xml:space=\"preserve\">对象与动作范围判断\u003c/tspan>\u003c/text>\u003c/g>\u003c/g>\u003cg transform=\"translate(271.5, 160)\" data-id=\"IdentityPort\" data-node=\"true\" id=\"flowchart-IdentityPort-452\" class=\"node default default flowchart-label\">\u003crect height=\"63\" width=\"124\" y=\"-31.5\" x=\"-62\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\">\u003c/rect>\u003cg transform=\"translate(0, -20.5)\" style=\"\" class=\"label\">\u003crect>\u003c/rect>\u003ctext style=\"\">\u003ctspan class=\"row\" x=\"0\" dy=\"1em\" xml:space=\"preserve\">IdentityPort\u003c/tspan>\u003ctspan class=\"row\" x=\"0\" dy=\"1em\" xml:space=\"preserve\">身份来源接口\u003c/tspan>\u003c/text>\u003c/g>\u003c/g>\u003cg transform=\"translate(544.2578125, 31.5)\" data-id=\"Local\" data-node=\"true\" id=\"flowchart-Local-454\" class=\"node default default flowchart-label\">\u003crect height=\"63\" width=\"211.828125\" y=\"-31.5\" x=\"-105.9140625\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\">\u003c/rect>\u003cg transform=\"translate(0, -20.5)\" style=\"\" class=\"label\">\u003crect>\u003c/rect>\u003ctext style=\"\">\u003ctspan class=\"row\" x=\"0\" dy=\"1em\" xml:space=\"preserve\">本系统语义维护授权\u003c/tspan>\u003ctspan class=\"row\" x=\"0\" dy=\"1em\" xml:space=\"preserve\">逐表负责人 / 超级维护者\u003c/tspan>\u003c/text>\u003c/g>\u003c/g>\u003cg transform=\"translate(544.2578125, 129.5)\" data-id=\"AccessPort\" data-node=\"true\" id=\"flowchart-AccessPort-456\" class=\"node default default flowchart-label\">\u003crect height=\"63\" width=\"250.515625\" y=\"-31.5\" x=\"-125.2578125\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\">\u003c/rect>\u003cg transform=\"translate(0, -20.5)\" style=\"\" class=\"label\">\u003crect>\u003c/rect>\u003ctext style=\"\">\u003ctspan class=\"row\" x=\"0\" dy=\"1em\" xml:space=\"preserve\">AccessPolicyPort\u003c/tspan>\u003ctspan class=\"row\" x=\"0\" dy=\"1em\" xml:space=\"preserve\">Datasight资料与查询执行权限\u003c/tspan>\u003c/text>\u003c/g>\u003c/g>\u003cg transform=\"translate(817.015625, 41)\" data-id=\"Delivery\" data-node=\"true\" id=\"flowchart-Delivery-458\" class=\"node default default flowchart-label\">\u003crect height=\"63\" width=\"141\" y=\"-31.5\" x=\"-70.5\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\">\u003c/rect>\u003cg transform=\"translate(0, -20.5)\" style=\"\" class=\"label\">\u003crect>\u003c/rect>\u003ctext style=\"\">\u003ctspan class=\"row\" x=\"0\" dy=\"1em\" xml:space=\"preserve\">模型资料裁剪\u003c/tspan>\u003ctspan class=\"row\" x=\"0\" dy=\"1em\" xml:space=\"preserve\">上下文引用复核\u003c/tspan>\u003c/text>\u003c/g>\u003c/g>\u003cg transform=\"translate(1052.015625, 100)\" data-id=\"Store\" data-node=\"true\" id=\"flowchart-Store-462\" class=\"node default default flowchart-label\">\u003cpath transform=\"translate(-87.5,-53.37500000000001)\" d=\"M 0,14.583333333333334 a 87.5,14.583333333333334 0,0,0 175 0 a 87.5,14.583333333333334 0,0,0 -175 0 l 0,77.58333333333334 a 87.5,14.583333333333334 0,0,0 175 0 l 0,-77.58333333333334\" style=\"\">\u003c/path>\u003cg transform=\"translate(0, -20.5)\" style=\"\" class=\"label\">\u003crect>\u003c/rect>\u003ctext style=\"\">\u003ctspan class=\"row\" x=\"0\" dy=\"1em\" xml:space=\"preserve\">私有 store.rs\u003c/tspan>\u003ctspan class=\"row\" x=\"0\" dy=\"1em\" xml:space=\"preserve\">策略版本与有效缓存\u003c/tspan>\u003c/text>\u003c/g>\u003c/g>\u003cg transform=\"translate(817.015625, 209.5)\" data-id=\"Changes\" data-node=\"true\" id=\"flowchart-Changes-465\" class=\"node default default flowchart-label\">\u003crect height=\"46\" width=\"175\" y=\"-23\" x=\"-87.5\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\">\u003c/rect>\u003cg transform=\"translate(0, -12)\" style=\"\" class=\"label\">\u003crect>\u003c/rect>\u003ctext style=\"\">\u003ctspan class=\"row\" x=\"0\" dy=\"1em\" xml:space=\"preserve\">策略变更与失效管理\u003c/tspan>\u003c/text>\u003c/g>\u003c/g>\u003c/g>\u003c/g>\u003c/g>\u003c/svg>"},{"id":"S02","module":"M02","name":"M02 knowledge：正式语义、文档与依据","heading":"S02 模块内部结构","filename":"knowledge-modules.md","source":"flowchart LR\n    Edit[编辑与预填入口] --> Merge[条目合并\u003cbr/>来源分层与人工保护]\n    Docs[正文 章节与关联校验] --> Merge\n    Merge --> Versions[版本 有效性与验证状态]\n    Versions --> Store[(私有 store.rs\u003cbr/>正式版本 引用及独立建议)]\n    Evidence[依据与依赖读取] --> Store\n    Proposal[本人修改建议\u003cbr/>独立状态与私有范围] --> Store\n    Proposal --> Shared[明确提交的可共享建议]\n    Shared --> Decision[负责人 / 超级维护者处理\u003cbr/>接受或驳回]\n    Decision --> Store\n    Decision -.->|接受后核对 编辑并明确保存| Edit\n    Versions --> Intents[索引与依赖复核意图]","context":"\u003cp>\u003cstrong>职责：\u003c/strong>维护表、字段/取值、指标、查询关联、业务术语/规则、经验证案例、文档/章节和主题；管理立即生效的版本、条目来源、人工覆盖、待复核项与依赖。生产血缘事实和可用查询关联保留不同类型，不能由前者自动推出可 JOIN。\u003c/p>\n\u003cp>\u003cstrong>私有数据：\u003c/strong>\u003ccode>knowledge_objects\u003c/code>、不可变 \u003ccode>knowledge_versions\u003c/code>、\u003ccode>knowledge_references\u003c/code>、条目编辑/验证记录、文档章节与关联，以及独立的 \u003ccode>semantic_change_proposals\u003c/code>。原始平台快照归 M03；本模块按稳定来源 ID、版本和 SQL/章节位置引用。建议记录不参与正式正文或检索索引。物理表随增量落地，不按对象类型复制业务服务。\u003c/p>\n\u003ch3>3.1 条目级语义\u003c/h3>\n\u003cp>每个可编辑字段、规则、指标子项、文档条目有稳定 \u003ccode>entry_id/path\u003c/code>，独立保存以下内容；不能只给整张表打“人工修改”标记。\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>内容\u003c/th>\u003cth>保存与更新规则\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ccode>source_facts\u003c/code>\u003c/td>\u003ctd>来源事实值、来源版本/原文位置、解析器版本、获取完整性；未解析 SQL 留缺口，不捏造事实\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>model_suggestion\u003c/code>\u003c/td>\u003ctd>建议值、模型/输入版本、来源、生成时间与不确定项；不得标记为人工确认\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>human_override\u003c/code>\u003c/td>\u003ctd>人工值、操作者、时间、起点版本与修改路径；重新预填必须保留，清除覆盖需显式编辑操作\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>effective_value\u003c/code>\u003c/td>\u003ctd>有人工覆盖时采用人工值，否则按条目类型采用可用事实/建议；同时返回出处和冲突，事实与业务定义冲突不自动裁决\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>review_state\u003c/code> / \u003ccode>validation\u003c/code>\u003c/td>\u003ctd>待复核原因、受影响依赖、验证方式/范围/版本与结果；启用、人工修改、业务验证分别记录\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>文档完整正文有版本，章节有稳定标识。关联可指向表、字段、指标或主题及特定章节；文档改名不换 ID，章节删改产生明确的断开/替代引用。仅有链接保存 \u003ccode>body_unavailable\u003c/code>，不会假装正文已获取。文档权限与所关联对象分别检查，引用不授予权限。\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>公开操作\u003c/th>\u003cth>输入\u003c/th>\u003cth>输出\u003c/th>\u003cth>错误、副作用与幂等\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ccode>create_object_in_tx\u003c/code>\u003c/td>\u003ctd>对象类型、稳定创建/来源键、首版正文/事实、来源引用及当前来源证明；不传 \u003ccode>base_version\u003c/code>\u003c/td>\u003ctd>新对象 ID、版本 1、依赖与索引意图\u003c/td>\u003ctd>校验维护权限或限定维护配置；创建键唯一；同操作重传返回原记录，其他同键创建返回 \u003ccode>already_exists\u003c/code>，不隐式覆盖\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>read_objects\u003c/code>\u003c/td>\u003ctd>空间、对象/版本引用、所需字段\u003c/td>\u003ctd>内部版本正文、状态、依赖与资料描述\u003c/td>\u003ctd>批量只读；不附未经授权的外部可见错误详情；组合层随后做 M01 校验\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>find_exact\u003c/code>\u003c/td>\u003ctd>空间、类型、名称/别名、有限查询范围\u003c/td>\u003ctd>当前对象候选 ID/版本\u003c/td>\u003ctd>只读；为精确定位和索引滞后补查提供正式数据\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>read_evidence\u003c/code>\u003c/td>\u003ctd>对象版本、条目/章节、邻接范围\u003c/td>\u003ctd>依据引用、必要相邻段落、缺口\u003c/td>\u003ctd>引用断开显式保留；来源正文由组合层另向 M03 读取和授权\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>find_dependents\u003c/code>\u003c/td>\u003ctd>来源/对象版本、变化路径\u003c/td>\u003ctd>受影响条目及引用集合\u003c/td>\u003ctd>只读、可分页；不直接修改其他模块的依赖状态\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>mark_dependencies_changed_in_tx\u003c/code>\u003c/td>\u003ctd>可靠变化及当前受影响条目、起点版本\u003c/td>\u003ctd>新版本中的待复核项、索引/上下文失效意图\u003c/td>\u003ctd>来源快照提交时同步标记，模型未完成前旧依据不继续显示为已核实；保留人工值\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>save_edit_in_tx\u003c/code>\u003c/td>\u003ctd>已授权编辑、起点版本、条目补丁/清除覆盖\u003c/td>\u003ctd>新知识版本、差异、索引及依赖复核意图\u003c/td>\u003ctd>\u003ccode>version_conflict\u003c/code> / \u003ccode>invalid_definition\u003c/code>；清除后无来源/建议时有效正文为空字符串，历史版本保留；提交前校验完整对象，失败不落库；不自动变成业务验证通过\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>save_document_in_tx\u003c/code>\u003c/td>\u003ctd>正文/链接、章节、关联、起点版本\u003c/td>\u003ctd>新文档版本、有效/断开引用及待办\u003c/td>\u003ctd>关联结构不合法则拒绝；改版保留人工文字、标记受影响规则需复核\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>apply_prefill_in_tx\u003c/code>\u003c/td>\u003ctd>结构化预填、来源/输入版本、组合层取得的当前来源证明、条目起点版本\u003c/td>\u003ctd>合并后新版本、保留人工项、冲突/缺口\u003c/td>\u003ctd>来源已变返回 \u003ccode>stale_source\u003c/code>；并发人工改动先重新合并，绝不盲写旧建议\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>record_validation_in_tx\u003c/code>\u003c/td>\u003ctd>条目及依赖版本、检查范围、证据、结论\u003c/td>\u003ctd>新版本或对应验证记录、待办\u003c/td>\u003ctd>\u003ccode>version_conflict\u003c/code> / \u003ccode>invalid_evidence\u003c/code>；SQL 可执行不等于口径验证通过\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>change_status_in_tx\u003c/code>\u003c/td>\u003ctd>对象、起点版本、停用/恢复/删除原因\u003c/td>\u003ctd>当前状态、新版本、索引/上下文失效意图\u003c/td>\u003ctd>有权维护者操作；关联不级联删除其他对象；重复操作返回原回执\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>save_change_proposal_in_tx\u003c/code>\u003c/td>\u003ctd>可信用户、可读目标/基版本、补丁/来源/原任务/私有标记；修改另带建议 ID 与预期修订\u003c/td>\u003ctd>本人建议 ID、\u003ccode>open\u003c/code> 状态及保存回执\u003c/td>\u003ctd>\u003ccode>propose_semantic_change\u003c/code> 仅调用此操作；只创建或修订本人的开放建议，不写正式版本；不要求维护权，不接受不可读目标\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>read_change_proposals\u003c/code>\u003c/td>\u003ctd>用户主体、本人建议 ID或目标/游标\u003c/td>\u003ctd>本人可读的建议、基版本、状态与差异\u003c/td>\u003ctd>当前只读本人建议；第 3.3 节另增受控提交后的负责人读取，不能直接移除 owner 过滤\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>apply_change_proposal_in_tx\u003c/code>\u003c/td>\u003ctd>维护者本人明确保存、本人建议 ID、预期建议修订、当前知识基版本、最终补丁/公共来源\u003c/td>\u003ctd>已生效知识版本、\u003ccode>applied\u003c/code> 建议回执、索引/依赖意图\u003c/td>\u003ctd>重用 \u003ccode>save_edit_in_tx\u003c/code> 规则；知识版本和建议状态同事务；过期基版返回冲突，未授权模型请求不能进入本操作\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>dismiss_change_proposal_in_tx\u003c/code>\u003c/td>\u003ctd>本人建议 ID、预期修订、放弃原因\u003c/td>\u003ctd>\u003ccode>dismissed\u003c/code> 回执\u003c/td>\u003ctd>只关闭建议；不更改正式知识，重复命令幂等\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>删除对象后保留必要的引用断开状态，相关规则/案例/Skill 通过组合层标记需复核。精确历史保留/物理清理范围在实际部署策略中确定；不得向用户承诺未经实现的彻底清除。\u003c/p>\n\u003ch3>3.2 首次创建与同步新条目\u003c/h3>\n\u003cp>维护页面读取表的字段、指标、文档和关系时，通过现有 \u003ccode>GET /knowledge?related_id=&lt;id&gt;&amp;after_id=&lt;cursor&gt;\u003c/code> 单独分页，每页最多100项。先检查目标可读，再按空间、当前非删除记录和直接关联查询；与 \u003ccode>q\u003c/code> 检索参数互斥。目录首页或前30条搜索结果不能作为关联内容的全集，界面独立提供“加载更多关联内容”。该读取复用M02存储边界，不进入Agent检索路径。\u003c/p>\n\u003cp>• 稳定来源键为 \u003ccode>(space_id, source_namespace, platform_object_id, object_kind, stable_subobject_id?)\u003c/code>；字段等子对象由 M03 保存稳定映射，不能仅按显示名称匹配。人工条目使用 \u003ccode>source_namespace=manual\u003c/code> 与宿主分配/客户端重传保持不变的创建 ID。创建键和对象 ID 分离，改名不换对象，删除后同键也不自动复活。\u003c/p>\n\u003cp>• \u003ccode>create_object_in_tx\u003c/code> 以唯一键和“不存在”条件创建版本 1，无虚构 \u003ccode>base_version=0\u003c/code>。首次创建同时保存来源/父对象/已知依赖引用；结构仍有缺口时明确保存未知与待补项。文档首版复用相同创建入口及正文/章节校验，后续编辑才使用版本校验。\u003c/p>\n\u003cp>• 新来源同步在保存可靠快照的同一小批事务中，通过 M02 创建最小正式对象、版本 1 和来源依赖，再由 M10 登记预填/索引任务。不能只对既有依赖调用 \u003ccode>find_dependents\u003c/code>，否则新表/字段永远没有知识入口。创建返回 \u003ccode>already_exists\u003c/code> 时回读对应对象/当前版本，按既有对象走变化标记与版本化预填，不把整个批次判为失败或当作创建覆盖；已有对象若已删除/停用则保留该状态，不自动恢复。\u003c/p>\n\u003ch3>3.3 语义修改建议到维护保存\u003c/h3>\n\u003cp>\u003cstrong>当前实现：\u003c/strong>\u003ccode>propose_semantic_change\u003c/code> 保存本人私人建议，记录对象、条目、基版本、建议值、理由和公共依据。\u003ccode>semantic_change_proposals\u003c/code> 列表和兼容采用仍按 \u003ccode>owner_id + space_id\u003c/code> 限定本人。新 \u003ccode>semantic_corrections\u003c/code> 只接收用户明确确认的共享提交；不复制聊天或个人资产。预填 \u003ccode>model_suggestion\u003c/code>、私人提案和正式版本分别保存。\u003c/p>\n\u003cp>\u003cstrong>协作流程：\u003c/strong>A 提出纠错，B 是目标表的语义负责人。B 或超级维护者可驳回，或接受后核对、编辑并保存。接受不直接套用模型补丁；不需要 A 先获得维护权。新流程替代旧版“仅提出者本人维护采用”的产品限制；已有私人记录继续保留原范围。\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>阶段\u003c/th>\u003cth>谁可以操作\u003c/th>\u003cth>正式语义与共享召回\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>本人草稿\u003c/td>\u003ctd>A 与其受控 Agent 整理内容\u003c/td>\u003ctd>不变；不进入负责人列表或共享召回\u003c/td>\u003c/tr>\u003ctr>\u003ctd>提交为待处理建议\u003c/td>\u003ctd>A 提交明确可共享的修改与依据\u003c/td>\u003ctd>不变；A、目标负责人及超级维护者可按当前权限读取提交内容\u003c/td>\u003c/tr>\u003ctr>\u003ctd>驳回\u003c/td>\u003ctd>B 或超级维护者说明原因\u003c/td>\u003ctd>不变；保留处理人、理由和记录，A 可查看\u003c/td>\u003c/tr>\u003ctr>\u003ctd>接受待修改\u003c/td>\u003ctd>B 或超级维护者接受建议\u003c/td>\u003ctd>不变；尚无新的正式版本\u003c/td>\u003c/tr>\u003ctr>\u003ctd>编辑并保存生效\u003c/td>\u003ctd>B 或超级维护者核对并保存最终内容\u003c/td>\u003ctd>新正式版本生效，登记索引及依赖复核待办\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>读取建议仍检查当前对象/资料权限；建议访问权不打开 A 的私人原文或结果。普通第三人不因同空间而取得建议内容。已提交建议保留独立内容与修订记录，后续修改不能悄悄替换已审核内容；存量 \u003ccode>open\u003c/code> 记录不能批量当作已提交建议公开。\u003c/p>\n\u003cp>正式保存复用 \u003ccode>save_edit_in_tx\u003c/code>，重新校验本系统维护范围、建议修订、知识基版本、依赖及共享依据。基版本已变则保留原建议和差异，要求重新核对最终补丁；权限收回则拒绝保存。用同一事务保存正式新版本、建议实际采用内容/生效版本、操作回执和待办；重复命令接回原回执，失败不标“已生效”。已有私人来源不自动进入公共正文或出处。\u003c/p>\n\u003cp>仅处理本次 SQL 时无需等待建议审核；生成新版 SQL、用户确认及 Datasight 查询校验沿用既有路径。Mem0 继续处理本人记忆，建议处理结果不静默更改个人资产。共享检索只采用正式版本；待处理、已接受和已驳回建议均不作为正式知识召回。\u003c/p>\n\u003ch3>3.4 数据与接口边界\u003c/h3>\n\u003cp>本节列出本轮实施边界。跨语言请求及错误在 \u003ccode>packages/contracts\u003c/code> 定义，本文不维护另一套可执行 Schema。\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>归属\u003c/th>\u003cth>实施内容\u003c/th>\u003cth>保持的边界\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>M01\u003c/td>\u003ctd>本系统表负责人关系、超级维护者角色及授权版本；按对象/动作校验\u003c/td>\u003ctd>与 Datasight 权限独立，不保存一份数仓授权替代品\u003c/td>\u003c/tr>\u003ctr>\u003ctd>M02\u003c/td>\u003ctd>建议的提交内容、原值/建议值/依据、提交状态与修订；接受/驳回记录、处理人/原因；最终补丁及生效版本\u003c/td>\u003ctd>提出者、负责人和实际编辑人分别记录；私人原任务引用不作为共享阅读入口\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Rust 具名用例\u003c/td>\u003ctd>提交建议、列出本人/负责范围建议、接受或驳回、关联建议保存正式编辑\u003c/td>\u003ctd>身份由宿主绑定，服务器检查当前对象归属；受控 Agent 工具不发布正式语义\u003c/td>\u003c/tr>\u003ctr>\u003ctd>M12\u003c/td>\u003ctd>在现有语义页展示负责人、建议与状态；预览共享内容；接受、驳回理由、编辑保存及冲突差异\u003c/td>\u003ctd>不另建审批应用，界面状态以服务端为准\u003c/td>\u003c/tr>\u003ctr>\u003ctd>M10 / M04\u003c/td>\u003ctd>正式保存后的既有索引与依赖复核待办\u003c/td>\u003ctd>仅接受建议不触发正式知识索引；索引失败显示滞后\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>M01 的 \u003ccode>semantic_ownership\u003c/code> 保存对象→授权对象→负责人的关系及版本。表负责人来自 Datasight mock，字段指向所属表；共用对象指向自身，只有超级维护者可单独指派。M02 的 \u003ccode>semantic_corrections\u003c/code> 与 \u003ccode>semantic_correction_operations\u003c/code> 保存共享内容、处理状态和幂等回执；历史私人表不迁移成公开记录。\u003ccode>created_by\u003c/code> 从首版记录保留，\u003ccode>updated_by\u003c/code> 只表示最后编辑者。平台维护人变更以最近一次成功同步为准，正式平台 ACL 尚未接入。\u003c/p>\n\u003cp>先锁授权快照，再锁来源/知识与建议；目标和依据知识按 ID 排序。接受不写知识，正式保存复用 M02 \u003ccode>save_edit_in_tx\u003c/code> 和 \u003ccode>knowledge_index_jobs\u003c/code>，复用既有 Worker 检索索引链路，不新增审批进程。\u003c/p>\n\u003cp>合成来源的空授权登记单独幂等提交，不授予维护权；随后以新事务同步来源、正式知识和索引待办，避免提前固定旧快照。权威目录移除先按序撤维护权，取得来源锁后重核当前缺失集合和来源基线，再停用对象；任一步失败均回滚该事务。\u003c/p>","svg":"\u003csvg aria-roledescription=\"flowchart-v2\" role=\"graphics-document document\" viewBox=\"-8 -8 1932.515625 266.6000061035156\" height=\"266.6000061035156\" xmlns=\"http://www.w3.org/2000/svg\" width=\"1932.515625\" id=\"diagramS02\">\u003cstyle>#diagramS02{font-family:PingFang SC,Microsoft YaHei,Arial,sans-serif;font-size:17px;fill:#172c40;}#diagramS02 .error-icon{fill:#ffffff;}#diagramS02 .error-text{fill:#000000;stroke:#000000;}#diagramS02 .edge-thickness-normal{stroke-width:2px;}#diagramS02 .edge-thickness-thick{stroke-width:3.5px;}#diagramS02 .edge-pattern-solid{stroke-dasharray:0;}#diagramS02 .edge-pattern-dashed{stroke-dasharray:3;}#diagramS02 .edge-pattern-dotted{stroke-dasharray:2;}#diagramS02 .marker{fill:#617387;stroke:#617387;}#diagramS02 .marker.cross{stroke:#617387;}#diagramS02 svg{font-family:PingFang SC,Microsoft YaHei,Arial,sans-serif;font-size:17px;}#diagramS02 .label{font-family:PingFang SC,Microsoft YaHei,Arial,sans-serif;color:#172c40;}#diagramS02 .cluster-label text{fill:#000000;}#diagramS02 .cluster-label span,#diagramS02 p{color:#000000;}#diagramS02 .label text,#diagramS02 span,#diagramS02 p{fill:#172c40;color:#172c40;}#diagramS02 .node rect,#diagramS02 .node circle,#diagramS02 .node ellipse,#diagramS02 .node polygon,#diagramS02 .node path{fill:#eef4fb;stroke:#607c99;stroke-width:1px;}#diagramS02 .flowchart-label text{text-anchor:middle;}#diagramS02 .node .katex path{fill:#000;stroke:#000;stroke-width:1px;}#diagramS02 .node .label{text-align:center;}#diagramS02 .node.cl =\"row\" x=\"0\" dy=\"1em\" xml:space=\"preserve\">编辑与预填入口\u003c/tspan>\u003c/text>\u003c/g>\u003c/g>\u003cg transform=\"translate(1296.671875, 63.5)\" data-id=\"Merge\" data-node=\"true\" id=\"flowchart-Merge-468\" class=\"node default default flowchart-label\">\u003crect height=\"63\" width=\"175\" y=\"-31.5\" x=\"-87.5\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\">\u003c/rect>\u003cg transform=\"translate(0, -20.5)\" style=\"\" class=\"label\">\u003crect>\u003c/rect>\u003ctext style=\"\">\u003ctspan class=\"row\" x=\"0\" dy=\"1em\" xml:space=\"preserve\">条目合并\u003c/tspan>\u003ctspan class=\"row\" x=\"0\" dy=\"1em\" xml:space=\"preserve\">来源分层与人工保护\u003c/tspan>\u003c/text>\u003c/g>\u003c/g>\u003cg transform=\"translate(1058.8359375, 120.0999584197998)\" data-id=\"Docs\" data-node=\"true\" id=\"flowchart-Docs-469\" class=\"node default default flowchart-label\">\u003crect height=\"46\" width=\"180.671875\" y=\"-23\" x=\"-90.3359375\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\">\u003c/rect>\u003cg transform=\"translate(0, -12)\" style=\"\" class=\"label\">\u003crect>\u003c/rect>\u003ctext style=\"\">\u003ctspan class=\"row\" x=\"0\" dy=\"1em\" xml:space=\"preserve\">正文 章节与关联校验\u003c/tspan>\u003c/text>\u003c/g>\u003c/g>\u003cg transform=\"translate(1543.0078125, 63.5)\" data-id=\"Versions\" data-node=\"true\" id=\"flowchart-Versions-472\" class=\"node default default flowchart-label\">\u003crect height=\"46\" width=\"197.671875\" y=\"-23\" x=\"-98.8359375\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\">\u003c/rect>\u003cg transform=\"translate(0, -12)\" style=\"\" class=\"label\">\u003crect>\u003c/rect>\u003ctext style=\"\">\u003ctspan class=\"row\" x=\"0\" dy=\"1em\" xml:space=\"preserve\">版本 有效性与验证状态\u003c/tspan>\u003c/text>\u003c/g>\u003c/g>\u003cg transform=\"translate(1809.1796875, 185.8499584197998)\" data-id=\"Store\" data-node=\"true\" id=\"flowchart-Store-474\" class=\"node default default flowchart-label\">\u003cpath transform=\"translate(-107.3359375,-55.1999171995032)\" d=\"M 0,15.799944799668799 a 107.3359375,15.799944799668799 0,0,0 214.671875 0 a 107.3359375,15.799944799668799 0,0,0 -214.671875 0 l 0,78.7999447996688 a 107.3359375,15.799944799668799 0,0,0 214.671875 0 l 0,-78.7999447996688\" style=\"\">\u003c/path>\u003cg transform=\"translate(0, -20.5)\" style=\"\" class=\"label\">\u003crect>\u003c/rect>\u003ctext style=\"\">\u003ctspan class=\"row\" x=\"0\" dy=\"1em\" xml:space=\"preserve\">私有 store.rs\u003c/tspan>\u003ctspan class=\"row\" x=\"0\" dy=\"1em\" xml:space=\"preserve\">正式版本 引用及独立建议\u003c/tspan>\u003c/text>\u003c/g>\u003c/g>\u003cg transform=\"translate(1543.0078125, 160.5999584197998)\" data-id=\"Evidence\" data-node=\"true\" id=\"flowchart-Evidence-475\" class=\"node default default flowchart-label\">\u003crect height=\"46\" width=\"141\" y=\"-23\" x=\"-70.5\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\">\u003c/rect>\u003cg transform=\"translate(0, -12)\" style=\"\" class=\"label\">\u003crect>\u003c/rect>\u003ctext style=\"\">\u003ctspan class=\"row\" x=\"0\" dy=\"1em\" xml:space=\"preserve\">依据与依赖读取\u003c/tspan>\u003c/text>\u003c/g>\u003c/g>\u003cg transform=\"translate(87.5, 158.75)\" data-id=\"Proposal\" data-node=\"true\" id=\"flowchart-Proposal-477\" class=\"node default default flowchart-label\">\u003crect height=\"63\" width=\"175\" y=\"-31.5\" x=\"-87.5\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\">\u003c/rect>\u003cg transform=\"translate(0, -20.5)\" style=\"\" class=\"label\">\u003crect>\u003c/rect>\u003ctext style=\"\">\u003ctspan class=\"row\" x=\"0\" dy=\"1em\" xml:space=\"preserve\">本人修改建议\u003c/tspan>\u003ctspan class=\"row\" x=\"0\" dy=\"1em\" xml:space=\"preserve\">独立状态与私有范围\u003c/tspan>\u003c/text>\u003c/g>\u003c/g>\u003cg transform=\"translate(331, 129.25)\" data-id=\"Shared\" data-node=\"true\" id=\"flowchart-Shared-480\" class=\"node default default flowchart-label\">\u003crect height=\"46\" width=\"192\" y=\"-23\" x=\"-96\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\">\u003c/rect>\u003cg transform=\"translate(0, -12)\" style=\"\" class=\"label\">\u003crect>\u003c/rect>\u003ctext style=\"\">\u003ctspan class=\"row\" x=\"0\" dy=\"1em\" xml:space=\"preserve\">明确提交的可共享建议\u003c/tspan>\u003c/text>\u003c/g>\u003c/g>\u003cg transform=\"translate(592.9140625, 129.25)\" data-id=\"Decision\" data-node=\"true\" id=\"flowchart-Decision-482\" class=\"node default default flowchart-label\">\u003crect height=\"63\" width=\"211.828125\" y=\"-31.5\" x=\"-105.9140625\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\">\u003c/rect>\u003cg transform=\"translate(0, -20.5)\" style=\"\" class=\"label\">\u003crect>\u003c/rect>\u003ctext style=\"\">\u003ctspan class=\"row\" x=\"0\" dy=\"1em\" xml:space=\"preserve\">负责人 / 超级维护者处理\u003c/tspan>\u003ctspan class=\"row\" x=\"0\" dy=\"1em\" xml:space=\"preserve\">接受或驳回\u003c/tspan>\u003c/text>\u003c/g>\u003c/g>\u003cg transform=\"translate(1809.1796875, 53.5)\" data-id=\"Intents\" data-node=\"true\" id=\"flowchart-Intents-488\" class=\"node default default flowchart-label\">\u003crect height=\"46\" width=\"175\" y=\"-23\" x=\"-87.5\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\">\u003c/rect>\u003cg transform=\"translate(0, -12)\" style=\"\" class=\"label\">\u003crect>\u003c/rect>\u003ctext style=\"\">\u003ctspan class=\"row\" x=\"0\" dy=\"1em\" xml:space=\"preserve\">索引与依赖复核意图\u003c/tspan>\u003c/text>\u003c/g>\u003c/g>\u003c/g>\u003c/g>\u003c/g>\u003c/svg>"},{"id":"S03","module":"M03","name":"M03 ingestion：来源同步与增量预填","heading":"S03 模块内部结构","filename":"knowledge-modules.md","source":"flowchart LR\n    Sync[同步完整性与来源头CAS] -.-> SourcePort[SourcePort\u003cbr/>目录与原始资料读取]\n    Sync --> Store[(私有 store.rs\u003cbr/>采集基线 来源头 快照及预填)]\n    Facts[确定事实解析] --> Store\n    Preference[常用范围与队列优先级] --> Store\n    Input[预填输入与有界调用] --> Facts\n    Input -.-> ModelPort[PrefillModelPort\u003cbr/>有界分析与依据复核]\n    Validate[建议结构与来源校验] --> Store\n    ModelPort -.->|结构化结果| Validate","context":"\u003cp>\u003cstrong>职责：\u003c/strong>完整导入可获取目录、DDL、血缘和加工 SQL，保留快照与同步范围；解析确定事实，构造预填输入并校验模型结果。全空间先基础预填并可检索，常用表优先深入分析，其余按需补齐；常用范围由维护者指定，不假设平台有热度接口。\u003c/p>\n\u003cp>\u003cstrong>私有数据：\u003c/strong>\u003ccode>source_snapshots\u003c/code>、\u003ccode>source_heads\u003c/code>、同步批次/游标及采集前基线、平台对象稳定映射、来源变化、解析结果、预填尝试与输入指纹。原文不可被模型建议覆盖；没有完整同步或可靠删除事件不能把本次缺席对象判定已删除。\u003c/p>\n\u003cp>常用范围由M03的\u003ccode>table_analysis_preferences\u003c/code>维护：空间及稳定知识表ID、独立配置版本、是否常用及操作者；\u003ccode>analysis_preference_operations\u003c/code>保存命令指纹和原回执。配置不改变知识正文版本。\u003ccode>set_table_analysis_preference\u003c/code>组合用例先核对维护权限、表对象可读及配置版本，再原子保存配置、调整该表/字段尚未领取的队列优先级，并为启用范围的当前版本幂等排队。已领取的调用继续沿用原身份与预算，关闭常用不删除知识或撤回已发送调用。\u003c/p>\n\u003cp>首次导入所有表/字段立即生成基础事实并进入目录与索引，只有常用范围自动排深入分析；普通表通过\u003ccode>request_prefill\u003c/code>按需分析。来源改版仍为所有受影响对象自动排重分析（D05），不能受常用开关阻断。领取按常用优先、再按创建时间排序。知识管理读取返回当前\u003ccode>analysis_preference\u003c/code>及现有\u003ccode>prefill_status\u003c/code>；历史知识版本不混入当前维护配置。没有配置记录时返回默认非优先、配置版本1，首次修改在事务内以唯一键建立默认行并校验该起点。\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>公开操作\u003c/th>\u003cth>输入\u003c/th>\u003cth>输出\u003c/th>\u003cth>错误、副作用与幂等\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ccode>begin_source_read_in_tx\u003c/code>\u003c/td>\u003ctd>已授权的本批来源范围、稳定批次 ID\u003c/td>\u003ctd>已持久化 \u003ccode>read_token\u003c/code>，含范围内采集前的来源头修订/不存在基线\u003c/td>\u003ctd>网络读取前短事务完成；同批次重传返回原基线；新采集须新批次，不把旧载荷改绑新基线\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>fetch_source_batch\u003c/code>\u003c/td>\u003ctd>已授权空间/来源、游标、能力与大小限制\u003c/td>\u003ctd>来源片段、版本、完整性、下一游标\u003c/td>\u003ctd>事务外平台读取；\u003ccode>source_unavailable\u003c/code> / \u003ccode>unsupported_capability\u003c/code>；不以空批次伪装成功\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>save_snapshot_in_tx\u003c/code>\u003c/td>\u003ctd>\u003ccode>read_token\u003c/code>、来源稳定键、采集版本/指纹、结果、当前作业代次\u003c/td>\u003ctd>快照引用、\u003ccode>head_advanced / unchanged / historical_only\u003c/code>、变化路径/待办\u003c/td>\u003ctd>锁来源头并比较采集前 \u003ccode>expected_head_revision\u003c/code>；CAS 冲突返回 \u003ccode>source_head_conflict\u003c/code> 和 \u003ccode>historical_only\u003c/code>，不触发当前知识更新；同载荷重传幂等\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>read_source_snapshot\u003c/code>\u003c/td>\u003ctd>来源版本、位置/大小限制\u003c/td>\u003ctd>原文片段、原始元数据与完整性\u003c/td>\u003ctd>只读；仅返回内部内容，组合层做读者与端点范围检查\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>check_source_heads_in_tx\u003c/code>\u003c/td>\u003ctd>预填引用的来源版本\u003c/td>\u003ctd>本事务当前来源版本证明\u003c/td>\u003ctd>\u003ccode>stale_source\u003c/code>；只读并锁定相应来源头，防止校验后被并发同步更新\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>parse_facts\u003c/code>\u003c/td>\u003ctd>固定快照、方言/解析版本、限额\u003c/td>\u003ctd>可定位事实、未解析片段及缺口\u003c/td>\u003ctd>无持久副作用；不执行加工 SQL；循环/深度上限给具体缺口\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>prepare_prefill\u003c/code>\u003c/td>\u003ctd>变化路径、M02 依赖查询结果、已授权必要资料、固定维护预算范围\u003c/td>\u003ctd>固定输入版本与预算范围的预填请求、受影响条目\u003c/td>\u003ctd>缺正文/上游保留缺口；不直接调用其他业务模块，不决定公共口径\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>read_analysis_preference_in_tx\u003c/code>\u003c/td>\u003ctd>可读表或字段对象、空间\u003c/td>\u003ctd>当前常用范围及配置版本；字段继承所属表\u003c/td>\u003ctd>只读，不改变知识正文；其他对象不附表级设置\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>save_analysis_preference_in_tx\u003c/code>\u003c/td>\u003ctd>稳定表ID、是否常用、配置起点版本、命令ID\u003c/td>\u003ctd>配置回执及是否发生变化\u003c/td>\u003ctd>维护权限由组合层核对；同命令同参数返回原回执，改参数冲突；调整未领取任务优先级，启用后由组合层登记表及字段分析\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>run_prefill\u003c/code>\u003c/td>\u003ctd>预填请求、组合层取得的 M08 单次调用许可\u003c/td>\u003ctd>\u003ccode>PrefillModelPort\u003c/code> 返回的结构化建议或未知/失败\u003c/td>\u003ctd>事务外固定分析、依据复核各一次；两次分别取原维护范围许可并结算；复核失败不应用分析草稿；\u003ccode>budget_unavailable\u003c/code> 时保留事实等待补充；实际重试须新许可并扣原范围\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>validate_prefill_result\u003c/code>\u003c/td>\u003ctd>模型结构化建议、原输入与来源版本\u003c/td>\u003ctd>合法条目建议、依据与冲突\u003c/td>\u003ctd>\u003ccode>invalid_prefill\u003c/code> / \u003ccode>stale_source\u003c/code>；逐个覆盖本次语义目标，拒绝空结果、遗漏/重复/多余条目及DDL/ETL/type；解释可留空但须有明确缺口和引用，不沿用旧建议冒充成功；拒绝不存在的来源/路径，不把推测升格为事实\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>record_prefill_in_tx\u003c/code>\u003c/td>\u003ctd>输入指纹、结果/失败、当前领取代次\u003c/td>\u003ctd>尝试记录及提交知识的意图\u003c/td>\u003ctd>旧代次拒绝；稳定操作幂等，M02 正式版本由组合层另行提交\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>来源头保存本地 \u003ccode>head_revision\u003c/code>、当前快照引用及可用的平台单调版本。采集前基线以本批范围的数据库快照为准，新键使用当时确认不存在的基线；读取后才发现的新键不能先读取最新头再把旧采集结果当成新结果写入。回写只在起点仍匹配时推进来源头并递增修订；平台提供可靠单调版本时还须拒绝倒退版本，不能用采集结束时间或字符串大小猜顺序。\u003c/p>\n\u003cp>两个独立同步作业即使租约都有效，也必须通过上述来源头 CAS。失败可保留旧快照作历史，当前来源头、知识变化和待办均不改变；需要继续时重新捕获基线并重新读取平台，禁止仅替换 \u003ccode>expected_head_revision\u003c/code> 重交同一旧载荷。相同内容无需换头；部分失败、未完成分页不推进完整同步标记，也不推断删除。CAS 保证本地采集竞争不回退，不承诺平台自身返回了全局一致快照。\u003c/p>\n\u003cp>\u003cstrong>当前实施：\u003c/strong>M03 通过所属 \u003ccode>PrefillModelPort\u003c/code> 适配器做固定两次结构化维护调用（分析及依据复核），不创建聊天会话或第二个 Agent 循环。原生提交工具携带同源 \u003ccode>PrefillResult\u003c/code> 参数Schema；只接收一次完整同名工具参数作为建议，截断、坏身份和坏结构均拒绝，不执行模型声明的业务副作用。DeepSeek思考模式使用auto工具选择，off可指定提交工具，原profile与持久预算保持一致。所有实际模型调用（含预填、Embedding）取得 M08 许可；预算范围区分 \u003ccode>user_request\u003c/code> 与 \u003ccode>maintenance\u003c/code>。自动来源变化只引用维护配置已限定的范围，不自建额度；未配置时保留同步事实并等待模型补充。当前使用明确配置及持久账本，真实模型结果与本地回环分别验收。\u003c/p>\n\u003cp>当前组合操作：\u003ccode>prefill_materials::collect_in_tx\u003c/code> 组装有界材料；\u003ccode>knowledge_sources::read_in_tx/versions_in_tx/assert_in_tx\u003c/code>统一原始来源与M02文档版本检查；\u003ccode>knowledge::related_documents_in_tx\u003c/code>查直接关联和相关表的字段专属文档。它们不允许跨模块访问私有存储。资料限额、目录冻结时机及模型正文投影详见[实现设计](implementation-design.md#语义材料与实际上下文依赖)。\u003c/p>","svg":"\u003csvg aria-roledescription=\"flowchart-v2\" role=\"graphics-document document\" viewBox=\"-8 -8 1077.625 352.7814025878906\" height=\"352.7814025878906\" xmlns=\"http://www.w3.org/2000/svg\" width=\"1077.625\" id=\"diagramS03\">\u003cstyle>#diagramS03{font-family:PingFang SC,Microsoft YaHei,Arial,sans-serif;font-size:17px;fill:#172c40;}#dia \"\">\u003ctspan class=\"row\" x=\"0\" dy=\"1em\" xml:space=\"preserve\">常用范围与队列优先级\u003c/tspan>\u003c/text>\u003c/g>\u003c/g>\u003cg transform=\"translate(87.5, 234.28141593933105)\" data-id=\"Input\" data-node=\"true\" id=\"flowchart-Input-497\" class=\"node default default flowchart-label\">\u003crect height=\"46\" width=\"175\" y=\"-23\" x=\"-87.5\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\">\u003c/rect>\u003cg transform=\"translate(0, -12)\" style=\"\" class=\"label\">\u003crect>\u003c/rect>\u003ctext style=\"\">\u003ctspan class=\"row\" x=\"0\" dy=\"1em\" xml:space=\"preserve\">预填输入与有界调用\u003c/tspan>\u003c/text>\u003c/g>\u003c/g>\u003cg transform=\"translate(322.5, 305.28141593933105)\" data-id=\"ModelPort\" data-node=\"true\" id=\"flowchart-ModelPort-500\" class=\"node default default flowchart-label\">\u003crect height=\"63\" width=\"175\" y=\"-31.5\" x=\"-87.5\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\">\u003c/rect>\u003cg transform=\"translate(0, -20.5)\" style=\"\" class=\"label\">\u003crect>\u003c/rect>\u003ctext style=\"\">\u003ctspan class=\"row\" x=\"0\" dy=\"1em\" xml:space=\"preserve\">PrefillModelPort\u003c/tspan>\u003ctspan class=\"row\" x=\"0\" dy=\"1em\" xml:space=\"preserve\">有界分析与依据复核\u003c/tspan>\u003c/text>\u003c/g>\u003c/g>\u003cg transform=\"translate(659.6484375, 305.28141593933105)\" data-id=\"Validate\" data-node=\"true\" id=\"flowchart-Validate-501\" class=\"node default default flowchart-label\">\u003crect height=\"46\" width=\"175\" y=\"-23\" x=\"-87.5\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\">\u003c/rect>\u003cg transform=\"translate(0, -12)\" style=\"\" class=\"label\">\u003crect>\u003c/rect>\u003ctext style=\"\">\u003ctspan class=\"row\" x=\"0\" dy=\"1em\" xml:space=\"preserve\">建议结构与来源校验\u003c/tspan>\u003c/text>\u003c/g>\u003c/g>\u003c/g>\u003c/g>\u003c/g>\u003c/svg>"},{"id":"S04","module":"M04","name":"M04 retrieval：候选检索与派生索引","heading":"S04 模块内部结构","filename":"knowledge-modules.md","source":"flowchart LR\n    Search[范围与候选续取\u003cbr/>融合 去重与配额补足]\n    Search -.-> VectorPort[VectorIndexPort\u003cbr/>搜索 写入与删除]\n    Build[检索文本与片段键构建] --> Apply[版本化索引写入]\n    Build --> Embed[文本向量化]\n    Embed -.-> EmbeddingPort[EmbeddingPort\u003cbr/>受许可的外部调用]\n    Apply -.-> VectorPort\n    Apply --> Store[(私有 store.rs\u003cbr/>索引版本与应用状态)]","context":"\u003cp>\u003cstrong>职责：\u003c/strong>按类型结合精确、关键词和向量候选，维护可重建索引与更新状态。正式正文与授权判断仍属于 M02 / M09 / M01；相似度不等于适用性或执行许可。另一个重排模型、Embedding 选择与参数由样例试验决定。\u003c/p>\n\u003cp>\u003cstrong>私有数据：\u003c/strong>索引配置/版本、向量模型与文本处理版本、索引应用状态；Milvus/Zilliz 派生条目包含空间、个人归属、对象 ID、正文版本、章节位置和检索文本。业务明细、原始对话、个人标识和凭据不批量写入共享索引。\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>公开操作\u003c/th>\u003cth>输入\u003c/th>\u003cth>输出\u003c/th>\u003cth>错误、副作用与幂等\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ccode>search_candidates\u003c/code>\u003c/td>\u003ctd>问句、可选向量、类型/本批候选量、M01 范围、索引版本、内部 \u003ccode>continuation?\u003c/code>\u003c/td>\u003ctd>候选 ID/版本/评分、各通道续取位置、耗尽状态\u003c/td>\u003ctd>只读，不暗中向量化；续取绑定问句/范围/索引指纹；无法继续返回 \u003ccode>continuation_invalid\u003c/code>，服务失败区别于无命中\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>merge_candidates\u003c/code>\u003c/td>\u003ctd>向量/关键词候选、M02/M09 精确与更新项候选\u003c/td>\u003ctd>去重且保留各类型的候选\u003c/td>\u003ctd>无持久副作用；相同输入确定融合，不以统一分数代替口径判断\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>build_index_payload\u003c/code>\u003c/td>\u003ctd>组合层交付的有效正文、允许索引范围、版本\u003c/td>\u003ctd>检索文本与确定的片段键\u003c/td>\u003ctd>字段保留完整含义/计算/提醒，指标保留分母与限制；不擅自读取正式表\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>embed_payload\u003c/code>\u003c/td>\u003ctd>已获端点授权的问句/索引文本及指纹、模型版本、M08 单次调用许可\u003c/td>\u003ctd>对应文本/模型版本的向量或失败/未知\u003c/td>\u003ctd>事务外调用；预算不可用时不发送；重试仍扣原预算范围\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>apply_index\u003c/code>\u003c/td>\u003ctd>对象/正文/索引版本、片段键、upsert/delete\u003c/td>\u003ctd>外部写入回执或未知状态\u003c/td>\u003ctd>网络在事务外；版本化键幂等，未知先查证；删除限指定版本键，旧任务不覆盖/误删新版\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>record_index_state_in_tx\u003c/code>\u003c/td>\u003ctd>写入回执、目标版本、租约代次\u003c/td>\u003ctd>当前/失败/未知索引状态\u003c/td>\u003ctd>仅匹配目标版本与代次可推进；旧任务结果不回退当前索引状态\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>\u003ccode>retrieve_context\u003c/code> 先经 M01 核对问句/必要资料可发送到 Embedding 端点，再以原 \u003ccode>user_request\u003c/code> 范围取得 M08 许可，复用 \u003ccode>embed_payload\u003c/code> 生成问句向量后传入只读检索。维护索引向量化沿用 \u003ccode>maintenance\u003c/code> 范围。没有向量许可时可用关键词/精确匹配继续，返回中明确降级范围；不得伪装已完成语义检索。\u003c/p>\n\u003cp>旧索引命中先回源取当前版本，再核对相关性、依赖、权限与状态；组合层还经 M03 核对引用的来源头，来源已变而依赖标记尚未扫完时也不能继续作为已核实依据。更新尚未完成时，从正式存储补查精确标识、别名和最新关联纠错；覆盖不足明确标为降级。长文命中补齐章节标题、范围、必要邻段与被引用规则，每段独立核对资料范围。\u003c/p>\n\u003cp>当前正式知识索引待办归 M02 的私有存储。领取先无锁查有待办的对象，再按对象 ID 取得主键行锁，跳过其他事务正在修改的对象，最后按作业主键处理当前版本；旧作业每对象每轮最多清理 64 条，领取每批最多 64 个当前对象。语义保存和受控重建同样先锁对象、后写作业，避免索引扫描持有作业锁再等待正在保存的对象。候选快照只提供查找范围，版本、目标代次、租约与三次耗尽条件都在锁内重新核对；正文读取锁内确定的不可变版本。网络索引仍在提交领取事务之后执行。\u003c/p>\n\u003cp>\u003ccode>retrieve_context\u003c/code> 按\u003cstrong>回源、授权、去重后的有效对象数\u003c/strong>核对每类配额，多个历史版本/片段不能占满对象配额；单对象片段另受上下文大小限制。配额不足且候选未耗尽时，使用内部续取位置补查并重复校验，不能首批过滤后直接判定资料不足。向量服务没有游标时，适配器用有界扩大候选量和已见键去重实现续取，不谎称有稳定分页能力。\u003c/p>\n\u003cp>初始补取限制建议为最多 5 批、累计 200 个候选、检索与回源合计 2 秒，均为配置初值并待小样调整，任一先到即停止；复用同一问句向量，不每批新调模型。范围/索引发生变化时在剩余总限制内重新开始，所有已见工作仍计入上限。结果记录 \u003ccode>quota_met / candidates_exhausted / bounded\u003c/code>；\u003ccode>bounded\u003c/code> 明确本轮覆盖不完整，候选耗尽只描述所查通道，不证明整个知识库不存在答案。外部仅返回允许内容、可见结果游标和通用覆盖说明，内部续取位置、被过滤数量及受限对象存在性不外泄。\u003c/p>","svg":"\u003csvg aria-roledescription=\"flowchart-v2\" role=\"graphics-document document\" viewBox=\"-8 -8 683.671875 328.75\" height=\"328.75\" xmlns=\"http://www.w3.org/2000/svg\" width=\"683.671875\" id=\"diagramS04\">\u003cstyle>#diagramS04{font-family:PingFang SC,Microsoft YaHei,Arial,sans-serif;font-size:17px;fill:#172c40;}#diagramS04 .error-icon{fill:#ffffff;}#diagramS04 .error-text{fill:#000000;stroke:#000000;}#diagramS04 .edge-thickness-normal{stroke-width:2px;}#diagramS04 .edge-thickness-thick{stroke-width:
