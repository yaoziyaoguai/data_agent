    <rect width="1920" height="900" fill="white"/>
    <text x="35" y="38" font-size="14" font-weight="600" fill="#577395" text-anchor="start" >DATA AGENT  /  C4 CONTAINER  /  02</text>
    <text x="35" y="82" font-size="34" font-weight="650" fill="#172e50" text-anchor="start" >工作台与 Agent</text>
    <text x="35" y="112" font-size="19" font-weight="400" fill="#607086" text-anchor="start" >同一对话持续多轮；Pi 负责调查，Rust 保存可核对的业务状态。</text>
    <text x="1885" y="38" font-size="15" font-weight="500" fill="#607086" text-anchor="end" >2026-10-07 · 当前实现 / 合成平台</text>
