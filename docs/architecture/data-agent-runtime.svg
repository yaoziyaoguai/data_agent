<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="900" viewBox="0 0 1920 900" role="img" aria-labelledby="title description"><title id="title">Data Agent 软件架构 · 工作台与 Agent</title><desc id="description">定稿架构由总览和工作台与 Agent、共享语义与查询、个人记忆三张详图呈现；共享语义与个人记忆使用百炼 Qwen 1024 维独立索引。组件、调用方向与职责不随视图变化。MySQL 保存正式状态，Pi 是唯一 Agent 循环，Mem0 处理个人记忆，Milvus 是可重建索引。</desc><g transform="translate(0 0)"><g class="view" data-view="runtime" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif">
