[package]
name = "data-agent-env-check"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
axum = "=0.8.9"
tokio = { version = "=1.53.1", features = ["macros", "rt-multi-thread", "net", "sync", "time"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
reqwest = { version = "=0.13.5", default-features = false, features = ["json", "rustls"] }
sqlx = { version = "=0.9.0", default-features = false, features = ["mysql", "runtime-tokio", "tls-rustls-ring", "migrate", "json"] }
