[package]
name = "data-agent"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sqlx = { version = "=0.9.0", default-features = false, features = ["mysql", "runtime-tokio", "tls-rustls-ring", "migrate", "json", "macros"] }
tokio = { version = "=1.53.1", features = ["macros", "rt-multi-thread", "net", "sync", "time"] }
jsonschema = { version = "=0.58.5", default-features = false }
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"

reqwest = { version = "=0.13.5", default-features = false, features = ["json", "rustls"] }
fastembed = { version = "=7.1.0", default-features = false, features = ["ort-download-binaries-rustls-tls", "hf-hub-rustls-tls"] }
